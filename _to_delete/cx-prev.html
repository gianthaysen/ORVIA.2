.gm-page .page-head h2{font-size:22px;font-weight:700;margin:0}
.gm-page .plan-hero h2{font-size:21px;font-weight:700;margin:5px 0 0}
.phase{min-width:0}
/* ====== GM7.2-Reparatur (Live-Tiefenrunde) ====== */
/* Status-Pill: passt jetzt IN den 150-px-Ring (kurzes Statuswort + harte Begrenzung),
   ragt nicht mehr heraus. */
.ring-c .statuspill{max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statuspill.sp-ready{color:var(--ready)}.statuspill.sp-attention{color:var(--attention)}.statuspill.sp-crit{color:var(--crit)}

/* Ambient-Aura hinter dem Hero — status-getönt, weich animiert. Der Hero hat overflow:hidden,
   die Aura sitzt darunter (z-index:0), Inhalt darüber. */
.hero > .hero-top,.hero > .reco,.hero > .cta-row,.hero > .batt,.hero > .adjust,.hero > .deltas{position:relative;z-index:1}
.hero-aura{position:absolute;top:-40%;left:-10%;right:-10%;height:150%;z-index:0;pointer-events:none;
  border-radius:50%;filter:blur(46px);opacity:.28;
  transition:opacity .6s ease, background .6s ease;
  background:radial-gradient(circle at 50% 30%, var(--neutral), transparent 68%)}
.hero-aura[data-aura="ready"]{background:radial-gradient(circle at 50% 30%, var(--ready), transparent 68%);opacity:.30}
.hero-aura[data-aura="attention"]{background:radial-gradient(circle at 50% 30%, var(--attention), transparent 68%);opacity:.30}
.hero-aura[data-aura="crit"]{background:radial-gradient(circle at 50% 30%, var(--crit), transparent 66%);opacity:.32}
.hero-aura[data-aura="neutral"]{opacity:.14}
@media (prefers-reduced-motion:reduce){ .hero-aura{transition:none} }
@media (prefers-reduced-transparency:reduce){ .hero-aura{display:none} }

/* ====== GM7-Reparatur (Stufen 4-6) ====== */
/* Profil (Stufe 5): #tab-mehr ist position:fixed;inset:0 (styles ~1093) und hatte als
   einzige Vollseite weder max-width noch margin — am Desktop fuellte es den Viewport
   und die 430-px-Unterseite (.gm-page, korrekt begrenzt in ~3079) schien durch. */
body.profile-open #tab-mehr{max-width:430px;margin:0 auto}

/* FAB (Stufe 5): #navPlus.fab (1,1,0) schlug die zentrierende .fab-Media-Regel (0,1,0)
   — Media Queries erhoehen die Spezifitaet nicht. Gleiche Selektor-Staerke: */
@media(min-width:431px){#navPlus.fab{right:calc(50% - 215px + 18px)}}

/* Liquid-Nav (Stufe 6, Variante 1): Drag-Feedback aus dem GM nachgezogen. */
.tabwrap .glass-indicator{transition:left .32s cubic-bezier(.34,1.35,.4,1),width .32s cubic-bezier(.34,1.35,.4,1),transform .18s ease}
.tabwrap.dragging .glass-indicator{transition:left .09s linear,width .09s linear,transform .12s ease;transform:scaleY(.9) scaleX(1.05)}
.tabwrap.dragging button .ic{transform:scale(.94)}

/* Reduced Motion (Stufe 6): vollstaendige Nav-Abdeckung (vorher nur Indicator+FAB). */
@media (prefers-reduced-motion:reduce){
  .tabbar,.tabwrap button,.tabwrap button .ic,.tabbar button .ic{transition:none!important}
  .tabbar button.pop .ic{animation:none!important}
  .tabwrap.dragging .glass-indicator,.tabwrap.dragging button .ic{transform:none}
}
/* Reduzierte Transparenz (progressive Ergaenzung; Fallback unten gilt unabhaengig). */
@media (prefers-reduced-transparency:reduce){
  .tabwrap{background:rgba(14,18,26,.96);backdrop-filter:none;-webkit-backdrop-filter:none}
  .sheet{backdrop-filter:none;-webkit-backdrop-filter:none}
}
/* Solider Fallback ohne backdrop-filter-Unterstuetzung. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tabwrap{background:rgba(14,18,26,.96)}
}

/* Anatomische Koerperkarte (Stufe 4): reaktivierte BODY_ANT/BODY_POST-Polygone. */
.body-wrap .bodysvg.anat{max-width:230px;width:100%;display:block}
.bodysvg.anat .mgrp{cursor:pointer}
.bodysvg.anat .mgrp:focus-visible polygon{stroke:var(--gold-soft,#c9ae7c);stroke-width:1.2}
/* GM7.9h: Die allgemeinen Rueckmeldungsregeln (.mgrp:hover/:active rect, oben) greifen auf der
   anatomischen Karte nicht — sie zeichnet <polygon>, nicht <rect>. Fuer den Tastaturfokus wurde
   das bereits nachgezogen, fuer Tippen/Zeiger bisher nicht: ein angetippter Muskel gab keinerlei
   visuelle Rueckmeldung. Gleiche Wirkung wie bei der rect-Variante (volle Deckkraft). */
.bodysvg.anat .mgrp:hover polygon,
.bodysvg.anat .mgrp:active polygon{fill-opacity:1}
.bodysvg.anat .mglyph{font-size:6px}
/* ====== GM-ENDE ====== */

/* ============================================================
   GM7.8 · Post-Workout-Story — Vollbild-Erzählung einer abgeschlossenen Einheit.
   Reine Darstellung bereits kanonischer Werte (Route, Streams, Runden, Debrief,
   Lastmodell). Keine Datenlogik, keine erfundenen Inhalte.
   ============================================================ */
/* GM7.9e: Die Story ist die oberste Vollbild-Ebene und wird u. a. AUS dem
   Aktivitaetsdetail (.gm-page, z-index 140) heraus geoeffnet — sie muss darueber
   liegen, sonst startet sie unsichtbar im Hintergrund. Bleibt unter Onboarding
   (300)/Splash (500)/Gate (600). */
.gm-story{position:fixed;inset:0;z-index:200;display:none;background:#05080d;
  color:var(--text);overflow:hidden;touch-action:manipulation}
.gm-story.on{display:block}
.gm-story .wst-page{position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(var(--sat) + 54px) 22px calc(env(safe-area-inset-bottom,0px) + 26px)}
.gm-story .wst-page.on{display:flex}
.gm-story .wst-bg{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:radial-gradient(120% 70% at 50% 0%,var(--acc,rgba(67,214,147,.30)),transparent 62%)}
.gm-story .wst-in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;min-height:0}
/* Fortschrittsbalken oben (Insta-Muster) */
.gm-story .wst-bars{position:absolute;top:calc(var(--sat) + 12px);left:14px;right:14px;
  display:flex;gap:5px;z-index:4}
.gm-story .wst-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.20);overflow:hidden;position:relative}
.gm-story .wst-bars i b{position:absolute;inset:0;width:0;background:#fff;border-radius:2px;display:block}
.gm-story .wst-bars i.done b{width:100%}
.gm-story .wst-bars i.act b{width:100%;transition:width var(--st-dur,6s) linear}
.gm-story .wst-x{position:absolute;top:calc(var(--sat) + 24px);right:14px;z-index:5;
  width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.10);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font)}
/* Tap-Zonen links/rechts */
.gm-story .wst-nav{position:absolute;top:0;bottom:0;width:34%;z-index:3;background:transparent;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gm-story .wst-nav.prev{left:0}.gm-story .wst-nav.next{right:0;width:66%}
/* Inhalte */
.gm-story .wst-kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.gm-story .wst-h{font-size:29px;font-weight:850;letter-spacing:-.02em;margin-top:6px;line-height:1.12}
.gm-story .wst-sub{font-size:13px;color:var(--muted);font-weight:650;margin-top:6px}
.gm-story .wst-big{font-size:58px;font-weight:850;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;margin-top:auto}
.gm-story .wst-big small{font-size:19px;color:var(--muted);font-weight:750;margin-left:6px}
.gm-story .wst-note{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:12px}
.gm-story .wst-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:16px}
.gm-story .wst-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gm-story .wst-cell{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:13px 14px}
.gm-story .wst-cell b{display:block;font-size:23px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gm-story .wst-cell span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:3px}
.gm-story .wst-map{position:relative;margin-top:18px;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);padding:10px}
.gm-story .wst-map svg{width:100%;height:auto;display:block}
/* Route zeichnet sich einmal durch (GM-Muster: stroke-dasharray) */
.gm-story .wst-map .gm-route-line{stroke-dasharray:var(--rl);stroke-dashoffset:var(--rl);
  animation:stDraw 3.8s cubic-bezier(.35,0,.15,1) forwards}
@keyframes stDraw{to{stroke-dashoffset:0}}
.gm-story .wst-lap{display:grid;grid-template-columns:30px 1fr 54px;align-items:center;gap:9px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.07);font-size:11px}
.gm-story .wst-lap i{display:block;height:20px;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--activity));opacity:.85}
.gm-story .wst-lap strong{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.gm-story .wst-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.gm-story .wst-tags span{font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:var(--muted)}
.gm-story .wst-cta{margin-top:14px;display:flex;gap:10px}
.gm-story .wst-cta button{flex:1;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);color:var(--text);font-family:var(--font);font-weight:800;font-size:13.5px;cursor:pointer}
.gm-story .wst-cta button.prim{background:var(--gold-grad,linear-gradient(135deg,#DCC79A,#C9AE7C));color:#20180a;border:none}
@media (prefers-reduced-motion:reduce){
  .gm-story .wst-map .gm-route-line{animation:none;stroke-dashoffset:0}
  .gm-story .wst-bars i.act b{transition:none;width:100%}
}


/* ============================================================
   GM7.9 · Story-Redesign (Runna-inspiriert) + Gym-Aktivitätsdetail.
   Reine Darstellung — Datenquellen unverändert.
   ============================================================ */
/* Warme sportartspezifische Verlaufs-Hintergründe (Akzent via --acc/--accsoft inline) */
.gm-story .wst-bg{opacity:1;background:
  radial-gradient(150% 95% at 50% -12%,var(--accsoft,rgba(67,214,147,.28)),transparent 58%),
  radial-gradient(120% 70% at 50% 118%,var(--accsoft,rgba(67,214,147,.28)),transparent 55%),
  linear-gradient(180deg,#0a1018,#05080d)}
/* Titel oben links: Einheitsname + Datum */
.gm-story .wst-top{display:flex;flex-direction:column;gap:2px;padding-right:44px;flex:none}
.gm-story .wst-top b{font-size:14.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-story .wst-top span{font-size:11.5px;color:var(--muted);font-weight:650}
/* Mittelteil füllt die Seite; Headline unten */
.gm-story .wst-mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:hidden;margin-top:10px}
.gm-story .wst-foot{flex:none;margin-top:14px}
.gm-story .wst-hl{font-size:31px;font-weight:850;letter-spacing:-.025em;line-height:1.14;animation:wstUp .85s cubic-bezier(.2,.7,.2,1) .18s both}
.gm-story .wst-hl .wst-em{color:var(--acc,#43D693);font-style:normal}
.gm-story .wst-hsub{font-size:13px;color:var(--muted);font-weight:650;margin-top:8px;line-height:1.5;animation:wstUp .85s cubic-bezier(.2,.7,.2,1) .46s both}
@media (max-width:359px){.gm-story .wst-hl{font-size:26px}}
/* Cover: Route gross und rahmenlos / grosse Kennzahl.
   GM7.9e: Die Route bekommt die volle freie Hoehe der Seite (vorher fixe 16:9-Kachel
   mit ~195px Hoehe → grosse Leerflaechen ober- und unterhalb). Das SVG traegt jetzt ein
   an die echte Routenform angepasstes viewBox-Verhaeltnis, dadurch skaliert es formtreu
   in den verfuegbaren Raum. */
.gm-story .wst-map.big{margin-top:0;border:none;background:transparent;padding:0;
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.gm-story .wst-map.big svg{width:100%;height:100%;max-height:none}
.gm-story .wst-bignum{text-align:center}
.gm-story .wst-kick.ctr{text-align:center}
.gm-story .wst-bignum b{font-size:96px;font-weight:850;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;display:block;white-space:nowrap;animation:wstUp .9s cubic-bezier(.2,.7,.2,1) .2s both}
/* GM7.9e: Einheiten ("h", "min", "km") laufen inline und kleiner mit — vorher brach z. B.
   "1 h 21 min" um und das "min" stand allein und verloren in der naechsten Zeile. */
.gm-story .wst-bignum b small{font-size:.34em;font-weight:800;color:var(--muted);
  letter-spacing:0;margin:0 .04em 0 .1em;vertical-align:baseline}
.gm-story .wst-bignum.long b{font-size:64px}
.gm-story .wst-bignum span{display:block;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:10px}
@media (max-width:359px){.gm-story .wst-bignum b{font-size:72px}.gm-story .wst-bignum.long b{font-size:52px}}
/* Runden/Übungen: gestaffelter Einflug von links */
.gm-story .wst-laps{display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:0;overflow:hidden}
.gm-story .wst-lap{grid-template-columns:44px 1fr 62px;border-bottom:none;padding:5px 0;opacity:0;transform:translateX(-46px);animation:wstIn .75s cubic-bezier(.2,.7,.2,1) forwards}
.gm-story .wst-lap i{height:26px;border-radius:8px;background:linear-gradient(90deg,var(--acc,#43D693),rgba(255,255,255,.22));opacity:.9}
.gm-story .wst-lap.best i{opacity:1;box-shadow:0 0 18px var(--accsoft,rgba(67,214,147,.3))}
.gm-story .wst-lap.best strong{color:var(--acc,#43D693)}
.gm-story .wst-lap strong{font-size:13.5px}
.gm-story .wst-lap span{font-size:11.5px;color:var(--muted);font-weight:800}
.gm-story .wst-ex{opacity:0;transform:translateX(-46px);animation:wstIn .75s cubic-bezier(.2,.7,.2,1) forwards;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.gm-story .wst-exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gm-story .wst-exh b{font-size:13.5px;font-weight:800}
.gm-story .wst-exh span{font-size:11px;color:var(--acc,#43D693);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.gm-story .wst-exd{font-size:11.5px;color:var(--muted);font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.gm-story .wst-cell{opacity:0;transform:translateY(22px);animation:wstIn .75s cubic-bezier(.2,.7,.2,1) forwards}
.gm-story .wst-debrief{font-size:15px;line-height:1.65;color:var(--text)}
/* Dot-Matrix-Flächenchart */
.gm-story .wst-dotwrap{position:relative;flex:1;min-height:180px;max-height:52dvh;margin:6px 0}
.gm-story .wst-dots{position:absolute;inset:0;width:100%;height:100%}
/* GM7.9e: Die Flaeche unter der Kurve dominierte optisch so stark, dass der Verlauf
   "konstant" wirkte. Die obersten Punkte jeder Spalte (= der tatsaechliche Messwert)
   sind jetzt hell, die Flaeche darunter gedaempft — die Kontur wird lesbar, ohne dass
   ein einziger Wert veraendert, geglaettet oder interpoliert wird. */
.gm-story .wst-dots circle{fill:var(--acc,#43D693);opacity:.30}
.gm-story .wst-dots circle.t0{opacity:1}
.gm-story .wst-dots circle.t1{opacity:.72}
.gm-story .wst-dots circle.t2{opacity:.48}
.gm-story .wst-dc{opacity:0;animation:wstDot .6s ease-out forwards}
.gm-story .wst-avg{stroke:rgba(255,255,255,.75);stroke-width:1.4;stroke-dasharray:5 5}
.gm-story .wst-avgbadge{position:absolute;right:0;transform:translateY(-50%);background:#fff;color:#0a0f16;
  font-size:11.5px;font-weight:850;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;
  box-shadow:0 4px 14px rgba(0,0,0,.35);animation:wstUp .6s ease-out 2.5s both}
.gm-story .wst-ax{position:absolute;left:2px;font-size:10px;color:rgba(255,255,255,.72);font-weight:800;font-variant-numeric:tabular-nums;background:rgba(5,8,13,.62);padding:2px 6px;border-radius:7px;backdrop-filter:blur(2px)}
.gm-story .wst-axmax{top:2px}
.gm-story .wst-axmin{bottom:2px}
@keyframes wstIn{to{opacity:1;transform:none}}
@keyframes wstUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes wstDot{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .gm-story .wst-hl,.gm-story .wst-hsub,.gm-story .wst-lap,.gm-story .wst-ex,.gm-story .wst-cell,
  .gm-story .wst-dc,.gm-story .wst-avgbadge,.gm-story .wst-bignum b{animation:none;opacity:1;transform:none}
}
/* Gym-Aktivitätsdetail: Übungs- & Satzliste (echte gespeicherte Sätze) */
.gymex{padding:10px 0;border-bottom:1px solid var(--hairline)}
.gymex:last-child{border-bottom:none;padding-bottom:2px}
.gymex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gymex-head b{font-size:13px;font-weight:750}
.gymex-head span{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.gymset-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:3px 0;font-variant-numeric:tabular-nums}
.gymset-row strong{color:var(--text);font-weight:700}
.gymset-row .gs-x{opacity:.6}
.gymset-row > span:first-child{width:52px;font-size:10.5px;font-weight:700;flex:none}
/* GM7.9c: „Neue Bestzeit"-Seite in der Story — eigener Gold-Akzent unabhaengig von der
   Sportart-Theme-Farbe (klar erkennbarer Ausnahme-Moment, kein Standard-Seitentyp). */
.gm-story .wst-bg.pr{opacity:1;background:
  radial-gradient(140% 90% at 50% -10%,rgba(220,199,154,.40),transparent 55%),
  radial-gradient(120% 60% at 50% 112%,rgba(220,199,154,.22),transparent 55%),
  linear-gradient(180deg,#141008,#0a0805 60%,#05080d)}
.gm-story .wst-kick.pr{display:inline-flex;align-items:center;gap:7px;color:var(--gold,#DCC79A);
  text-transform:uppercase;letter-spacing:.14em;font-weight:850;animation:wstUp .8s ease-out both}
.gm-story .wst-kick.pr svg{width:14px;height:14px}
.gm-story .wst-prval{font-size:64px;font-weight:850;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;margin-top:16px;
  background:linear-gradient(135deg,#F3E7C9,#DCC79A 55%,#B99A63);-webkit-background-clip:text;
  background-clip:text;color:transparent;animation:wstUp .9s cubic-bezier(.2,.7,.2,1) .2s both}

/* Phase 1b — entschaerfte Attrappen: sichtbar als Information, nicht als Bedienelement. */
.adjchip.adj-na{opacity:.55;cursor:default;pointer-events:none}
.stepper.stepper-na{display:flex;align-items:center;justify-content:flex-end;min-width:64px}
.stepper.stepper-na strong{color:var(--muted)}

/* ====== Planvarianten A/B/C (2026-08-04): entfallende Einheiten der gewaehlten
   Variante bleiben sichtbar, aber klar zurueckgenommen — keine Entfernung,
   keine Planmutation. ====== */
.session-card.pvar-skip{opacity:.45}
.session-card.pvar-skip .session-state{color:var(--muted)}
/* Medaillen: verdiente Auszeichnung (im Gegensatz zu .medal.locked) */
.medal.earned{border-color:var(--gold,#c9ae7c)}
.medal.earned .m-badge{color:var(--gold,#c9ae7c)}

/* ====== P0 2026-08-05: Wiedereinstieg in laufendes Workout (#resumeBanner) ====== */
.resume-banner{display:flex;align-items:center;gap:12px;margin:0 18px 12px;padding:13px 15px;cursor:pointer;border-color:var(--activity,#e0904e)}
.resume-banner .rb-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--activity-t,rgba(224,144,78,.14));color:var(--activity,#e0904e);flex-shrink:0}
.resume-banner .rb-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.resume-banner .rb-b b{font-size:13.5px}
.resume-banner .rb-b span{font-size:11.5px;color:var(--muted)}
.resume-banner .rb-cta{font-size:12px;font-weight:800;color:var(--activity,#e0904e);white-space:nowrap}

/* ═══════════════════════════════════════════════════════════════════════════
   LIQUID-GLASS-TABBAR — konsolidierte Definition (2026-08-06)

   WARUM AM DATEIENDE: In styles.css lagen FÜNF Tabbar-Generationen übereinander
   (~84, ~417, ~506, ~2704, ~3005, ~3077, ~3441), teils mit !important. Jede neue
   Ebene stapelte eigene ::before/::after-Glasflächen auf die vorige — genau die
   „Glas auf Glas"-Situation, die trübe wirkt und unnötig GPU kostet. Statt eine
   sechste Ebene daraufzusetzen, steht hier EINE Definition, die die Bar
   vollständig beschreibt und die Altlasten gezielt abschaltet.

   EBENEN (bewusst vier, nicht mehr):
     1  .tabwrap          Grundkörper: EIN backdrop-filter, halbtransparenter
                          Verlauf, Kontur aus Lichtkanten statt aus 1px-Rahmen
     2  .tabglass         obere Lichtkante, per mask zum Rand auslaufend
     3  .tabglass::after  Specular, folgt dem Zeiger — nur bei echtem Pointer
     4  .glass-indicator  aktive Kapsel, gleitet per translate3d (js/ui.js)

   Alle Kennwerte als Custom Properties, damit Theme und Debugging an einer
   Stelle greifen.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --orvia-glass-blur:30px;
  --orvia-glass-saturation:170%;
  --orvia-glass-contrast:106%;
  --orvia-glass-brightness:106%;
  --orvia-glass-bg:linear-gradient(178deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 46%,rgba(255,255,255,.03));
  --orvia-glass-tint:linear-gradient(160deg,rgba(38,52,72,.44),rgba(11,17,27,.36) 58%,rgba(8,12,20,.46));
  --orvia-glass-edge-light:rgba(255,255,255,.40);
  --orvia-glass-edge-dark:rgba(0,0,0,.22);
  --orvia-glass-shadow:0 18px 46px rgba(0,0,0,.42),0 3px 12px rgba(0,0,0,.26);
  --orvia-glass-highlight:rgba(255,255,255,.26);
  --orvia-tab-active:var(--accent-soft,#DCC79A);
  /* Bewusst heller als das globale --text-faint: Glas laesst den Inhalt durch, und
     ueber hellen Flaechen verschwand ein #656C79-Label fast vollstaendig. Gemessen
     im Screenshot-Test ueber einem bunten Verlauf. */
  --orvia-tab-inactive:rgba(233,240,250,.72);
  --orvia-tabbar-inline:clamp(10px,4.2vw,22px);
  --orvia-tabbar-bottom:clamp(8px,2.4vh,18px);
  --orvia-tabbar-h:52px;
  --orvia-tabbar-pad:5px;      /* Innenabstand der Kapsel — geht in die Gesamthoehe ein */
  --orvia-tabbar-scale:1;
}
/* Bodenfreiheit folgt derselben Rechnung wie die Bar — eine Quelle, kein Sprung. */
.wrap{padding-bottom:calc(env(safe-area-inset-bottom) + var(--orvia-tabbar-bottom) + var(--orvia-tabbar-h) + (var(--orvia-tabbar-pad) * 2) + 64px)}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  z-index:50;pointer-events:none;isolation:isolate;
  padding:0 var(--orvia-tabbar-inline) calc(env(safe-area-inset-bottom) + var(--orvia-tabbar-bottom));
  /* Nur ein kurzer Abdunkler direkt unter der Bar. Der frühere Verlauf über die
     halbe Bildschirmhöhe nahm ihr genau den Schwebe-Eindruck. */
  background:linear-gradient(to top,rgba(6,10,17,.55),rgba(6,10,17,.15) 44%,transparent 78%)}
.tabwrap{position:relative;pointer-events:auto;display:flex;gap:2px;
  padding:var(--orvia-tabbar-pad) 8px;border-radius:999px;border:none!important;overflow:visible;isolation:isolate;
  transform:scale(var(--orvia-tabbar-scale));transform-origin:50% 100%;
  transition:transform .34s cubic-bezier(.22,1,.36,1);
  background:var(--orvia-glass-bg),var(--orvia-glass-tint)!important;
  backdrop-filter:blur(var(--orvia-glass-blur)) saturate(var(--orvia-glass-saturation)) contrast(var(--orvia-glass-contrast)) brightness(var(--orvia-glass-brightness))!important;
  -webkit-backdrop-filter:blur(var(--orvia-glass-blur)) saturate(var(--orvia-glass-saturation)) contrast(var(--orvia-glass-contrast)) brightness(var(--orvia-glass-brightness))!important;
  box-shadow:
    inset 0 1px 0 var(--orvia-glass-edge-light),
    inset 0 -1px 0 var(--orvia-glass-edge-dark),
    inset 0 -16px 24px rgba(6,10,18,.28),
    var(--orvia-glass-shadow)!important}
/* Altlasten der früheren Generationen abschalten (sonst Glas auf Glas). */
.tabwrap::before,.tabwrap::after{content:none!important}
.tabwrap button.on::before{display:none!important}
.tabbar button.on::after,.tabbar button[data-tab].on::after{content:none!important}

/* Ebene 2: Lichtkante oben, zu den Seiten auslaufend. */
.tabglass{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 36%),
             radial-gradient(120% 90% at 50% -30%,var(--orvia-glass-highlight),transparent 62%);
  -webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.32) 54%,transparent);
  mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.32) 54%,transparent)}
/* Ebene 3: Specular. Deckkraft 0 bis js sie bei echtem Pointer setzt ⇒ auf Touch
   entsteht weder Sichtbares noch Dauerlast. */
.tabglass::after{content:"";position:absolute;inset:0;pointer-events:none;
  opacity:var(--spec-o,0);transition:opacity .25s;
  background:radial-gradient(54px 36px at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.30),transparent 70%)}

.tabbar button[data-tab]{width:auto;min-width:58px;height:var(--orvia-tabbar-h);border-radius:999px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;z-index:2;padding:0 8px;background:none;border:none;cursor:pointer;
  color:var(--orvia-tab-inactive);-webkit-tap-highlight-color:transparent;
  transition:color .22s ease,transform .16s cubic-bezier(.22,1,.36,1)}
.tabbar button[data-tab] .ic{width:21px;height:21px;
  transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .22s}
.tabbar .tl{font-size:9px;font-weight:750;letter-spacing:.01em;line-height:1;white-space:nowrap}
/* Lesbarkeit ueber BELIEBIGEM Untergrund: das Glas zeigt den Inhalt darunter, der
   hell oder dunkel sein kann. Ein sehr schwacher dunkler Saum haelt Icons und
   Labels in beiden Faellen lesbar, ohne dass es wie ein Schlagschatten wirkt. */
.tabbar button[data-tab] .tl{text-shadow:0 1px 2px rgba(4,8,14,.45)}
.tabbar button[data-tab] .ic{filter:drop-shadow(0 1px 1.5px rgba(4,8,14,.4))}
[data-theme="light"] .tabbar button[data-tab] .tl{text-shadow:0 1px 2px rgba(255,255,255,.7)}
[data-theme="light"] .tabbar button[data-tab] .ic{filter:drop-shadow(0 1px 1.5px rgba(255,255,255,.75))}
.tabbar button[data-tab].on{color:var(--orvia-tab-active)}
.tabbar button[data-tab].on .ic{transform:translateY(-1px) scale(1.06)}
/* Interaktion: kurze physische Kompression, kein Ripple. */
.tabbar button[data-tab]:active{transform:scale(.95) translateY(1px)}
.tabbar button[data-tab]:focus-visible{outline:2px solid var(--accent,#C9AE7C);outline-offset:2px}

/* Ebene 4: aktive Kapsel — Position/Breite aus dem DOM (js/ui.js), Bewegung per
   translate3d auf dem Compositor statt per `left` (das erzwänge Layout je Frame). */
.tabwrap .glass-indicator{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;
  z-index:1;pointer-events:none;will-change:transform;border:none!important;
  background:linear-gradient(168deg,rgba(255,255,255,.20),rgba(255,255,255,.06) 55%,rgba(201,174,124,.10))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.44),inset 0 -1px 0 rgba(0,0,0,.16),0 4px 14px rgba(0,0,0,.22)!important;
  transition:transform .42s cubic-bezier(.22,1,.36,1),width .42s cubic-bezier(.22,1,.36,1)}
/* Drag: die Kapsel folgt enger, ohne die Positionierung zu übernehmen —
   die frühere Regel setzte hier ein scale-transform und löschte damit translate3d. */
.tabwrap.dragging .glass-indicator{transition:transform .10s linear,width .10s linear}
.tabwrap.dragging button .ic{transform:scale(.94)}

/* Komprimierter Zustand: nur Größe. Labels und Touch-Targets bleiben. */
.tabbar.compact{--orvia-tabbar-scale:.93}
.tabbar.compact .tl{opacity:.7;transition:opacity .3s}

/* Helles Theme: dieselbe Struktur, andere Lichtwerte. */
[data-theme="light"] .tabbar{background:linear-gradient(to top,rgba(226,235,246,.62),transparent 78%)}
[data-theme="light"] .tabwrap{
  --orvia-glass-tint:linear-gradient(160deg,rgba(255,255,255,.62),rgba(232,240,250,.48) 58%,rgba(218,230,244,.58));
  --orvia-glass-edge-light:rgba(255,255,255,.92);
  --orvia-glass-edge-dark:rgba(40,60,90,.14);
  --orvia-glass-shadow:0 18px 42px rgba(30,50,90,.20),0 3px 10px rgba(30,50,90,.12);
  --orvia-glass-highlight:rgba(255,255,255,.55)}
[data-theme="light"] .tabbar button[data-tab]{color:#5b6675}
[data-theme="light"] .tabbar button[data-tab].on{color:#2a3242}
[data-theme="light"] .tabwrap .glass-indicator{
  background:linear-gradient(168deg,rgba(255,255,255,.86),rgba(255,255,255,.5) 55%,rgba(201,174,124,.16))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 12px rgba(30,50,90,.16)!important}

/* Fallback ohne backdrop-filter: deckend, aber weiterhin als Körper lesbar. */
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){
  .tabwrap{background:linear-gradient(178deg,rgba(24,32,46,.97),rgba(12,18,28,.98))!important}
  .tabbar{background:linear-gradient(to top,rgba(6,10,17,.90),transparent 82%)}
  [data-theme="light"] .tabwrap{background:linear-gradient(178deg,rgba(250,252,255,.97),rgba(236,242,250,.98))!important}
}
/* Reduzierte Transparenz: Blur aus, Kontrast rauf. */
@media (prefers-reduced-transparency:reduce){
  .tabwrap{background:rgba(14,18,26,.96)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .tabglass{opacity:.4}
}
/* Reduced Motion: keine Bewegung, Zustand bleibt eindeutig ablesbar. */
@media (prefers-reduced-motion:reduce){
  .tabwrap,.tabwrap .glass-indicator,.tabbar button[data-tab],.tabbar button[data-tab] .ic{transition:none!important}
  .tabbar.compact{--orvia-tabbar-scale:1}
  .tabglass::after{display:none}
}
/* Landscape / sehr flache Viewports: niedriger, Labels bleiben. */
@media (max-height:460px){:root{--orvia-tabbar-h:46px}.tabbar .tl{font-size:8.5px}}
/* Sehr schmal (320 px): Innenabstand runter statt Labels abschneiden. */
@media (max-width:340px){.tabbar button[data-tab]{min-width:52px;padding:0 4px}.tabwrap{padding:5px 6px}}
/* Tastatur sichtbar: Bar weg (bestehendes .kb-Verhalten bleibt gültig). */
.tabbar.kb{transform:translateY(130%)}
/* Breite Viewports: Die Bar folgt der 430-px-Spalte der App. Eine fruehere Regel
   (styles.css ~3096) loeste das ueber left:50% + translateX(-50%); da diese
   konsolidierte Definition left:0/right:0 setzt, blieb dort nur das transform
   uebrig und schob die Bar um die halbe Breite nach links aus dem Bild.
   Zentriert wird jetzt ueber margin-inline — das kollidiert mit keinem transform
   (.tabbar.kb braucht transform weiterhin fuer das Wegfahren bei Tastatur). */
.tabbar{max-width:430px;margin-inline:auto}
@media(min-width:431px){
  .tabbar{left:0;right:0;transform:none}
  .tabbar.kb{transform:translateY(130%)}
}

/* ═══════════════════════════════════════════════════════════════════════════
   PLUS-BUTTON als Gold-Glaskörper (2026-08-06)

   ENTSCHEIDUNG ZUR HIERARCHIE: Der Plus ist eine AKTION, die fünf Tabs sind
   NAVIGATION. Er bekommt deshalb dieselbe Materialsprache wie die Bar
   (Backdrop-Brechung, Lichtkanten, Specular, gleiche Bewegungsphysik), behält
   aber seinen goldenen Kern. Ihn zu neutralem Glas zu machen hätte die
   Unterscheidung eingeebnet — er wäre eine leere Blase ohne Signalwirkung.
   Der Goldanteil bleibt kräftig genug, dass das dunkle Icon über beliebigem
   Untergrund lesbar bleibt; Glas ersetzt hier die Fläche, nicht die Farbe.

   BEHOBEN NEBENBEI: Die bisher stärkste Regel (#navPlus.fab, styles.css ~3103)
   setzte bottom:94px OHNE env(safe-area-inset-bottom) — auf iPhones mit
   Home-Indicator saß der Button dadurch zu tief. Die Position folgt jetzt
   denselben Tokens wie die Bar, sodass beide zusammen wandern.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --orvia-fab-size:56px;
  --orvia-fab-gap:16px;            /* Abstand zwischen Bar-Oberkante und Button */
  /* Deckkraft bewusst unter 1: der Hintergrund toent das Gold sichtbar durch
     (Glas statt Farbfleck). Untergrenze ist die Lesbarkeit des dunklen Icons —
     unterhalb ~.78 verliert es ueber hellem Inhalt den Kontrast. Im Screenshot-
     Test ueber einem bunten Verlauf geprueft. */
  --orvia-fab-gold-a:rgba(236,214,172,.86);
  --orvia-fab-gold-b:rgba(201,174,124,.80);
  --orvia-fab-gold-c:rgba(146,120,74,.80);
}
#navPlus.fab{
  position:fixed;left:auto;top:auto;margin:0;padding:0;z-index:51;
  right:var(--orvia-tabbar-inline);
  /* Die sichtbare Barhoehe ist --orvia-tabbar-h PLUS ihr Innenabstand oben und
     unten. Ohne diesen Term rutschte der Button 10 px zu tief und der Abstand
     zur Bar schrumpfte auf 6 px (im Layout-Test gemessen). */
  bottom:calc(env(safe-area-inset-bottom) + var(--orvia-tabbar-bottom) + var(--orvia-tabbar-h) + (var(--orvia-tabbar-pad) * 2) + var(--orvia-fab-gap));
  width:var(--orvia-fab-size);height:var(--orvia-fab-size);border-radius:50%;
  border:none;cursor:pointer;color:#241a08;overflow:visible;isolation:isolate;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  /* Goldenes Glas: halbtransparenter Verlauf ÜBER der Hintergrundbrechung —
     der Inhalt dahinter tönt das Material, statt eine flache Fläche zu sein. */
  background:
    radial-gradient(78% 68% at 34% 22%,rgba(255,255,255,.50),transparent 58%),
    linear-gradient(158deg,var(--orvia-fab-gold-a),var(--orvia-fab-gold-b) 52%,var(--orvia-fab-gold-c));
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  /* Kontur aus Licht, wie bei der Bar: helle Oberkante, dunkle Unterkante, Tiefe. */
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.72),
    inset 0 -1.5px 0 rgba(88,62,20,.34),
    inset 0 -8px 14px rgba(120,88,36,.22),
    0 14px 32px rgba(201,174,124,.30),
    0 4px 12px rgba(0,0,0,.34);
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s cubic-bezier(.22,1,.36,1)}
/* Specular: derselbe Zeiger-abhängige Lichtpunkt wie auf der Bar. Deckkraft 0,
   bis js sie bei echtem Pointer setzt ⇒ auf Touch keine Dauerlast. */
#navPlus.fab::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:var(--spec-o,0);transition:opacity .25s;
  background:radial-gradient(26px 20px at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.55),transparent 72%)}
#navPlus.fab .ic{width:25px;height:25px;stroke-width:2.4;position:relative;z-index:1;
  filter:drop-shadow(0 1px 1px rgba(255,255,255,.35));
  transition:transform .3s cubic-bezier(.22,1,.36,1)}
/* Interaktion: dieselbe Kompression wie die Tabs, plus die bestehende Icon-Drehung. */
#navPlus.fab:active{transform:scale(.94);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.72),inset 0 -1.5px 0 rgba(88,62,20,.34),
             0 6px 16px rgba(201,174,124,.26),0 2px 6px rgba(0,0,0,.30)}
#navPlus.fab:active .ic{transform:rotate(90deg)}
#navPlus.fab:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* Beim Komprimieren geht der Button mit — sonst risse der optische Verbund auf. */
.tabbar.compact ~ #navPlus.fab,.tabbar.compact + #navPlus.fab{transform:scale(.93) translateY(3px)}
/* Tastatur sichtbar: mit der Bar wegfahren (bestehendes Verhalten, an die neue
   Spezifität angepasst — die alte Regel .tabbar.kb ~ .fab wäre unterlegen). */
.tabbar.kb ~ #navPlus.fab,.tabbar.kb + #navPlus.fab{transform:translateY(240%)}
/* Breite Viewports: dem 430-px-Raster der App folgen. */
@media(min-width:431px){
  #navPlus.fab{right:calc(50% - 215px + var(--orvia-tabbar-inline))}
}
[data-theme="light"] #navPlus.fab{
  color:#2a1f08;
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.9),
    inset 0 -1.5px 0 rgba(120,92,40,.26),
    0 12px 28px rgba(160,130,70,.28),
    0 3px 10px rgba(40,60,90,.18)}
/* Fallback ohne backdrop-filter: deckendes Gold, gleiche Form und Tiefe. */
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){
  #navPlus.fab{background:
    radial-gradient(78% 68% at 34% 22%,rgba(255,255,255,.42),transparent 58%),
    linear-gradient(158deg,#E8D1A6,#C9AE7C 52%,#967C4E)}
}
@media (prefers-reduced-transparency:reduce){
  #navPlus.fab{backdrop-filter:none;-webkit-backdrop-filter:none;
    background:linear-gradient(158deg,#E8D1A6,#C9AE7C 52%,#967C4E)}
}
@media (prefers-reduced-motion:reduce){
  #navPlus.fab,#navPlus.fab .ic{transition:none!important}
  .tabbar.compact ~ #navPlus.fab,.tabbar.compact + #navPlus.fab{transform:none}
  #navPlus.fab::after{display:none}
}

/* ============================================================
   G1 · Leistungsdaten-Erfassung (Bauplan Stufe 1, 2026-08-07)
   Formularblock im Profil. Bewusst schlicht und an den bestehenden
   Karten-/Zeilenstil angelehnt — die Seite soll nicht wie ein fremdes
   Formular wirken, sondern wie der Rest des Profils.
   ============================================================ */
.perf-form{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:15px;
  background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid var(--border);margin-bottom:9px}
.perf-form.perf-open{border-color:rgba(201,174,124,.35)}
.perf-form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:650;color:var(--muted)}
.perf-form input,.perf-form select{font-family:var(--font);font-size:15px;color:var(--text);
  background:#0c131d;border:1px solid var(--border);border-radius:11px;padding:11px 12px;
  -webkit-appearance:none;appearance:none;min-height:44px}
.perf-form input:focus,.perf-form select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,174,124,.18)}
.perf-form .mini-btn{margin-top:2px;min-height:44px}
[data-theme="light"] .perf-form input,[data-theme="light"] .perf-form select{background:#fff}
/* Rueckmeldung nach einer Eingabe. Drei Zustaende, weil eine unvollstaendige
   Eingabe kein Fehler ist, sondern eine offene Frage. */
.mini-note.perf-ok{border-color:rgba(106,168,120,.45)}
.mini-note.perf-warn{border-color:rgba(201,174,124,.5)}
.mini-note.perf-bad{border-color:rgba(198,110,102,.5)}

/* C3 · Debrief-Erfassung (Bauplan Stufe 2, 2026-08-07)
   Zwei Eingaben im Normalfall — die RPE-Skala ist deshalb die einzige
   auffaellige Bedienflaeche. Tippziele mindestens 40 px. */
.db-rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:10px}
.db-rpe-b{min-height:44px;font-family:var(--font);font-size:14px;font-weight:700;color:var(--muted);
  background:#0c131d;border:1px solid var(--border);border-radius:10px;cursor:pointer;-webkit-appearance:none;appearance:none}
.db-rpe-b.on{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#0a0f17;border-color:transparent}
.db-rpe-b:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,174,124,.18)}
.db-reasons{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.db-reason{min-height:40px;padding:8px 13px;font-family:var(--font);font-size:13px;font-weight:650;color:var(--muted);
  background:#0c131d;border:1px solid var(--border);border-radius:11px;cursor:pointer;-webkit-appearance:none;appearance:none}
.db-reason.on{border-color:var(--accent);color:var(--text)}
[data-theme="light"] .db-rpe-b,[data-theme="light"] .db-reason{background:#fff}

/* ===== Adaptive Karte (Sichtscheibe auf den Schattenbetrieb, v8-283) =====
   Bewusst ohne Schaltflaechen: Die Karte zeigt, sie handelt nicht. */
.adx-card{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card,rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.08)}
.adx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.adx-badge{font-size:.72rem;padding:3px 9px;border-radius:99px;white-space:nowrap}
.adx-ok{background:rgba(52,199,89,.14);color:#34c759}
.adx-partial{background:rgba(255,159,10,.16);color:#ff9f0a}
.adx-stale{background:rgba(142,142,147,.18);color:#aeaeb2}
.adx-row{display:flex;justify-content:space-between;gap:12px;margin:6px 0;font-size:.9rem}
.adx-row span{opacity:.65}
.adx-why{font-size:.82rem;opacity:.75;margin:2px 0 8px}
.adx-blocked{font-size:.8rem;color:#ff9f0a;margin:2px 0 8px}
.adx-model{font-size:.78rem;opacity:.6;font-style:italic;margin:4px 0 8px}
.adx-sub{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;opacity:.55}
.adx-changes{margin:8px 0}
.adx-chg{font-size:.85rem;margin:4px 0}
.adx-chg i{opacity:.55;font-style:normal;font-size:.78rem}
.adx-gap{font-size:.82rem;color:#ff9f0a;margin:6px 0}
.adx-foot{font-size:.75rem;opacity:.5;margin:10px 0 0}

/* ==== S1-UI · Profil-Screen v14 (js/screens/profile-v14.js) ==== */
.ps-card{margin:0 18px 14px;padding:14px;border-radius:var(--r-mid,16px);background:linear-gradient(140deg,rgba(201,174,124,.14),var(--card-2,#0c131d));border:1px solid rgba(201,174,124,.28);cursor:pointer}
.ps-top{display:flex;align-items:center;gap:13px}
.ps-ring{position:relative;width:54px;height:54px;flex:0 0 auto}.ps-ring svg{transform:rotate(-90deg)}
.ps-ring .pv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:850;font-variant-numeric:tabular-nums}
.ps-b{flex:1;min-width:0}.ps-t{font-size:13.5px;font-weight:800}.ps-d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.ps-gaps{display:flex;flex-direction:column;gap:7px;margin-top:13px}
.ps-gap{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--surface);border:1px solid var(--border);cursor:pointer}
.ps-gap .g-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--attention-t);color:var(--attention)}
.ps-gap .g-b{flex:1;min-width:0}.ps-gap .g-t{font-size:12px;font-weight:750}.ps-gap .g-d{font-size:10.5px;color:var(--faint);margin-top:1px;line-height:1.3}

.kp-trow .n{color:var(--muted);font-weight:720}
.kp-trow .bar{height:12px;border-radius:7px;background:rgba(255,255,255,.05);position:relative}
.kp-trow .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,rgba(201,174,124,.55),var(--gold))}
.kp-trow .bar .avg{position:absolute;top:-3px;width:2px;height:18px;border-radius:1px;background:rgba(255,255,255,.55)}
.kp-trow .v{text-align:right;font-weight:770;font-variant-numeric:tabular-nums;white-space:nowrap}
.kp-legend{display:flex;gap:14px;margin-top:12px;font-size:10.5px;color:var(--muted);font-weight:700}
.kp-legend span{display:flex;align-items:center;gap:6px}.kp-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kp-legend i.a{background:var(--gold)}.kp-legend i.b{background:rgba(255,255,255,.55)}
.kp-bal{margin-top:4px}
.kp-brow{padding:10px 0;border-top:1px solid var(--hair)}
.kp-brow:first-child{border-top:none}
.kp-brow .head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:740;margin-bottom:7px}
.kp-brow .head b{font-variant-numeric:tabular-nums}
.kp-brow .head b.ok{color:var(--ready)}.kp-brow .head b.att{color:var(--attention)}
.kp-duo{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px}
.kp-duo i{border-radius:3px;display:block}
.kp-duo .a{background:var(--gold)}.kp-duo .b{background:var(--activity)}
.kp-duolbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-weight:700;margin-top:5px}
.kp-empty{text-align:center;padding:22px 14px 14px}
.kp-empty .e-ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.05);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
.kp-empty .t{font-size:13.5px;font-weight:790}
.kp-empty .d{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:5px}
.kp-empty .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.06);margin:14px auto 6px;max-width:220px;overflow:hidden}
.kp-empty .bar i{display:block;height:100%;border-radius:inherit;background:var(--gold-grad,linear-gradient(90deg,#a8905f,#C9AE7C))}
.kp-empty .cnt{font-size:10.5px;color:var(--muted);font-weight:700}
.kp-teaser{margin-top:2px}
.kp-teaser .next-t{font-size:13px;font-weight:780}.kp-teaser .next-s{font-size:11px;color:var(--muted);margin-top:2px}
[data-theme="light"] .kp-pt{stroke:#fff}[data-theme="light"] .kp-pt.test{fill:#fff}
[data-theme="light"] .kp-note{background:rgba(0,0,0,.03)}
[data-theme="light"] .kp-crow .track,[data-theme="light"] .kp-trow .bar,[data-theme="light"] .kp-empty .bar,[data-theme="light"] .kp-empty .e-ic{background:rgba(0,0,0,.06)}
[data-theme="light"] .kp-trow .bar .avg,[data-theme="light"] .kp-legend i.b{background:rgba(0,0,0,.45)}
/* S2b-1 · Picker nach Basisbewegung */
.wo-pick-sect{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:#94a3b8;padding:12px 2px 4px}
.wo-pickitem.wo-base{min-height:58px}.wo-pickitem.wo-base.on .wo-pi-main{color:var(--gold)}
.wo-pi-chev{margin-left:auto;color:#94a3b8;font-size:14px;padding-right:6px}
.wo-variants{border-left:2px solid rgba(201,174,124,.35);margin:0 0 6px 8px;padding-left:8px}
.wo-variants .wo-pickitem{min-height:56px;padding:9px 2px}
/* S2b-2 · Eigene Uebungen */
.wo-pickitem.wo-newex{min-height:58px;border:1px dashed rgba(201,174,124,.45);border-radius:12px;margin:6px 0 4px;padding:10px 12px;background:rgba(201,174,124,.05)}.wo-pickitem.wo-newex .wo-pi-main{color:var(--gold)}
.wo-pickrow{display:flex;align-items:stretch;gap:6px}.wo-pickrow .wo-pickitem{flex:1;min-width:0}
.wo-pi-edit{flex:0 0 40px;border:1px solid rgba(148,163,184,.25);background:#0f172a;color:#94a3b8;border-radius:10px;font-size:15px;cursor:pointer;margin:6px 0}
.cx-mus-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--mut,#94a3b8);margin:8px 0 6px}.cx-mus-head small{font-size:10.5px}
.cx-muscles{display:flex;flex-wrap:wrap;gap:6px}.cx-muscles .wo-fchip{padding:7px 11px;font-size:12px}.cx-muscles .wo-fchip.half{border-color:rgba(201,174,124,.5);color:var(--gold-soft)}
.cx-legend{font-size:10.5px;color:var(--mut,#94a3b8);margin:8px 0 10px}
.cx-err{font-size:12px;color:var(--attention);margin:6px 0}
.wo-sheet .wo-inrow select{background:#0f172a;border:1px solid rgba(148,163,184,.25);border-radius:10px;padding:12px;color:#e2e8f0;font-size:15px}
