<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* GM7.9e: Sichere obere Zone als eine Quelle. Im iOS-Homescreen-PWA (standalone) meldet
   env(safe-area-inset-top) je nach iOS-Version 0, obwohl der Inhalt unter Statusleiste/
   Dynamic Island liegt (Kopfzeilen ueberlappen dann mit Uhrzeit/Signal). max() nimmt den
   echten Wert, sobald er korrekt gemeldet wird, und sonst einen sicheren Mindestwert.
   Im Browser aendert sich dadurch nichts. */
:root{--sat:env(safe-area-inset-top,0px)}
@media all and (display-mode:standalone){
  :root{--sat:max(env(safe-area-inset-top,0px),54px)}
}
:root{
  /* ============ ORVIA DESIGN TOKENS v5 ============ */
  --font:Inter,Geist,Manrope,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  --bg:#070C14;
  --bg-rgb:7,12,20;
  --surface:rgba(255,255,255,.04);--surface-strong:rgba(255,255,255,.065);
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.15);
  --hairline:rgba(255,255,255,.06);
  --text:#F4F2EC;--text-muted:#9BA1AD;--text-faint:#656C79;
  --accent:#C9AE7C;--accent-soft:#DCC79A;--accent-dim:#8E7647;
  --success:#34C77B;--danger:#E5556A;--warning:#D9A65A;
  --radius-card:22px;--radius-pill:999px;
  --shadow-soft:0 18px 40px rgba(0,0,0,.42);
  /* spacing scale: 8/12/16/24/32 */
  --s1:8px;--s2:12px;--s3:16px;--s4:24px;--s5:32px;
  /* ---- legacy aliases (keep all existing components working) ---- */
  --card:#0D131D;--soft:#121A26;--line:rgba(255,255,255,.09);
  --txt:#F4F2EC;--mut:#9BA1AD;--faint:#656C79;
  --pri:#C9AE7C;--pri2:#A98D58;--cyan:#DCC79A;--priSoft:#171309;
  --green:#34C77B;--yellow:#D9A65A;--red:#E5556A;--coral:#E5828F;
  --r:22px;--r2:14px;
  /* ---- brand tokens (logo / brand layer) ---- */
  --gold:#C9AE7C;--gold-soft:#DCC79A;--gold-dark:#8E7647;
  --gold-grad:linear-gradient(135deg,#DCC79A,#C9AE7C 55%,#8E7647);
  --ink:#070C14;--navy:#0B1220;--brand-txt:#F4F2EC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable;min-height:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--font);
  min-height:100%;
  font-size:16px;line-height:1.45;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:radial-gradient(1200px 820px at 50% -12%,#0b1320 0%,#091019 48%,#070C14 78%) fixed}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px calc(env(safe-area-inset-bottom) + 118px);min-height:100vh;min-height:100dvh}
/* Check-in: kein pauschaler Leerraum im Formular. Die Navigation-Freihaltung übernimmt bereits
   .wrap (padding-bottom: env(safe-area-inset-bottom) + 118px). Hier nur ein normaler Abstand
   zwischen letztem Feld (DOMS) und dem „Entscheidung speichern"-Button (direktes Geschwister). */
#morningForm{padding-bottom:0}
#morningForm + .btn.cta{margin-top:18px}
h1,h2,.seshead,.cd .num,.sleepbig,.kpi .k .n,.readyinfo .rscore,.acwr .ar,.streak .sn,.profname{font-family:var(--font)}
.kpi .k .n,.cd .num,.sleepbig,.readyinfo .rscore,.acwr .ar,.streak .sn,.val,.verdict,.cmdkpis span,.goalhead span:last-child,.hist b,.weekrow b,.zone span,.pace b{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1}
.greet{font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:27px;font-weight:800;margin:2px 0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin:0 0 18px}
h2{font-size:15px;font-weight:700;margin:0 0 16px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
h2 .ic{width:19px;height:19px;color:var(--pri);flex-shrink:0}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.field{margin-bottom:20px}.field:last-child{margin-bottom:0}
label{display:block;font-size:13.5px;font-weight:650;margin-bottom:10px;color:#b8b4aa}
.val{float:right;color:var(--cyan);font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:8px;background:linear-gradient(90deg,#c9ae7c 0%,#dcc79a var(--p,50%),#1a2330 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:25px;height:25px;border-radius:50%;background:#fff;border:none;margin-top:-8px;box-shadow:0 0 0 4px rgba(201,174,124,.25),0 2px 10px rgba(0,0,0,.5)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px;font-weight:600}
input[type=number],input[type=text]{width:100%;padding:14px;font-size:16px;border-radius:var(--r2);border:1px solid var(--line);background:#0c131d;color:var(--txt);font-weight:600}
input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(201,174,124,.18)}
input::placeholder{color:var(--faint);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:11px 15px;font-size:13.5px;font-weight:650;border:1px solid var(--line);background:#0c131d;color:#b8b4aa;border-radius:30px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(201,174,124,.4)}
.chip.gn.on{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 16px rgba(16,185,129,.35)}
.btn{display:block;width:100%;padding:17px;font-size:15.5px;font-weight:750;border:none;border-radius:18px;background:linear-gradient(135deg,#c9ae7c,#b89a60 60%,#8e7647);color:#fff;cursor:pointer;box-shadow:0 8px 26px rgba(201,174,124,.4);margin-top:6px;font-family:var(--font);letter-spacing:.01em}
.btn:active{transform:scale(.985)}
.btn.sec{background:#121a26;color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.gline{background:#0d131d;color:#dcc79a;border:1px solid #243042;box-shadow:none;font-size:13.5px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.gline .ic{width:16px;height:16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row2>*{min-width:0}
@media (max-width:360px){.row2{grid-template-columns:1fr}}
.sleepbig{text-align:center;font-size:40px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px;background:linear-gradient(135deg,#dcc79a,#c9ae7c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sleepbig small{font-size:18px;font-weight:700;-webkit-text-fill-color:var(--mut)}
.stepbtns{display:flex;gap:10px;margin-top:12px}
.stepbtns button{flex:1;padding:12px;font-size:14px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:#0c131d;color:var(--txt);cursor:pointer}
/* tabbar — floating pill */
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:50;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);pointer-events:none;background:linear-gradient(to top,rgba(8,9,11,.9),transparent)}
.tabwrap{pointer-events:auto;display:flex;gap:2px;background:rgba(18,20,23,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);border-radius:36px;padding:9px 12px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.tabbar button{background:none;border:none;color:#656c79;width:54px;height:48px;border-radius:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.tabbar button .ic{width:23px;height:23px;transition:transform .3s cubic-bezier(.34,1.8,.5,1),color .2s}
.tabbar button.on{color:#fff}
.tabbar button.on .ic{transform:scale(1.18) translateY(-1px)}
.tabbar button.on::after{content:none}
@keyframes tappop{0%{transform:scale(1)}45%{transform:scale(1.32) translateY(-2px)}100%{transform:scale(1.18) translateY(-1px)}}
.tabbar button.pop .ic{animation:tappop .38s cubic-bezier(.34,1.8,.5,1)}
/* ampel */
.amp{border-radius:var(--r);padding:20px;margin-bottom:16px;color:#fff;box-shadow:0 14px 40px rgba(4,5,8,.5);border:1px solid rgba(255,255,255,.08)}
.amp.g{background:linear-gradient(135deg,#0e9f6e,#056649)}
.amp.y{background:linear-gradient(135deg,#d97706,#92500a)}
.amp.r{background:linear-gradient(135deg,#e8345c,#9f1239)}
.amp .big{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.amp ul{margin:6px 0 0;padding-left:18px;font-size:14px;opacity:.96}.amp li{margin-bottom:3px}
.amp .rec{background:rgba(255,255,255,.14);border-radius:14px;padding:13px 15px;margin-top:14px;font-size:14px;line-height:1.5}
.warn{background:rgba(251,77,109,.1);border:1px solid rgba(251,77,109,.25);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#ff9eb1}
.warn b{color:#ffc2cd}.warn ul{margin:6px 0 0;padding-left:18px}.warn li{margin-bottom:3px}
/* training types */
.typebtn{padding:15px 13px;border-radius:16px;border:1px solid var(--line);background:#0c131d;cursor:pointer;text-align:left;transition:.15s}
.typebtn.on{border-color:rgba(201,174,124,.6);background:linear-gradient(135deg,#131c29,#121a26);box-shadow:0 6px 20px rgba(201,174,124,.25)}
.typebtn .ti .ic{width:22px;height:22px;color:var(--mut)}
.typebtn.on .ti .ic{color:var(--cyan)}
.typebtn .tn{font-weight:750;font-size:14px;margin-top:7px}
.typebtn .tc{font-size:11px;color:var(--mut);font-weight:600}.typebtn.on .tc{color:#dcc79a}
.sescard{background:#0c131d;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.seshead{font-weight:800;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.seshead .ic{width:18px;height:18px;color:var(--cyan)}
.calc{font-size:12px;color:var(--cyan);font-weight:700;margin-top:6px}
/* kpi */
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.kpi .k{background:linear-gradient(180deg,#111a26,#0c131d);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:14px 10px;text-align:center}
.kpi .k .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k .l{font-size:10.5px;color:var(--mut);margin-top:3px;font-weight:600}
.chartbox{height:170px;margin-top:2px}
.muted{color:var(--mut);font-size:13px}
.hist{font-size:14px;border-bottom:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.hist:last-child{border:none}.hist b{font-weight:750}
.hist .ic{width:14px;height:14px;color:var(--mut)}
.pill{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:middle}
.zone{display:flex;justify-content:space-between;font-size:13px;padding:11px 14px;border-radius:12px;margin-bottom:6px;font-weight:650;border:1px solid;background:#0c131d}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#f5f2ea;color:#08090b;padding:13px 22px;border-radius:30px;font-weight:700;font-size:14px;z-index:10000;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.rtr{border-radius:var(--r);padding:18px 20px;margin-bottom:16px;color:#fff;border:1px solid rgba(255,255,255,.08)}
.hide{display:none}
.note{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}
.weekrow{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.weekrow:last-child{border:none}.weekrow b{font-weight:750}
.weekrow .ic{width:15px;height:15px;color:var(--mut);margin-right:9px;vertical-align:-2px}
/* countdown */
.cd{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#0e1828 0%,#122031 55%,#121a26 100%);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.09);box-shadow:0 14px 44px rgba(159,122,54,.35)}
.cd .num{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;background:linear-gradient(135deg,#fff,#dcc79a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cd .lab{font-size:11px;opacity:.7;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.cd .ph{font-size:12px;opacity:.85;margin-top:3px}
.cd .ic{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
/* readiness ring */
.readycard{display:flex;align-items:center;gap:18px}
.ring{width:118px;height:118px;flex-shrink:0;filter:drop-shadow(0 0 14px rgba(201,174,124,.25))}
.ringbg{fill:none;stroke:#1a2330;stroke-width:10}
.ringfg{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s}
.readyinfo .rscore{font-size:30px;font-weight:800;letter-spacing:-.02em}
.readyinfo .rband{font-size:13px;font-weight:750;margin-top:-2px}
.readyinfo .rlim{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
/* heatmap */
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.heatcell{width:13px;height:13px;border-radius:3.5px;background:#121a26}
.heatleg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-top:10px}
.heatleg i{width:12px;height:12px;border-radius:3.5px;display:inline-block}
.streaks{display:flex;gap:10px;margin-bottom:16px}
.streak{flex:1;background:#0c131d;border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center}
.streak .sn{font-size:22px;font-weight:800;background:linear-gradient(135deg,#dcc79a,#c9ae7c);-webkit-background-clip:text;background-clip:text;color:transparent}
.streak .sl{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:3px}
/* insights */
.subcat{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px}
.subcat:first-child{margin-top:0}
.insight{background:#0c131d;border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:10px;padding:11px 14px;font-size:13.5px;margin-bottom:10px;line-height:1.45}
.insight:last-child{margin-bottom:0}
/* badges */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:flex;gap:11px;align-items:center;background:#0c131d;border:1px solid var(--line);border-radius:14px;padding:12px;opacity:.4}
.badge.on{opacity:1;border-color:rgba(201,174,124,.45);background:linear-gradient(135deg,#11202f,#0e1726);box-shadow:0 6px 20px rgba(201,174,124,.18)}
.badge .bi .ic{width:21px;height:21px;color:var(--faint)}
.badge.on .bi .ic{color:var(--cyan)}
.badge .bt{font-size:12.5px;font-weight:750}.badge .bd{font-size:10.5px;color:var(--mut)}
/* acwr */
.acwr{border-radius:var(--r);padding:18px 20px;margin-bottom:16px;color:#fff;border:1px solid rgba(255,255,255,.08)}
.acwr .ar{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.acwr .al{font-size:13px;opacity:.9;font-weight:600}
.acwr .ad{font-size:13px;margin-top:8px;line-height:1.45;opacity:.96}
/* stack / supps */
.slot{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
.slot:first-child{margin-top:0}
.stackitem{display:flex;align-items:center;gap:11px;background:#0c131d;border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.15s}
.stackitem.on{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4)}
.stackitem .check{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.15s}
.stackitem.on .check{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent}
.stackitem .sname{font-weight:700;font-size:14px}.stackitem .sdose{font-size:11.5px;color:var(--mut);line-height:1.35}
.stackitem .del{margin-left:auto;color:var(--faint);font-size:17px;padding:0 4px}
.stackitem.rec{border-style:dashed}
.addrow{display:grid;grid-template-columns:1.3fr 70px 1fr auto;gap:8px;align-items:center;margin-top:10px}
.addrow select,.addrow input{padding:11px 10px;font-size:13px;border-radius:10px;border:1px solid var(--line);background:#0c131d;color:var(--txt);font-weight:600;width:100%}
.addrow button{padding:11px 14px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;cursor:pointer}
.lexlink{background:none;border:none;color:var(--faint);font-size:12px;font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(4,5,8,.7);backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#0d131d;width:100%;max-width:520px;max-height:88vh;border-radius:26px 26px 0 0;overflow-y:auto;padding:20px 18px 40px;animation:up .25s ease;border-top:1px solid rgba(255,255,255,.1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheethead h2{margin:0;font-size:19px}
.xbtn{background:#121a26;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:17px;cursor:pointer;color:var(--mut)}
.suppli{background:#0d131d;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.vb{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.vb.s1{background:rgba(52,199,123,.14);color:#5FD79A}.vb.s2{background:rgba(217,166,90,.13);color:#D9A65A}.vb.s3{background:#121a26;color:var(--mut)}
.suppdetail h3{font-size:18px;margin:0 0 2px;font-family:var(--font)}
.suppdetail .lbl{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 4px}
.suppdetail p{margin:0;font-size:14px;line-height:1.55;color:#b8b4aa}
.suppdetail .foryou{background:#1a1f38;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:14px;line-height:1.55}
.scat{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}.scat:first-child{margin-top:4px}
.searchbox{width:100%;padding:13px 14px;font-size:15px;border-radius:12px;border:1px solid var(--line);background:#0d131d;margin-bottom:12px;font-weight:500;color:var(--txt)}
/* banner */
/* Bugfix (2026-08-05, Nutzer-Feedback „Backup älter als 7 Tage" breiter als der Rest der
   Seite): .card hat margin:0 18px 14px (styles.css:2391), .banner hatte gar kein
   horizontales Margin — dadurch spannte der Banner ueber die volle Breite, waehrend
   alle Karten 18px eingerueckt sind. Gleiche Einrueckung wie .card. */
.banner{border-radius:16px;padding:13px 16px;margin:0 18px 16px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:11px;line-height:1.4;border:1px solid}
.banner .ic{width:18px;height:18px;flex-shrink:0}
.banner.info{background:rgba(201,174,124,.1);border-color:rgba(201,174,124,.3);color:#dcc79a}
.banner.warn2{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.25);color:#fbd474}
.banner button{margin-left:auto;border:none;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:12.5px;white-space:nowrap}
/* plan */
.pday{border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:10px;background:#0c131d}
.pday.today{border-color:rgba(201,174,124,.55);background:linear-gradient(135deg,#101a28,#0e1726);box-shadow:0 8px 24px rgba(201,174,124,.18)}
.pday .pd{font-weight:800;font-size:11.5px;margin-bottom:6px;color:var(--mut);letter-spacing:.07em;text-transform:uppercase}
.pday.today .pd{color:#dcc79a}
