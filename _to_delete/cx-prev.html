.wo-pickitem{display:flex;align-items:center;gap:10px;min-height:74px;text-align:left;background:none;border:0;border-bottom:1px solid rgba(148,163,184,.12);padding:12px 2px;color:#e2e8f0;cursor:pointer;width:100%}
.wo-pi-main{font-size:15.5px;font-weight:700}
.wo-pi-meta{font-size:12.5px;color:var(--mut,#94a3b8);margin-top:2px}
.wo-pi-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.wo-pickitem .pchev{color:var(--mut,#94a3b8);font-size:20px;flex-shrink:0}
.wo-pickitem:active{background:rgba(255,255,255,.03)}
@media (prefers-reduced-motion:reduce){.wo-pickitem:active{background:none}}
.wo-paused{font-size:13px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.3);color:#fdba74;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between}

/* ===== Phase 4.2 Batch 2 · 5-Tab-Nav (Training mittig) + Trainings-Hub ===== */
/* P7: alle normalen Tabs identisch — inaktiv grau, aktiv gold. Der frühere
   PERMANENTE Ring/Goldton am Training-Tab (unabhängig von .on) ist entfernt;
   Ring + Akzent erscheinen nur im aktiven Zustand. Der Plus-Button bleibt die
   einzige dauerhaft hervorgehobene Sonderaktion — seit der Shell-v3-Migration
   allerdings als separater FAB (#navPlus.fab) AUSSERHALB der Bar, nicht mehr
   als .nav-plus in der Tabbar-Flexzeile. */
/* FIX (2026-07-16, Nutzerwunsch): Sonderbehandlung des Training-Tabs entfernt — der
   Kreis-Ring um die aktive Hantel wich vom Standard-Tab-Look ab. Alle Tabs sehen
   jetzt identisch aus (Standard .tabbar button.on). */
/* Statuszeile INNERHALB der „Training heute"-Karte (KEINE eigene Karte/Rahmen, kein Doppel-Abstand) */
.wo-status{display:flex;align-items:center;gap:12px;cursor:pointer;padding:11px 12px;margin:-2px 0 10px;border-radius:13px;background:rgba(201,174,124,.07);border:1px solid rgba(201,174,124,.18)}
.wo-status.live{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.28)}
.wo-status.done{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.28)}
.wo-status .pic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(201,174,124,.12);flex-shrink:0}
.wo-status .pic .ic{width:18px;height:18px;color:var(--accent,#dcc79a)}
.wo-prev-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wo-prev-main{font-weight:700;font-size:14.5px}
.wo-prev-sub{font-size:12.5px;color:var(--mut,#94a3b8)}
.wo-status .pchev{color:var(--mut,#94a3b8);font-size:20px}
.wo-status:active{transform:scale(.99)}
@media (prefers-reduced-motion:reduce){.wo-status:active{transform:none}}
/* Hub-Hero (dynamische Hauptaktion) */
.hub-hero{background:linear-gradient(180deg,#13202f,#0c1422);border:1px solid rgba(201,174,124,.22);border-radius:18px;padding:18px;margin-bottom:14px}
.hub-hero-tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-soft,#c9ae7c)}
.hub-hero-title{font-size:21px;font-weight:800;margin-top:4px}
.hub-hero-sub{font-size:13.5px;color:var(--mut,#94a3b8);margin:4px 0 14px}
/* Schnellstart: 6-Spalten-Raster. Reihe 1 = 3×span2, Reihe 2 = 2×span3 (Schwimmen/Mobility breiter). */
.hub-quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.hub-q{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;padding:12px 6px;border-radius:13px;border:1px solid var(--line,#243042);background:#0d131d;color:var(--txt,#e2e8f0);font-size:13px;font-weight:650;cursor:pointer;text-align:center}
.hub-q span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hub-q .ic{width:21px;height:21px;color:var(--accent,#dcc79a);flex-shrink:0}
.hub-q.q3{grid-column:span 3}
.hub-q:active{transform:scale(.97)}
@media (max-width:360px){.hub-quick{grid-template-columns:repeat(2,minmax(0,1fr))}.hub-q.q2,.hub-q.q3{grid-column:auto}}
.hub-hero.live{border-color:rgba(59,130,246,.3);background:linear-gradient(180deg,#10243a,#0c1422)}
.hub-discard{margin-top:10px;width:100%;background:none;border:0;color:var(--mut,#94a3b8);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
.hub-skel{height:54px;border-radius:12px;margin-top:12px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:hubsk 1.2s ease-in-out infinite}
@keyframes hubsk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.wo-hist-active{cursor:pointer;min-height:44px;border:1px solid rgba(59,130,246,.28);background:rgba(59,130,246,.08);border-radius:10px;padding:9px 11px}
.wo-hist-active .wo-hist-go{color:#60a5fa;font-weight:700;font-size:13px}
.wo-hist-active:active{transform:scale(.99)}
.wo-pick-count{font-size:12px;color:var(--mut,#94a3b8);padding:8px 2px 4px;position:sticky;top:0}
#tab-training>h1{margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.hub-q:active,.wo-hist-active:active{transform:none}.hub-skel{animation:none}}
/* Hub-Navigationszeilen */
.hub-nav{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.hub-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.055);background:linear-gradient(180deg,#111a26,#0c131d);cursor:pointer}
.hub-row .pic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(255,255,255,.05);flex-shrink:0}
.hub-row .pic .ic{width:18px;height:18px;color:var(--accent,#dcc79a)}
.hub-row-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hub-row-txt b{font-size:14.5px;font-weight:700}
.hub-row-txt small{font-size:12px;color:var(--mut,#94a3b8)}
.hub-row .pchev{color:var(--mut,#94a3b8);font-size:20px}
@media (prefers-reduced-motion:reduce){.hub-q:active,.wo-prev:active{transform:none}}
/* Heute: einklappbare Sekundärkarte (Routinen & Supplements) */
details.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:18px;font-weight:700;font-family:var(--font)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .ic{width:19px;height:19px;color:var(--pri,#dcc79a)}
details.acc>summary .acc-x{margin-left:auto;color:var(--mut,#94a3b8);font-size:20px;transition:transform .2s}
details.acc[open]>summary .acc-x{transform:rotate(90deg)}
details.acc .acc-body{margin-top:14px}
@media (prefers-reduced-motion:reduce){details.acc>summary .acc-x{transition:none}}

/* ===== Phase 4.2f · Bottom-Sheets (ersetzen native prompt/confirm) ===== */
.wo-sheet-bg{position:fixed;inset:0;z-index:9500;background:rgba(4,6,10,.6);display:flex;align-items:flex-end;justify-content:center}
.wo-sheet-bg.hide{display:none}
.wo-sheet{width:100%;max-width:520px;background:#0d131d;border-top:1px solid rgba(255,255,255,.1);border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);animation:wosheetup .22s ease}
@keyframes wosheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.wo-sheet-t{font-size:18px;font-weight:800;margin:0 0 4px}
.wo-sheet-p{font-size:13.5px;color:var(--mut,#94a3b8);margin:0 0 14px;line-height:1.45}
.wo-sheet-btn{width:100%;margin-top:9px;padding:14px;border-radius:13px;border:1px solid var(--line,#243042);background:#121a26;color:#e2e8f0;font-size:15px;font-weight:700;cursor:pointer}
.wo-sheet-btn.primary{background:#16a34a;border-color:#16a34a;color:#fff}
.wo-sheet-btn.danger{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.4);color:#fb7185}
.wo-sheet-btn.ghost{background:none}
.wo-sheet-btn:disabled{opacity:.6}
.wo-rpe-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 8px}
.wo-rpe{padding:14px 0;border-radius:11px;border:1px solid var(--line,#243042);background:#0f172a;color:#e2e8f0;font-size:16px;font-weight:700;cursor:pointer}
.wo-rpe.on{background:rgba(201,174,124,.18);border-color:rgba(201,174,124,.5);color:var(--accent-soft,#dcc79a)}
.wo-rpe-hint{font-size:12px;color:var(--mut,#94a3b8);text-align:center;margin-bottom:6px}
.wo-sheet .wo-inrow{display:flex;gap:10px;margin-bottom:4px}
.wo-sheet .wo-inrow label{flex:1;display:flex;flex-direction:column;font-size:11px;color:var(--mut,#94a3b8);gap:4px}
.wo-sheet .wo-inrow input{background:#0f172a;border:1px solid rgba(148,163,184,.25);border-radius:10px;padding:12px;color:#e2e8f0;font-size:16px}
.wo-det-head{font-size:15px;font-weight:700;margin-bottom:10px}
.wo-det-body{max-height:50vh;overflow-y:auto}
.wo-det-ex{margin-bottom:12px}
.wo-det-exname{font-weight:700;font-size:14.5px;margin-bottom:4px}
.wo-det-set{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid rgba(148,163,184,.1)}
.wo-hist-done{cursor:pointer;min-height:44px}
.wo-hist-done .wo-hist-go{color:var(--accent-soft,#dcc79a);font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){.wo-sheet{animation:none}}

/* ===== Phase 4.2 Batch A · Heutige Aktivität (kompakte Tageszusammenfassung) =====
   Eigener tsum-* Namensraum — NICHT mit dem Trainings-Setup (.ts-*) kollidieren. */
.tsum-list{display:flex;flex-direction:column;gap:6px;margin:2px 0 12px}
.tsum-row{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:14px}
.tsum-name{font-weight:700}
.tsum-sub{color:var(--mut,#94a3b8);font-size:13px;text-align:right;min-width:0}
.tsum-actions{display:flex;gap:8px}
.tsum-actions .btn{flex:1}

/* ===== Phase 4.2 F2 · Planerfüllungs-Chip (Heutige Aktivität) ===== */
.pf-chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;vertical-align:middle;margin-left:6px;background:rgba(148,163,184,.16);color:var(--mut,#94a3b8)}
.pf-erfuellt{background:rgba(16,185,129,.16);color:#34d399}
.pf-teilweise{background:rgba(234,179,8,.16);color:#eab308}
.pf-alternativ{background:rgba(59,130,246,.16);color:#60a5fa}
.pf-ungeplant{background:rgba(168,85,247,.16);color:#c084fc}
.pf-ausgefallen{background:rgba(244,63,94,.14);color:#fb7185}
.pf-offen{background:rgba(148,163,184,.16);color:#94a3b8}

/* ===== Phase 4.2 Teil B · Dauer-/Distanz-Live-Modus (Lauf/Rad/Schwimmen/Mobility) ===== */
.wo-duration{align-items:stretch}
.wo-dur-big{font-size:54px;font-weight:800;letter-spacing:-.02em;text-align:center;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#dcc79a);-webkit-background-clip:text;background-clip:text;color:transparent}
.wo-duration .wo-inrow label{flex:1;display:flex;flex-direction:column;font-size:11px;color:var(--mut,#94a3b8);gap:4px}
.wo-duration .wo-inrow input{background:#0f172a;border:1px solid rgba(148,163,184,.25);border-radius:10px;padding:13px;color:#e2e8f0;font-size:18px;text-align:center}

/* ===== Phase 4.2 F1+ · Plan-Sollwerte im Live-Modus ===== */
.wo-plan{display:flex;flex-direction:column;gap:3px;background:rgba(201,174,124,.08);border:1px solid rgba(201,174,124,.22);border-radius:12px;padding:10px 12px}
.wo-plan-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-soft,#dcc79a)}
.wo-plan-b{font-size:13.5px;line-height:1.45;color:var(--txt,#e2e8f0)}

/* ===== Phase 4.2 Teil B · Lauf-Intervall-Detailmodus ===== */
.wo-iv{display:flex;flex-direction:column;gap:10px}
.wo-iv-cur{border-radius:14px;padding:16px;text-align:center;border:1px solid rgba(148,163,184,.18);background:rgba(255,255,255,.04)}
.wo-iv-cur.wo-iv-work{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.35)}
.wo-iv-cur.wo-iv-recover{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)}
.wo-iv-cur.wo-iv-warmup,.wo-iv-cur.wo-iv-cooldown{background:rgba(201,174,124,.1);border-color:rgba(201,174,124,.3)}
.wo-iv-lab{font-size:15px;font-weight:800}
.wo-iv-time{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.wo-iv-list{display:flex;flex-direction:column;gap:4px}
.wo-iv-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 10px;border-radius:9px;background:#0f172a;border:1px solid rgba(148,163,184,.1)}
.wo-iv-row.on{border-color:rgba(201,174,124,.5);background:rgba(201,174,124,.1);font-weight:700}
.wo-iv-row.done{opacity:.5;text-decoration:line-through}

/* ===== Phase 4.2 Teil B · Schwimm-Detailmodus (Bahnen-Zähler) ===== */
.wo-swim{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.wo-swim-dist{font-size:30px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.wo-swim-dist .muted{font-size:15px;font-weight:600}
.wo-swim-btns{display:flex;gap:8px}
.wo-swim-btns .wo-fbtn{flex:1}

/* ===== Phase 4.3 · Körperkarte (Muskelvolumen) ===== */
.bodymap{margin:2px 0 14px}
.bodymap svg{max-width:340px;display:block;margin:0 auto}
.bm-leg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;font-size:11.5px;color:var(--mut,#94a3b8)}
.bm-leg span{display:inline-flex;align-items:center;gap:5px}
.bm-leg i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* Phase 4.3 · Körperkarte Tap-Regionen + Detail */
.bm-region{cursor:pointer}
.bm-region:focus-visible{outline:2px solid var(--accent,#dcc79a);outline-offset:1px}
.bm-region:active{opacity:.8}
.md-stat{display:flex;flex-direction:column;gap:2px}
.md-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid rgba(148,163,184,.12)}
.mv-row{cursor:pointer}

/* ==== PF UI-KIT (M2, 2026-07-02) — Profil-/Setup-Basiskomponenten ==============
   Abgegrenzter Namespace für das neue Profil-UI-Kit (js/profile-ui-kit.js).
   HINWEIS: .pf-chip/.pf-erfuellt/… (Planerfüllung, workout-ui) sind ÄLTER und
   gehören NICHT zu diesem Block — Klassennamen hier sind bewusst disjunkt.
   Tokens sind semantische ALIASSE auf bestehende ORVIA-Variablen (keine neuen Farben). */
:root{
  --pf-accent:var(--accent);
  --pf-accent-soft:var(--accent-soft);
  --pf-surface:var(--surface);
  --pf-surface-raised:var(--soft);
  --pf-border:var(--border);
  --pf-border-strong:var(--border-strong);
  --pf-text:var(--text);
  --pf-text-muted:var(--text-muted);
  --pf-focus:rgba(201,174,124,.35);
  --pf-radius-card:16px;
  --pf-radius-control:12px;
  --pf-control-height:44px;   /* Touch-Minimum */
  --pf-space-1:8px;--pf-space-2:12px;--pf-space-3:16px;--pf-space-4:24px;
}
/* Gemeinsame Interaktions-Grundlagen */
.pf-choice,.pf-seg-opt,.pf-step-minus,.pf-step-plus,.pf-help-btn,.pf-progress-back{
  font:inherit;color:var(--pf-text);background:var(--pf-surface);border:1px solid var(--pf-border);
  border-radius:var(--pf-radius-control);cursor:pointer;-webkit-tap-highlight-color:transparent;
  min-height:44px;min-width:44px;box-sizing:border-box}
.pf-choice:focus-visible,.pf-seg-opt:focus-visible,.pf-step-minus:focus-visible,
.pf-step-plus:focus-visible,.pf-help-btn:focus-visible,.pf-progress-back:focus-visible{
  outline:none;box-shadow:0 0 0 3px var(--pf-focus);border-color:var(--pf-accent)}
.pf-is-disabled,.pf-choice[disabled],.pf-seg-opt[disabled],.pf-step-minus[disabled],.pf-step-plus[disabled],.pf-help-btn[disabled]{
  opacity:.45;cursor:not-allowed}

/* ---- ChoiceCard ---- */
.pf-choice{display:flex;align-items:center;gap:var(--pf-space-2);width:100%;
  min-height:56px;padding:var(--pf-space-2) var(--pf-space-3);text-align:left;
  border-radius:var(--pf-radius-card);transition:border-color .18s ease,background .18s ease}
.pf-choice-icon{font-size:22px;line-height:1;flex:0 0 auto}
.pf-choice-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
.pf-choice-label{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.pf-choice-desc{font-size:13.5px;color:var(--pf-text-muted);line-height:1.35;overflow-wrap:anywhere}
.pf-choice-check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#0b0f16;background:var(--pf-accent);opacity:0;transform:scale(.7);
  transition:opacity .15s ease,transform .15s ease}
.pf-choice.pf-is-selected{border-color:var(--pf-accent);background:var(--pf-surface-raised)}
.pf-choice.pf-is-selected .pf-choice-check{opacity:1;transform:scale(1)}

/* ---- SegmentedControl ---- */
.pf-segmented{display:flex;gap:6px;flex-wrap:wrap;max-width:100%}
.pf-seg-opt{flex:1 1 auto;padding:10px 14px;font-weight:600;font-size:15px;white-space:normal;overflow-wrap:anywhere}
.pf-seg-opt.pf-is-selected{border-color:var(--pf-accent);background:var(--pf-surface-raised);color:var(--pf-accent-soft);font-weight:700}

/* ---- Stepper ---- */
.pf-stepper{display:flex;flex-direction:column;gap:6px}
.pf-step-label{font-size:14px;font-weight:600;color:var(--pf-text-muted)}
.pf-step-row{display:flex;align-items:center;gap:var(--pf-space-2)}
.pf-step-minus,.pf-step-plus{font-size:22px;font-weight:700;flex:0 0 auto;width:48px}
.pf-step-value{flex:1 1 auto;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--pf-text);min-height:44px;display:flex;align-items:center;justify-content:center}

/* ---- InlineHelp ---- */
.pf-help{display:inline-flex;vertical-align:middle}
.pf-help-btn{width:44px;border-radius:50%;font-weight:800;color:var(--pf-accent);font-size:16px}
.pf-help-content{font-size:15px;line-height:1.5;color:var(--pf-text);text-align:left;white-space:pre-line}

/* ---- ProgressHeader ---- */
.pf-progress{display:flex;flex-direction:column;gap:6px;padding:var(--pf-space-2) 0}
.pf-progress-top{display:flex;align-items:center;gap:var(--pf-space-2)}
.pf-progress-back{flex:0 0 auto;font-size:24px;line-height:1}
.pf-progress-step{font-size:13.5px;font-weight:700;color:var(--pf-text-muted);letter-spacing:.02em}
.pf-progress-title{font-size:24px;font-weight:800;color:var(--pf-text);line-height:1.2;overflow-wrap:anywhere}
.pf-progress-support{font-size:14px;color:var(--pf-text-muted)}
.pf-progress-bar{height:5px;border-radius:999px;background:var(--pf-border);overflow:hidden}
.pf-progress-fill{height:100%;border-radius:999px;background:var(--pf-accent);transition:width .25s ease}

@media (prefers-reduced-motion: reduce){
  .pf-choice,.pf-choice-check,.pf-progress-fill{transition:none}
}
/* ==== ENDE PF UI-KIT (M2) ==== */

/* ==== OB3 (M5a) — neuer First-Run: Welcome + „Über dich" ==== */
.ob3-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 6px;text-align:center}
.ob3-mark{width:54px;height:54px;color:var(--accent)}
.ob3-brand{font-size:15px;font-weight:800;letter-spacing:.42em;color:var(--text);padding-left:.42em}
.ob3-claim{margin:6px 0 0;font-size:26px;font-weight:800;color:var(--text);line-height:1.2}
.ob3-lead{font-size:16px;line-height:1.5;color:var(--text-muted);text-align:center;margin:10px 0 14px;overflow-wrap:anywhere}
.ob3-benefits{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.ob3-benefits li{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-height:44px;box-sizing:border-box}
.ob3-benefits li::before{content:'✓';flex:0 0 auto;font-weight:800;color:var(--accent)}
.ob3-trust{font-size:13.5px;color:var(--text-muted);text-align:center;line-height:1.45;margin:0 0 4px}
.ob3-duration{font-size:13.5px;color:var(--text-faint);text-align:center;margin:0 0 8px}
.ob3-form{display:flex;flex-direction:column;gap:14px}
.ob3-birthmode{margin:2px 0}

.ob3-optional{font-weight:500;color:var(--text-faint)}
.ob3-sexcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:340px){ .ob3-sexcards{grid-template-columns:1fr} }
/* M5b (A2/A3): ChoiceCard-Grid für Sportauswahl/Hauptsport + gestapelte Level-Karten */
.ob3-choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:340px){ .ob3-choicegrid{grid-template-columns:1fr} }
.ob3-choicegrid .pf-choice{min-height:52px}
.ob3-stack{display:flex;flex-direction:column;gap:8px;margin-top:8px}
/* M6 (A4): gruppierte Zielauswahl + Detailfelder */
.ob3-goalgroup-label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:16px 0 2px}
.ob3-goalgroup-label:first-child{margin-top:8px}
.ob3-goaldetails{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.ob3-sublabel{display:block;font-size:13.5px;color:var(--text-muted);margin:8px 0 4px}
/* M7 (A5/A6/A7): Tages-Kreise, Skip-Button */
.ob3-daydots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ob3-daydot{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s ease,color .2s ease,background .2s ease}
.ob3-daydot.on{border-color:var(--accent);color:var(--accent);background:rgba(201,174,124,.12)}
.ob3-daydot:focus-visible{outline:2px solid rgba(201,174,124,.55);outline-offset:2px}
.ob3-skipbtn{margin-top:10px;width:100%}
/* M8 (A8): ReviewCards + Vollständigkeits-Banner + Erfolgsscreen */
.ob3-reviewcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-top:10px}
.ob3-reviewcard-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ob3-reviewcard-title{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint)}
.ob3-reviewedit{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.ob3-reviewedit:focus-visible{outline:2px solid rgba(201,174,124,.55);outline-offset:2px}
.ob3-reviewline{font-size:15.5px;color:var(--text);line-height:1.45;overflow-wrap:anywhere}
.ob3-reviewline:empty{display:none}
.ob3-badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--accent);border:1px solid var(--accent);border-radius:30px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.ob3-compbanner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:600;margin:4px 0 6px}
.ob3-compbanner.ok{color:#9fd6a8;background:rgba(90,170,110,.12);border:1px solid rgba(90,170,110,.35)}
.ob3-compbanner.warn{color:#e8c07a;background:rgba(201,150,60,.12);border:1px solid rgba(201,150,60,.35)}
.ob3-compcheck{font-weight:800}
.ob3-successmark{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--accent);border:2px solid var(--accent);background:rgba(201,174,124,.1);margin:6px auto 2px}
@media (prefers-reduced-motion: reduce){ .ob3-daydot{transition:none} }
.pf-choice-icon--svg{width:22px;height:22px;flex:0 0 22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
@media (prefers-reduced-motion: reduce){ .ob3-hero,.ob3-benefits li{transition:none} }
/* ==== ENDE OB3 (M5a+M5b) ==== */

.pc-root{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}

.pc-ava{width:58px;height:58px;border-radius:50%;flex:0 0 58px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--accent);background:linear-gradient(135deg,#121a26,#0c131d);border:1px solid var(--border);overflow:hidden}
.pc-ava img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pc-id{flex:1;min-width:0}
.pc-name{font-size:20px;font-weight:800;color:var(--text);line-height:1.2;overflow-wrap:anywhere}
.pc-sport{margin-top:3px;font-size:13.5px;color:var(--text-muted)}
.pc-sportbadge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:30px;padding:2px 10px}

.pc-muted{color:var(--text-faint)}

.pc-ring-fill{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .4s ease}
.pc-ring-fill.done{stroke:#8fcf9a}
.pc-ring-text{fill:var(--text);font-size:15px;font-weight:800}
.pc-headmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px}
.pc-headstate{font-weight:700}
.pc-headstate.ok{color:#9fd6a8}
.pc-headstate.warn{color:#e8c07a}
.pc-updated{color:var(--text-faint)}
.pc-prompts{display:flex;flex-direction:column;gap:8px}
.pc-prompt{display:flex;flex-direction:column;gap:2px;text-align:left;border-radius:14px;padding:12px 14px;min-height:44px;cursor:pointer;border:1px solid var(--border);background:var(--surface)}
.pc-prompt-high{border-color:rgba(201,150,60,.5);background:rgba(201,150,60,.08)}
.pc-prompt-title{font-size:14.5px;font-weight:700;color:var(--text)}
.pc-prompt-hint{font-size:13px;color:var(--text-muted);line-height:1.4}
.pc-prompt:focus-visible,.pc-card:focus-visible{outline:2px solid rgba(201,174,124,.55);outline-offset:2px}
.pc-group{display:flex;flex-direction:column;gap:8px}
.pc-group-label{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin:8px 0 0}
.pc-card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;min-height:60px;cursor:pointer;transition:border-color .2s ease}
.pc-card:active{border-color:var(--accent)}
.pc-card-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.pc-card-title{font-size:15.5px;font-weight:700;color:var(--text)}
.pc-card-sub{font-size:13px;color:var(--text-muted);line-height:1.4;overflow-wrap:anywhere}
.pc-card-side{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pc-arrow{color:var(--text-faint);font-size:20px;line-height:1}
.pc-chip{font-size:11.5px;font-weight:700;border-radius:30px;padding:3px 9px;white-space:nowrap}
.pc-chip-ok{color:#9fd6a8;background:rgba(90,170,110,.12);border:1px solid rgba(90,170,110,.3)}
.pc-chip-missing{color:#e8c07a;background:rgba(201,150,60,.12);border:1px solid rgba(201,150,60,.35)}
.pc-chip-review{color:#e8c07a;background:rgba(201,150,60,.08);border:1px solid rgba(201,150,60,.25)}
.pc-chip-stale{color:#e89a7a;background:rgba(200,110,70,.12);border:1px solid rgba(200,110,70,.35)}
.pc-chip-optional{color:var(--text-faint);background:transparent;border:1px solid var(--border)}
.pc-plan{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);border:1px solid rgba(201,174,124,.45);border-radius:30px;padding:1px 7px;margin-left:7px;vertical-align:middle}

/* ==== CM (M9) — Orientierungs-Spotlight ==== */

.cm-spot-title{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--text)}
.cm-spot-text{margin:0 0 14px;font-size:14.5px;line-height:1.5;color:var(--text-muted)}
.cm-spot-dismiss{display:block;width:100%;margin-top:8px;min-height:44px;background:transparent;border:none;color:var(--text-faint);font-size:14px;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion: reduce){ .cm-spot-bg{transition:none} }
/* ==== ENDE CM (M9) ==== */

/* ==== QA (Track B) — Plus-Button + Quick-Action-Sheet ====
   Historie: Der Spezifitäts-Fix (Completion-Fixpaket 2026-07-09) sicherte den
   Plus-Button mit `.tabbar button.nav-plus` (0,2,1) gegen `.tabbar button` (0,1,1)
   ab, solange der Button ein Kind der Bar war.
   Seit der Shell-v3-Migration liegt er als `<button id="navPlus" class="fab">`
   AUSSERHALB der `.tabbar`; die Klasse `nav-plus` kommt im Laufzeitcode nicht mehr
   vor. Die `.tabbar button.nav-plus`-Regeln konnten daher kein Element mehr treffen
   und sind in GM7 (Legacy-Deaktivierung) entfallen. Maßgeblich ist heute
   `#navPlus.fab` (1,1,0) — siehe die .fab-Regeln weiter unten. */
.qa-root{display:flex;flex-direction:column;gap:8px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
.qa-sec{display:flex;flex-direction:column;gap:8px}
.qa-group-label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin:10px 0 0}
.qa-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;min-height:56px;cursor:pointer;transition:border-color .18s ease}

/* ============================================================

   ist in GM7 entfallen: renderCommand rendert die GM-Kette (gmHero/gmDashVM).
   KEINE Demo-Elemente (demobar/statusbar/phone) — nur produktive Shell.
   ============================================================ */
:root{
  --card-1:#111a26; --card-2:#0c131d;
  --ready:#43D693; --ready-t:rgba(67,214,147,.15);
  --activity:#5AA0F0; --activity-t:rgba(90,160,240,.15);

  --crit:#F0637A; --crit-t:rgba(240,99,122,.15);
  --sleep:#9585ED; --sleep-t:rgba(149,133,237,.15);
  /* v8-312: eigene Sport-Kachel-Farben Fussball/Mobility — bewusst NICHT identisch mit
     einer bereits semantisch belegten Farbe (--attention/--crit=Warnung/kritisch,
     --sleep=Schlaf, --ready=Laufen), siehe ui.js gmOpenStartSheet-Kommentar. */
  --team:#DD7E4A; --team-t:rgba(221,126,74,.15);
  --recovery:#CC8C9E; --recovery-t:rgba(204,140,158,.15);

/* ---- FAB: separater Quick-Action-Zugang (behält #navPlus-Logik) ---- */
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 104px);z-index:51;
  width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;color:#20180a;
  background:var(--gold-grad);box-shadow:0 14px 34px rgba(201,174,124,.35),0 4px 10px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;transition:transform .18s}
.fab .ic{width:24px;height:24px}
.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---- v3-Header (Heute → Dashboard): Begrüßung klein, Name groß, Datum-Zeile, Sync ---- */
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted,#9BA1AD);margin:6px 0 14px}
.sync .pulse{width:8px;height:8px;border-radius:50%;background:var(--text-faint,#656C79);flex:0 0 auto}
.sync[data-state="synced"] .pulse{background:var(--ready);box-shadow:0 0 0 4px var(--ready-t)}
.sync[data-state="pending"] .pulse,.sync[data-state="offline"] .pulse{background:var(--attention);box-shadow:0 0 0 4px var(--attention-t)}
.sync[data-state="error"] .pulse{background:var(--crit);box-shadow:0 0 0 4px var(--crit-t)}
.lvlbadge{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;

  border-radius:999px;padding:4px 10px}

:root{
  --font:Inter,Geist,Manrope,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  --bg:#070C14; --bg-rgb:7,12,20; --card-1:#111a26; --card-2:#0c131d;
  --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16); --hair:rgba(255,255,255,.07);
  --text:#F5F3ED; --muted:#B4BDC9; --faint:#8A93A1; --neutral:#8A93A1;
  --gold:#C9AE7C; --gold-soft:#E0CB9E; --gold-dark:#8E7647; --gold-grad:linear-gradient(135deg,#DCC79A,#C9AE7C 55%,#8E7647);
  --ready:#43D693; --ready-t:rgba(67,214,147,.15); --activity:#5AA0F0; --activity-t:rgba(90,160,240,.15);
  --attention:#EDB44E; --attention-t:rgba(237,180,78,.15); --crit:#F0637A; --crit-t:rgba(240,99,122,.15);
  --sleep:#9585ED; --sleep-t:rgba(149,133,237,.15); --cyan:#4FD3D3; --cyan-t:rgba(79,211,211,.15);
  --team:#DD7E4A; --team-t:rgba(221,126,74,.15); --recovery:#CC8C9E; --recovery-t:rgba(204,140,158,.15);
  --r-card:22px; --r-mid:16px; --r-ctrl:12px; --r-pill:999px; --shadow:0 14px 34px rgba(4,5,8,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);min-height:100vh;background:radial-gradient(900px 500px at 50% -5%,#0d1626,#080d16 60%,#05080e);-webkit-font-smoothing:antialiased}
.screen{position:relative;min-height:100vh;overflow-x:hidden;background:radial-gradient(760px 620px at 50% -12%,#0b1320 0%,#091019 46%,#070C14 76%);padding:0 0 128px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex-shrink:0}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px;stroke-width:2}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 18px 6px}
.greet{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hdr h1{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.hdr .date{font-size:12.5px;color:var(--faint);margin-top:2px;font-weight:650}
.hdr-actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.lvlbadge{font-size:10px;font-weight:800;letter-spacing:.05em;padding:5px 10px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);color:var(--gold-soft);display:inline-flex;align-items:center;gap:5px;margin:6px 18px 0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:650;margin:6px 18px 0}
.sync .pulse{width:7px;height:7px;border-radius:50%;background:var(--ready);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,214,147,.45)}70%{box-shadow:0 0 0 7px rgba(67,214,147,0)}100%{box-shadow:0 0 0 0 rgba(67,214,147,0)}}

.card{background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid rgba(255,255,255,.06);border-radius:var(--r-card);padding:18px;margin:0 18px 14px;box-shadow:var(--shadow)}
.card.tight{padding:15px 16px}
.tap{cursor:pointer;transition:transform .12s,border-color .18s}
.tap:active{transform:scale(.985)}
.taphint{position:absolute;top:14px;right:14px;color:var(--faint);opacity:.6}
.ctitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.ctitle .l{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:750;letter-spacing:-.01em}
.ctitle .l .ic{width:17px;height:17px}
.ctitle .more{font-size:11.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:2px;cursor:pointer}

.hero{margin:8px 18px 14px;border-radius:26px;padding:20px 18px 16px;position:relative;overflow:hidden;background:linear-gradient(180deg,#131f2e,#0b131e);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 50px rgba(4,6,10,.55)}
.hero.simple{padding:26px 18px 20px}
.hero-top{display:flex;gap:16px;align-items:center}
.hero.simple .hero-top{flex-direction:column;text-align:center;gap:8px}
.ring-wrap{position:relative;flex-shrink:0;cursor:pointer}
.ring-wrap svg.ringsvg{transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero.simple .ring-c .big{font-size:54px}
.ring-c .u{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;letter-spacing:.04em;display:flex;align-items:center;gap:3px}
.statuspill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 11px;border-radius:var(--r-pill);margin-top:8px}
.hero-right{flex:1;min-width:0}
.hero.simple .hero-right{text-align:center}
.hero-right .lead{font-size:14.5px;font-weight:750;letter-spacing:-.01em;line-height:1.25}
.hero.simple .lead{font-size:19px;margin-top:4px}
.hero-right .why{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.42}
.hero.simple .why{font-size:14px;margin-top:7px}
.deltas{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.hero.simple .deltas{justify-content:center}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:750;padding:4px 9px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.delta.up{color:var(--ready)}.delta.dn{color:var(--crit)}

.cta-row{display:flex;gap:9px;margin-top:14px}
.cta{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 14px;border-radius:15px;font-weight:800;font-size:14.5px;cursor:pointer;border:none;font-family:var(--font);letter-spacing:-.01em}
.cta .ct-sub{font-size:11px;font-weight:650;opacity:.72;margin-top:1px}
.cta.prim{background:var(--gold-grad);color:#20180a;box-shadow:0 8px 22px rgba(201,174,124,.38);flex-direction:column;gap:1px;text-align:center}
.cta.ghost{flex:0 0 auto;background:var(--surface);border:1px solid var(--border-strong);color:var(--text);width:52px;padding:15px 0}
.cta.wide-ghost{background:var(--surface);border:1px solid var(--border-strong);color:var(--text);flex-direction:column;gap:1px}

.batt{margin-top:14px;background:rgba(255,255,255,.035);border:1px solid var(--hair);border-radius:16px;padding:13px 14px;position:relative}
.batt-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.batt-head .t{font-size:12px;font-weight:750;display:flex;align-items:center;gap:7px}
.batt-head .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.batt-head .v small{font-size:12px;color:var(--muted);font-weight:700}
.batt-track{height:14px;border-radius:8px;background:#0a1019;border:1px solid var(--hair);overflow:hidden}
.batt-fill{height:100%;border-radius:7px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.batt-sub{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:650;margin-top:7px}
.batt-sub .chg{color:var(--ready)}.batt-sub .drn{color:var(--attention)}

.reco{margin-top:14px;border-radius:16px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start;border:1px solid}
.reco .rc-ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reco .rc-ic .ic{width:18px;height:18px}
.reco .rt{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.reco .rd{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.reco.big .rt{font-size:15px}.reco.big .rd{font-size:13.5px}
.reco.ready{background:var(--ready-t);border-color:rgba(67,214,147,.3)}.reco.ready .rc-ic{background:rgba(67,214,147,.22);color:var(--ready)}.reco.ready .rt{color:var(--ready)}
.reco.attention{background:var(--attention-t);border-color:rgba(237,180,78,.3)}.reco.attention .rc-ic{background:rgba(237,180,78,.22);color:var(--attention)}.reco.attention .rt{color:var(--attention)}
.reco.crit{background:var(--crit-t);border-color:rgba(240,99,122,.32)}.reco.crit .rc-ic{background:rgba(240,99,122,.22);color:var(--crit)}.reco.crit .rt{color:var(--crit)}
.prescription{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}.prescription b{color:var(--text)}
.adjust{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-strong)}
.adjust-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800;margin-bottom:8px}
.adjust-row{display:flex;gap:6px;flex-wrap:wrap}
.adjchip{font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.adjchip .ic{width:13px;height:13px;color:var(--muted)}
.changelog{margin-top:11px;font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 11px}
.changelog .ic{color:var(--gold-soft);flex-shrink:0;margin-top:1px}.changelog b{color:var(--text)}

.checkin{display:flex;align-items:center;gap:13px;cursor:pointer}
.checkin .ci-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.checkin .ci-b{flex:1;min-width:0}.checkin .ci-t{font-size:14px;font-weight:750}.checkin .ci-s{font-size:12px;color:var(--muted);margin-top:2px}
.ci-pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:var(--r-pill)}
.ci-open{background:var(--attention-t);color:var(--attention)}.ci-done{background:var(--ready-t);color:var(--ready)}
.ci-vals{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ci-val{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:4px 8px;border-radius:8px}.ci-val b{color:var(--text)}
.ci-simple .q{font-size:15px;font-weight:750;text-align:center;margin-bottom:13px}
.moods{display:flex;gap:10px}
.mood{flex:1;padding:14px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--border);cursor:pointer;text-align:center;transition:.15s}
.mood.on{border-color:var(--ready);background:var(--ready-t)}
.mood .em{font-size:26px;line-height:1}.mood .ml{font-size:12px;font-weight:700;margin-top:6px;color:var(--muted)}.mood.on .ml{color:var(--ready)}

.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 18px 14px}
.kcard{background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0;position:relative}
.kcard .kh{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:750;color:var(--muted)}
.kcard .kh .ic{width:15px;height:15px}
.kcard .kv{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.kcard .kv small{font-size:13px;color:var(--muted);font-weight:700}
.kcard .kd{font-size:11px;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:4px}
.kd.up{color:var(--ready)}.kd.dn{color:var(--crit)}.kd.flat{color:var(--faint)}
/* GM7.9h: Die Analyse-Kacheln (Erholung/Ausdauer) verwenden kc-h/kc-ic/kc-l/kc-v, wofuer es
   bisher KEINE einzige Regel gab — sie fielen auf Browser-Defaults zurueck (Inline-Fluss,
   Standardschriftgroesse, kein Muted-Kontrast, Wert ohne Tabellenziffern). Die Werte sind 1:1
   aus dem bestehenden .kcard-Vertrag (.kh/.kv) uebernommen, damit beide Kachelvarianten
   identisch aussehen — keine neuen Design-Tokens, keine Markup-Aenderung. */
.kcard .kc-h{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:750;color:var(--muted);min-width:0}
.kcard .kc-ic{display:inline-flex;align-items:center;flex:0 0 auto}
.kcard .kc-ic .ic{width:15px;height:15px}
.kcard .kc-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kcard .kc-v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.kcard .kc-v small{font-size:13px;color:var(--muted);font-weight:700}
.kcard .kc-v .rcv-stale{font-size:10px;font-weight:750}
.spark{margin-top:9px;height:30px;width:100%}
.bar-mini{height:8px;border-radius:5px;background:#0a1019;overflow:hidden;margin-top:9px;border:1px solid var(--hair)}
.bar-mini>i{display:block;height:100%;border-radius:5px}

.simplecard{display:flex;align-items:center;gap:14px}
.simplecard .sc-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.simplecard .sc-t{font-size:14px;font-weight:750}.simplecard .sc-v{font-size:12.5px;color:var(--muted);margin-top:2px}
.simplecard .sc-big{margin-left:auto;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.goalbar{height:9px;border-radius:6px;background:#0a1019;overflow:hidden;margin-top:12px;border:1px solid var(--hair)}
.goalbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold-dark),var(--gold))}
.goalmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:650;margin-top:8px}

.mod-wide .body{display:flex;gap:14px;align-items:center}
.load-stats{display:flex;gap:16px;flex:1}
.load-stats .ls{flex:1}.load-stats .ls .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.load-stats .ls .l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px}
.zoneband{height:9px;border-radius:6px;margin-top:12px;background:linear-gradient(90deg,#2b3a2f 0%,var(--ready) 30%,var(--ready) 55%,var(--attention) 78%,var(--crit) 100%);position:relative}
.zoneband .mk{position:absolute;top:-4px;width:3px;height:17px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.range-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:650;margin-top:7px}
.datarow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.datacell{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 11px}
.datacell .dl{font-size:10px;color:var(--muted);font-weight:700}.datacell .dn{font-size:14px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.sportbars{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.sportbar{display:flex;align-items:center;gap:10px}.sportbar .sn{width:56px;font-size:11px;font-weight:700;color:var(--muted)}
.sportbar .st{flex:1;height:8px;border-radius:5px;background:#0a1019;overflow:hidden}.sportbar .st i{display:block;height:100%;border-radius:5px}
.sportbar .sv{width:34px;text-align:right;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.interf{margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.45;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 11px}.interf b{color:var(--text)}

.next-row{display:flex;align-items:center;gap:12px}
.next-ic{width:44px;height:44px;border-radius:13px;background:var(--activity-t);color:var(--activity);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next-b{flex:1;min-width:0}.next-t{font-size:14px;font-weight:750}.next-s{font-size:12px;color:var(--muted);margin-top:2px}
.next-tag{font-size:10px;font-weight:800;color:var(--activity);background:var(--activity-t);padding:3px 8px;border-radius:7px}

.warn{border:1px solid rgba(240,99,122,.32);background:var(--crit-t)}
.warn .wrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(240,99,122,.16)}
.warn .wrow:last-child{border-bottom:none;padding-bottom:0}.warn .wrow:first-of-type{padding-top:0}
.warn .w-ic{color:var(--crit);flex-shrink:0;margin-top:1px}.warn .wt{font-size:12.5px;font-weight:750}.warn .wd{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.38}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 16px;color:var(--muted)}
.empty .e-ic{width:46px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:11px}
.empty .et{font-size:13px;font-weight:750;color:var(--text)}.empty .ed{font-size:12px;margin-top:4px;line-height:1.45;max-width:250px;color:var(--muted)}
.empty .eb{margin-top:13px;font-size:12.5px;font-weight:750;color:var(--gold-soft);background:rgba(201,174,124,.1);border:1px solid rgba(201,174,124,.32);padding:9px 16px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.gapnote{margin:0 18px 14px;padding:11px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--border);font-size:11.5px;color:var(--muted);display:flex;gap:9px;align-items:flex-start;line-height:1.4}
.gapnote .ic{color:var(--activity);flex-shrink:0;margin-top:1px}.gapnote b{color:var(--text)}
.hero.gap{border-style:dashed;border-color:var(--border-strong);background:linear-gradient(180deg,#0f1620,#0b121b)}
.errbar{margin:8px 18px 14px;padding:12px 14px;border-radius:14px;background:var(--crit-t);border:1px solid rgba(240,99,122,.3);color:var(--text);font-size:12.5px;display:flex;gap:10px;align-items:center}
.errbar .ic{color:var(--crit)}.errbar b{font-weight:750}

.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%);background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:10px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

.sectlabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;margin:20px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.sectlabel .edit{color:var(--gold-soft);cursor:pointer;font-weight:750;letter-spacing:.02em;text-transform:none;font-size:12px;display:flex;align-items:center;gap:5px}
.eduhint{margin:0 18px 14px;padding:12px 14px;border-radius:14px;background:var(--activity-t);border:1px solid rgba(90,160,240,.28);font-size:12px;color:var(--muted);display:flex;gap:9px;align-items:flex-start;line-height:1.42}
.eduhint .ic{color:var(--activity);flex-shrink:0;margin-top:1px}.eduhint b{color:var(--text)}
.addmod{margin:4px 18px 0;padding:15px;border:1.5px dashed var(--border-strong);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:13px;font-weight:750;cursor:pointer;background:rgba(255,255,255,.015)}

/* interaktiver Chart */
.ochart{position:relative;margin-top:4px}
.oc-svg{width:100%;height:auto;display:block;touch-action:none;outline:none}
.oc-svg:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;border-radius:8px}
.oc-line{fill:none;stroke-width:2.4;vector-effect:non-scaling-stroke}

/* FAB (kompakt, über der Glasleiste) */
.fab{position:fixed;right:18px;bottom:94px;width:52px;height:52px;border-radius:50%;background:var(--gold-grad);border:none;color:#1a1206;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:40;box-shadow:0 8px 22px rgba(201,174,124,.42),0 0 0 1px rgba(255,255,255,.12) inset;transition:transform .28s cubic-bezier(.3,1,.4,1),opacity .25s}
.fab .ic{width:25px;height:25px;stroke-width:2.4;transition:transform .3s}
.fab:active .ic{transform:rotate(90deg)}

/* Glas-Navigation */
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:35}
/* iPhone-Liquid-Glass-ANMUTUNG: Transparenz + backdrop-filter (Blur/Saturation) +
   Kantenlicht. KEINE physikalische Refraktion (backdrop-filter:url() fehlt in Safari).
   Produktentscheidung GM7 Stufe 6: Premium-Glas ohne Verzerrung. */
.tabwrap{pointer-events:auto;position:relative;display:flex;gap:2px;
  background:linear-gradient(158deg,rgba(58,72,92,.34),rgba(16,22,32,.42) 46%,rgba(10,14,22,.58));
  backdrop-filter:blur(34px) saturate(2) brightness(1.12);-webkit-backdrop-filter:blur(34px) saturate(2) brightness(1.12);
  border:1px solid rgba(255,255,255,.14);border-radius:34px;padding:8px 10px;
  box-shadow:0 22px 50px rgba(0,0,0,.6), 0 2px 10px rgba(0,0,0,.35),
    inset 0 1.4px 0.5px rgba(255,255,255,.55), inset 0 -14px 22px rgba(6,10,18,.55), inset 0 0 0 1px rgba(255,255,255,.05);
  isolation:isolate}
/* obere Spiegelung / Sheen */
.tabwrap::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 90% at 26% -20%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%),
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 34%);
  mix-blend-mode:screen;opacity:.9}
/* unterer Lichtsaum (dekorativer Gradient — keine echte Brechung) */
.tabwrap::after{content:"";position:absolute;left:12%;right:12%;bottom:2px;height:12px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(60% 100% at 50% 100%, rgba(150,190,255,.22), rgba(150,190,255,0) 70%);filter:blur(3px)}
.tabwrap button{background:none;border:none;color:var(--faint);width:58px;height:48px;border-radius:22px;cursor:pointer;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--font);transition:color .25s}
.tabwrap button .tl{font-size:9px;font-weight:750;letter-spacing:.01em}
.tabwrap button .ic,.tabwrap button .tl{position:relative;z-index:1}
/* aktiver Glas-Indikator hinter dem Tab (Transparenz/Blur, keine Refraktion) */
.tabwrap button.on{color:#F4ECDA}
.tabwrap button.on::before{content:"";position:absolute;inset:2px;border-radius:20px;z-index:0;
  background:linear-gradient(160deg, rgba(201,174,124,.30), rgba(201,174,124,.08) 60%, rgba(255,255,255,.04));
  box-shadow:inset 0 1px 0.5px rgba(255,255,255,.6), inset 0 -6px 12px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.16)}
.tabwrap button.on .ic{transform:translateY(-1px) scale(1.08)}
.tabwrap button .ic{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}

/* GM7.9k — Ebenenordnung der Vollbild- und Overlay-Schichten, an EINER Stelle dokumentiert,
   damit kuenftige Aenderungen nicht erneut kollidieren:
       35  .tabbar          40/51 .fab
      140  .gm-page         (Plan-Session, Aktivitaetsdetail, Kennzahlenbibliothek)
      150  #gmProfPage
      160  .scrim           161 .sheet        <- Sheets MUESSEN ueber jeder Vollseite liegen
      200  .gm-story
      300+ Onboarding / Splash / Gate
   Vorher lagen die Sheets auf 60/61 und damit UNTER den Vollseiten: ein Tippen auf eine
   Kennzahl in der Bibliothek oeffnete das Detail-Sheet unsichtbar im Hintergrund — es wurde
   erst sichtbar, nachdem man die Seite verlassen hat. Gleiches galt fuer Sheets aus der
   Plan-Session und dem Aktivitaetsdetail. */
.scrim{position:fixed;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:160}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,#131c28,#0c1019);border:1px solid rgba(255,255,255,.09);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .32s cubic-bezier(.32,1,.4,1);z-index:161;box-shadow:0 -20px 60px rgba(0,0,0,.55);max-height:86%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:2px auto 14px}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
.sheet .sh-sub{font-size:12.5px;color:var(--muted);margin-top:2px;margin-bottom:14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sh-hic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sh-block{margin-top:16px}

.sh-block p{font-size:13px;color:var(--muted);line-height:1.5}.sh-block p b{color:var(--text)}
.sh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.sh-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 11px}
.sh-stat .l{font-size:10px;color:var(--muted);font-weight:700}.sh-stat .n{font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
