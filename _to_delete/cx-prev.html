  box-shadow:var(--shadow-soft,0 22px 60px rgba(2,6,14,.6));
  max-height:calc(100dvh - 40px - var(--sat) - env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.ob2-prog{margin-bottom:18px}
.ob2-prog-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.ob2-prog-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#c9ae7c,#dcc79a);transition:width .35s ease}
.ob2-prog-txt{font-size:12px;color:var(--text-muted);margin-top:8px}
.ob2-title{font-size:21px;font-weight:800;color:var(--text);margin:6px 0 10px;outline:none}
.ob2-title:focus-visible{outline:2px solid var(--accent,#c9ae7c);outline-offset:3px;border-radius:6px}
.ob2-desc{font-size:14.5px;line-height:1.55;color:var(--text-muted);margin:0 0 18px}
.ob2-note{font-size:12.5px;line-height:1.5;color:var(--text-faint);background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin:0 0 16px}
.ob2-nav{display:flex;gap:10px;margin-top:6px}
.ob2-nav .btn{flex:1;min-height:48px}
.ob2-later{display:block;width:100%;margin-top:12px;min-height:44px;background:none;border:none;
  color:var(--text-muted);font-size:13px;cursor:pointer}
.ob2-later:focus-visible{outline:2px solid var(--accent,#c9ae7c);outline-offset:2px;border-radius:8px}
@media (min-width:560px){ .ob2-card{padding:30px 28px} }
@media (prefers-reduced-motion:reduce){ .ob2-prog-bar i{transition:none} }
.ob2-form{margin:0 0 4px}
.ob2-field{margin-bottom:16px}
.ob2-field>label{display:block;font-size:13px;font-weight:650;color:var(--text-muted);margin-bottom:6px}
.ob2-hint{font-size:12px;color:var(--text-faint);margin:0 0 6px;line-height:1.4}
.ob2-field input,.ob2-field select{width:100%;min-height:48px;padding:12px 14px;font-size:16px;border-radius:13px;
  border:1px solid var(--border);background:#0c131d;color:var(--text);font-weight:600;-webkit-appearance:none;appearance:none}
.ob2-field input:focus,.ob2-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,174,124,.18)}
.ob2-field input[aria-invalid="true"]{border-color:var(--danger,#fb7185)}
.ob2-row2{display:flex;gap:10px}
.ob2-row2 input{flex:1;min-width:0}
.ob2-units{display:flex;flex-direction:column;gap:8px}
.ob2-units label{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--text);min-height:44px;cursor:pointer}
.ob2-units input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
.ob2-err{display:block;font-size:12px;color:var(--danger,#fb7185);margin-top:6px;min-height:1px}
.ob2-err:empty{margin-top:0}
.ob2-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ob2-chip{min-height:44px;padding:9px 14px;border-radius:14px;border:1px solid var(--border);background:#0c131d;color:var(--text);
  font-size:14px;font-weight:600;cursor:pointer;max-width:100%}
.ob2-chip.on{border-color:var(--accent,#c9ae7c);background:rgba(201,174,124,.16);color:var(--accent-soft,#dcc79a)}
.ob2-chips{display:flex;flex-wrap:wrap;gap:8px}
.ob2-goalrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;min-width:0}
.ob2-goalrow .ob2-input{flex:1;min-width:0}
.ob2-input{min-height:44px;padding:10px 12px;font-size:16px;border-radius:12px;border:1px solid var(--border);background:#0c131d;color:var(--text);box-sizing:border-box}
.ob2-segbtn{min-height:40px;padding:8px 12px;border-radius:11px;border:1px solid var(--border);background:#0c131d;color:var(--text-muted);font-size:13px;cursor:pointer;white-space:nowrap}
.ob2-x{min-height:40px;width:40px;border-radius:11px;border:1px solid rgba(244,63,94,.4);background:#0c131d;color:#fb7185;cursor:pointer}
.ob2-check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-muted);margin-bottom:12px}
.ob2-sumrow{border-bottom:1px solid rgba(255,255,255,.08);padding:8px 0}
.ob2-sumh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.ob2-sumrow p{margin:4px 0;font-size:14px}
.ob2-chip:focus-visible{outline:2px solid var(--accent,#c9ae7c);outline-offset:2px}
.ob2-sportrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.ob2-sportname{font-weight:700;font-size:14px;color:var(--text);flex:1;min-width:120px}
.ob2-sportsub{font-size:12px;color:var(--text-faint)}
.ob2-sportopts{display:flex;flex-wrap:wrap;gap:6px 14px}
.ob2-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(201,174,124,.18);color:var(--accent-soft,#dcc79a);vertical-align:middle}
.ob2-mini{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);min-height:34px;cursor:pointer}
.ob2-mini input{width:16px;height:16px;accent-color:var(--accent)}
.ob2-badge.sub{background:rgba(255,255,255,.07);color:var(--text-faint)}
.ob2-sub{font-size:11px;color:var(--text-faint)}
.ob2-prio{display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:var(--accent-soft,#dcc79a);min-height:34px}
.ob2-mvbtn{min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--text);border-radius:10px;font-size:16px;line-height:1;cursor:pointer;flex:0 0 auto}
.ob2-mvbtn:disabled{opacity:.32;cursor:not-allowed}
.ob2-mvbtn:focus-visible{outline:2px solid var(--accent,#c9ae7c);outline-offset:2px}
/* Auswahl-Häkchen im Chip */
.ob2-check{font-size:12px;font-weight:800;margin-right:5px;color:var(--accent,#c9ae7c)}
/* Kompakter Hilfeblock */
.ob2-help{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:12px;line-height:1.55;color:var(--text-faint);display:flex;flex-direction:column;gap:3px}
.ob2-help strong{color:var(--text-muted);font-weight:700}
/* Kompakte Sport-Karte */
.ob2-spcard{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 13px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.ob2-spcard.primary{border-color:rgba(201,174,124,.35);background:rgba(201,174,124,.07)}
.ob2-spcard-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ob2-spname{font-weight:700;font-size:15px;color:var(--text);flex:1;min-width:0}
.ob2-spmeta{font-size:12px;color:var(--text-faint);margin-top:4px}
/* Segment-Control (ganze Fläche klickbar, ≥44px) */
.ob2-seg{display:flex;gap:6px;margin-top:10px}
.ob2-segbtn{flex:1;min-height:44px;padding:0 10px;border:1px solid var(--border);background:#0c131d;color:var(--text-muted);border-radius:11px;font-size:13.5px;font-weight:650;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.ob2-segbtn.on{border-color:var(--accent,#c9ae7c);background:rgba(201,174,124,.16);color:var(--accent-soft,#dcc79a)}
.ob2-segbtn:focus-visible{outline:2px solid var(--accent,#c9ae7c);outline-offset:2px}
/* Zeile mit Label + Control */
.ob2-sprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;min-height:44px}
.ob2-sprow-lbl{font-size:13.5px;color:var(--text-muted);min-width:0}
.ob2-mv{display:flex;gap:6px;flex:0 0 auto}
/* Toggle-Switch (volle Fläche klickbar) */
.ob2-toggle{position:relative;width:52px;height:32px;min-height:32px;border-radius:18px;border:1px solid var(--border);background:#0c131d;cursor:pointer;flex:0 0 auto;padding:0;-webkit-tap-highlight-color:transparent}
.ob2-toggle .ob2-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text-faint);transition:left .15s ease,background .15s ease}
.ob2-toggle.on{border-color:var(--accent,#c9ae7c);background:rgba(201,174,124,.22)}
.ob2-toggle.on .ob2-knob{left:23px;background:var(--accent,#c9ae7c)}
.ob2-toggle:focus-visible{outline:2px solid var(--accent,#c9ae7c);outline-offset:2px}
/* Sticky Navigation am unteren Kartenrand (iPhone: Weiter immer erreichbar) */
.ob2-navwrap{position:sticky;bottom:0;margin:14px -22px -26px;padding:12px 22px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,#0c131d 72%,rgba(12,19,29,0));backdrop-filter:blur(2px)}
@media (min-width:560px){ .ob2-navwrap{margin:14px -28px -30px;padding:14px 28px calc(16px + env(safe-area-inset-bottom))} }
/* Manuelle Aktivitätserfassung (Inkrement 2A): Segmente + Gruppen, mobil ohne Overflow */
.ma-seg{display:flex;flex-wrap:wrap;gap:6px}
.ma-seg .ob2-segbtn{flex:1 1 auto;min-width:84px}
.gm-chip-more{border-style:dashed;opacity:.92}
.ma-group{margin:0 0 6px}
.ma-group-h{font-size:12px;font-weight:700;color:var(--text-muted);margin:10px 0 4px}
.ma-actions{margin-top:16px}
.btn.danger-btn{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.4);color:#fb7185}
.btn.danger-btn:active{background:rgba(244,63,94,.2)}
/* Gym-Muskelkarten (Inkrement 2C produktiv) */
.mvcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mvcard{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 13px;background:rgba(255,255,255,.02);cursor:pointer}
.mvcard:focus-visible{outline:2px solid var(--accent,#c9ae7c);outline-offset:2px}
.mvc-h{font-weight:700;font-size:15px;color:var(--text)}
.mvc-main{font-size:14px;color:var(--text-muted);margin-top:4px}
.mvc-sub{font-size:12.5px;color:var(--text-faint)}
.mvc-eff{font-size:13.5px;color:var(--accent-soft,#dcc79a);margin-top:4px}
.mvc-week{font-size:12.5px;color:var(--text-faint)}
.mvc-corr{font-size:12px;color:var(--text-faint);margin-top:4px}
.mvc-conf{font-size:11.5px;color:var(--text-faint);margin-top:2px}
.mv-info{margin-top:10px;font-size:12.5px;color:var(--text-faint)}
.mv-info summary{cursor:pointer;color:var(--text-muted)}
.mv-info p{margin:6px 0}
/* Ziele-Verwaltung (Inkrement 2) */
.gm-sec{font-size:12px;font-weight:700;color:var(--text-muted);margin:14px 0 6px}
.gmcard{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.02)}
.gmc-h{font-weight:700;font-size:14.5px;color:var(--text)}
.gmc-meta{font-size:12px;color:var(--text-faint);margin-top:2px}
.gmc-prog{font-size:12px;color:var(--accent-soft,#dcc79a);margin-top:4px}
.gmc-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gmc-b{min-height:36px;padding:0 10px;border:1px solid var(--border);background:#0c131d;color:var(--text-muted);border-radius:9px;font-size:12.5px;cursor:pointer}
.gmc-b.danger-btn{color:#fb7185;border-color:rgba(244,63,94,.4)}
.gm-conflict{border:1px solid rgba(251,146,60,.4);background:rgba(251,146,60,.08);border-radius:12px;padding:10px 12px;margin:8px 0}
.gm-conflict p{margin:4px 0 8px;font-size:13px;color:var(--text-muted)}
/* Zielliste 12.09.: Prioritaets-Hinweis (blau statt Konflikt-orange), abgelaufenes Zieldatum, Nicht-Hauptziel mit Prio 1 */
.gm-conflict.gm-prio{border-color:rgba(96,165,250,.45);background:rgba(96,165,250,.08)}
.gmc-meta.gmc-warn{color:#fbbf24;margin-top:4px}
.gmcard-notmain{border-style:dashed}
.gmc-rr{margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gmc-rr-achieved{color:#43D693}.gmc-rr-missed{color:#EDB44E}.gmc-rr-match{color:#5AA0F0}
.gd-race{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:13px;line-height:1.45}
.gd-race-achieved{border-color:rgba(67,214,147,.45);background:rgba(67,214,147,.10)}.gd-race-missed{border-color:rgba(237,180,78,.45);background:rgba(237,180,78,.10)}.gd-race-match{border-color:rgba(90,160,240,.45);background:rgba(90,160,240,.10)}
.gd-race-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.gd-race-acts .btn{padding:8px 12px;font-size:13px;margin:0}
.gm-cacts{display:flex;flex-direction:column;gap:6px}
/* Inkrement 3: Wizard, Detail, Profilbereiche */
.gw-prog{display:flex;gap:6px;margin:6px 0 4px}
.gw-dot{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.gw-dot.on{background:var(--accent,#d8b777)}
.gw-dot.done{background:rgba(216,183,119,.55)}
.gw-steplabel{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.gw-nav{display:flex;gap:8px;margin-top:14px}
.gw-nav .btn{flex:1;margin-top:0}
.gw-ms{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.gw-ms span{flex:1;font-size:13.5px}
.gm-sum{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px}
.gm-sum p{margin:6px 0;font-size:13px}
.gm-field.gm-inline{display:flex;align-items:center;gap:8px;flex-direction:row}
/* Bugfix v8-179: .gm-field input{width:100%} traf auch Checkboxen in Inline-Zeilen
   („Verfügbar", „Als Ruhetag festlegen", „Doppeleinheit möglich") und drückte die
   Labels rechts aus dem Sheet. Checkbox fest, Label schrumpf-/umbruchfähig. */
.gm-field.gm-inline input[type="checkbox"]{width:22px;height:22px;min-width:22px;flex:0 0 auto;padding:0;accent-color:var(--accent)}
.gm-field.gm-inline label{margin:0;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.gm-field textarea{width:100%;background:#0c131d;border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px;font:inherit}
.av-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.av-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.av-row b{width:24px}
.av-cb{display:flex;align-items:center;gap:3px}
.ps-block{border-bottom:1px solid rgba(255,255,255,.08);padding:8px 0}
.ps-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.ps-list{margin:4px 0;padding-left:18px}
.ps-block p{margin:4px 0;font-size:14px}
/* Inkrement 4a: ORVIA-Segment-Control (Ersatz für native Selects) + responsive Härtung */
.seg-ctl{display:flex;flex-wrap:wrap;gap:7px;min-width:0}
.seg-b{flex:0 1 auto;min-width:0;padding:9px 13px;font-size:13px;font-weight:650;border:1px solid var(--border);background:#0c131d;color:#b8b4aa;border-radius:12px;cursor:pointer;-webkit-appearance:none;appearance:none}
.seg-b.on{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#0a0f17;border-color:transparent}
.seg-b:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,174,124,.18)}
.seg-group{flex:1 0 100%;width:100%;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);margin:8px 0 2px}
.seg-grouped{gap:6px}
/* Profil-Modals strikt innerhalb der iPhone-Breite halten, kein horizontaler Scroll */
.goal-modal,.orvia-modal{min-width:0;box-sizing:border-box;overflow-x:hidden}
.goal-modal *,.orvia-modal *{min-width:0;box-sizing:border-box}
.goal-modal .row2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:360px){.goal-modal .row2{grid-template-columns:minmax(0,1fr)}}
.av-row{min-width:0}
.av-row input[type=number]{max-width:72px;box-sizing:border-box}
/* Falls irgendwo doch ein natives <select> verbleibt: in ORVIA-Optik einbetten (kein weißes Element) */
.goal-modal select,.orvia-modal select{width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;padding:12px 13px;font-size:16px;border-radius:12px;border:1px solid var(--border);background:#0c131d;color:var(--text);font-weight:600}
/* Sticky Action-Bar in zentrierten Modals: explizites Bottom-Padding auch ohne Notch
   (env() allein ist auf Geräten ohne Safe-Area 0px → Button klebte an der Kante).
   Solider Sockel unter dem Button, Gradient nur als oberer Übergang. */
.gm-modal-actions{position:sticky;bottom:0;background:linear-gradient(to top,#0c131d 62%,rgba(12,19,29,0));padding-top:14px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.ob2-summary{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:13.5px;line-height:1.7;color:var(--text-muted)}
.ob2-fieldset{border:0;padding:0;margin:0 0 16px;min-width:0}
.ob2-fieldset>legend{padding:0;font-size:13px;font-weight:650;color:var(--text-muted);margin-bottom:6px}
.ob2-sublabel{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;font-size:12px;color:var(--text-faint);font-weight:600}
.ob2-sublabel input{width:100%}

/* ---- Sync-Badge ---- */
.syncbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:30px;
  border:1px solid var(--border);background:#0c131d;color:var(--text-muted)}
.syncbadge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.syncbadge.ok{color:var(--success);border-color:rgba(52,199,123,.3);background:rgba(52,199,123,.1)}
.syncbadge.warn{color:var(--warning);border-color:rgba(217,166,90,.3);background:rgba(217,166,90,.1)}
.syncbadge.err{color:var(--danger);border-color:rgba(229,85,106,.3);background:rgba(229,85,106,.1)}
.syncbadge.muted{color:var(--text-muted)}

/* ---- Konto-Karte ---- */
.acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.acc-row:last-of-type{border-bottom:none}
.acc-row span{color:var(--text-muted)}
.acc-row b{font-weight:700;text-align:right;word-break:break-all}

/* ---- Migrations-/System-Modal ---- */
/* Genau EIN Scroll-Owner pro Modal: .orvia-modal (max-height + overflow-y).
   Der Backdrop scrollt NICHT (verschachtelte Scrollbereiche waren die Ursache
   für doppelte Scrollzonen/enge Karten auf dem iPhone). */
.orvia-modal-bg{position:fixed;inset:0;z-index:650;display:flex;align-items:center;justify-content:center;
  padding:calc(20px + var(--sat)) 20px calc(20px + env(safe-area-inset-bottom));
  background:rgba(4,5,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:orviaFade .2s ease}
.orvia-modal{width:100%;max-width:380px;background:linear-gradient(160deg,#121a26,#0c131d);border:1px solid var(--border-strong);
  border-radius:22px;padding:24px 22px;text-align:center;box-shadow:var(--shadow-soft);animation:orviaPop .22s cubic-bezier(.34,1.4,.5,1);
  max-height:calc(100dvh - 40px - var(--sat) - env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;margin:auto}
/* Programmgesteuerter Dialog-Fokus (tabindex=-1) ohne Fokusring auf dem Container;
   Bedienelemente im Dialog behalten ihren sichtbaren Fokus. */
.orvia-modal[tabindex="-1"]{outline:none}
.orvia-modal .om-ic{width:46px;height:46px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--gold-soft, rgba(201,174,124,.16));color:var(--accent)}
.orvia-modal h3{margin:0 0 8px;font-size:18px;font-weight:800;color:var(--text)}
.orvia-modal p{font-size:13.5px;color:var(--text-muted);line-height:1.5;margin:0 0 16px}
.orvia-modal .om-note{font-size:11px;color:var(--text-faint);margin-top:14px;margin-bottom:0}
@keyframes orviaFade{from{opacity:0}to{opacity:1}}
@keyframes orviaPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* ============================================================
   ORVIA · Mobile Sheets & Action-Bar (Phase 4j.1)
   Genau EIN Scrollcontainer (.orvia-sheet-scroll); Header und Footer
   liegen außerhalb des Scrollbereichs. Safe-Areas, 100dvh, Desktop zentriert.
   ============================================================ */
body.sheet-open{overflow:hidden}
.orvia-sheet-backdrop{position:fixed;inset:0;z-index:640;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(4,6,11,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:orviaFade .18s ease}
.orvia-sheet{display:flex;flex-direction:column;width:100%;max-width:none;height:100dvh;max-height:100dvh;overflow:hidden;
  background:radial-gradient(1100px 760px at 50% -12%,#0c1422 0%,#0a111b 52%,#070c14 82%);border:none;border-radius:0;
  animation:orviaSheetUp .26s cubic-bezier(.32,.9,.3,1)}
/* Header: feste eigene Fläche, Safe-Area oben, kein Abschneiden des Titels */
.orvia-sheet-header{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:calc(var(--sat) + 16px) 18px 14px;border-bottom:1px solid var(--hairline)}
.orvia-sheet-title{flex:1;min-width:0;margin:0;font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.01em;
  line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.orvia-sheet-x{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#161d28;
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;appearance:none;position:relative}
/* Bugfix v8-179: 48px-Touch-Fläche ohne Optik-Änderung (iPhone-Tap-Sicherheit). */
.orvia-sheet-x::after{content:'';position:absolute;inset:-6px}
.orvia-sheet-x svg{width:18px;height:18px}
.orvia-sheet-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* DER einzige Scrollbereich */
.orvia-sheet-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:18px 18px 24px}
/* Action-Bar: eigener Footer AUSSERHALB des Scrollbereichs, kein inhaltüberdeckender Gradient */
.orvia-sheet-actions{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;background:#0a111b;
  border-top:1px solid var(--border);padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
.orvia-sheet-actions .btn{margin:0;width:100%}
.orvia-sheet-actions .gw-nav{display:flex;gap:10px;margin:0}
.orvia-sheet-actions .gw-nav .btn{flex:1}
/* Desktop: zentriertes Sheet mit sinnvollen Grenzen, weiterhin nur EIN Scrollcontainer */
@media (min-width:640px){
  .orvia-sheet-backdrop{align-items:center;padding:24px}
  .orvia-sheet{max-width:560px;height:auto;max-height:calc(100dvh - 48px);border-radius:22px;
    border:1px solid var(--border-strong);box-shadow:var(--shadow-soft)}
  .orvia-sheet--large{max-width:480px}
  .orvia-sheet-header{padding:18px 22px 14px}
  .orvia-sheet-scroll{padding:18px 22px 22px}
  .orvia-sheet-actions{flex-direction:row;justify-content:flex-end;padding:14px 22px 16px}
  .orvia-sheet-actions .btn{width:auto;min-width:132px}
  .orvia-sheet-actions .gw-nav{flex:1}
}
@keyframes orviaSheetUp{from{opacity:.4;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   ORVIA · Profil-Foto & Ziele-Editor (Onboarding)
   ============================================================ */
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ob-photo{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.ob-avatar{position:relative;width:120px;height:120px;border-radius:50%;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-dim));
  color:#0a0f17;font-size:44px;font-weight:800;border:1px solid var(--border)}
.ob-avatar img{width:100%;height:100%;object-fit:cover}
.ob-avatar .ob-cam{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:50%;
  background:#1a2230;color:var(--accent);border:1px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.ob-goallist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ob-goal{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0c131d;
  border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}
.ob-goal button{background:none;border:none;color:var(--text-faint);font-size:15px;cursor:pointer;padding:0 4px}
.ob-empty{color:var(--text-faint);font-size:13px;text-align:center;padding:10px 0}
.ob-goaladd{display:flex;gap:8px}
.ob-goaladd input{flex:1;padding:12px 14px;font-size:15px;border-radius:12px;border:1px solid var(--border);background:#0c131d;color:var(--text);font-weight:600}
.ob-goaladd input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,174,124,.18)}
.ob-add{flex:0 0 auto;width:48px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#0a0f17;font-size:22px;font-weight:800;cursor:pointer}

/* ============================================================
   ORVIA · Daily Command Center (Heute · Phase 2)
   ============================================================ */

/* ============================================================
   ORVIA · Top-Bar, Profil-Sheet, Empty-States (Phase 2 Navigation)
   ============================================================ */
.topbar{position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:12px;
  padding:calc(var(--sat) + 10px) 18px 10px;
  background:linear-gradient(180deg,rgba(7,12,20,.92),rgba(7,12,20,.70) 72%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
html.orvia-gated .topbar{display:none!important}
.tb-brand{display:flex;align-items:center}
.tb-brand .omark{width:44px;height:44px;display:block}
.tb-title{flex:1;text-align:center;font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-strong);
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#0a0f17;font-size:15px;font-weight:800;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:0 0 auto;padding:0}
.tb-avatar img{width:100%;height:100%;object-fit:cover}
.wrap{padding-top:16px}
/* Profil-Sheet (über Avatar) */
body.profile-open{overflow:hidden}
body.profile-open #tab-mehr{display:block;position:fixed;inset:0;z-index:140;overflow-y:auto;
  background:radial-gradient(1200px 820px at 50% -12%,#0b1320 0%,#091019 48%,#070C14 80%);
  padding:calc(var(--sat) + 22px) 16px calc(env(safe-area-inset-bottom) + 40px);animation:orviaFade .2s ease}
.sheet-x{position:fixed;top:calc(var(--sat) + 16px);right:16px;z-index:141;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--border);background:#161d28;color:var(--text);font-size:16px;cursor:pointer;
  display:none;align-items:center;justify-content:center}
body.profile-open .sheet-x{display:flex}
/* Empty-States */
.empty-card{background:linear-gradient(160deg,#111a26,#0c131d);border:1px solid var(--border);border-radius:22px;
  padding:34px 24px;text-align:center;margin-top:6px}
.empty-ic{width:34px;height:34px;color:var(--accent);opacity:.85;margin-bottom:6px}
.empty-h{font-size:17px;font-weight:800;color:var(--text);margin-bottom:8px}
.empty-p{font-size:13.5px;color:var(--text-muted);line-height:1.55;max-width:360px;margin:0 auto 16px}
.empty-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:rgba(201,174,124,.16);border:1px solid rgba(201,174,124,.3);border-radius:30px;padding:6px 14px}

/* ============================================================
   ORVIA · Zielplaner, Race-Header & Pace-Zonen (Phase 3)
   ============================================================ */
.racehead{background:linear-gradient(150deg,#12243a 0%,#0e1b2c 60%,#0a1422 100%);border:1px solid var(--border-strong);
  border-radius:24px;padding:20px 22px;margin-bottom:16px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.rh-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rh-name{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.rh-edit{background:rgba(201,174,124,.14);border:1px solid rgba(201,174,124,.3);color:var(--accent);
  font-size:12px;font-weight:700;padding:7px 13px;border-radius:30px;cursor:pointer;flex:0 0 auto}
.rh-date{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.rh-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0 12px}
.rh-cell{background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:14px;padding:12px 8px;text-align:center}
.rh-num{display:block;font-size:21px;font-weight:800;color:var(--accent-soft);font-variant-numeric:tabular-nums}
.rh-lab{display:block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);margin-top:3px}
.rh-phase{font-size:13px;color:var(--text-muted)}
.rh-phase b{color:var(--text)}
.pz{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--hairline);font-size:14px}
.pz:last-of-type{border-bottom:none}
.pz-k{color:var(--text-muted);font-weight:600}
.pz-v{font-weight:750;font-variant-numeric:tabular-nums;color:var(--text)}
.pz-v small{color:var(--text-faint);font-weight:600}
.pz-hero{background:rgba(201,174,124,.08);margin:0 -20px;padding:13px 20px;border-bottom:1px solid var(--hairline)}
.pz-hero .pz-k{color:var(--accent);font-weight:800}
.pz-hero .pz-v{color:var(--accent-soft);font-size:16px}
.goal-modal{text-align:left;max-width:400px}
.goal-modal h3{text-align:center;margin:0 0 16px;font-size:18px;font-weight:800;color:var(--text)}
.gm-field{margin-bottom:14px}
.gm-field>label{display:block;font-size:12.5px;font-weight:650;color:var(--text-muted);margin-bottom:7px}
.gm-field input{width:100%;padding:12px 13px;font-size:16px;border-radius:12px;border:1px solid var(--border);background:#0c131d;color:var(--text);font-weight:600}
.gm-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,174,124,.18)}
.gm-chips{display:flex;flex-wrap:wrap;gap:7px}
.gm-chip{padding:9px 13px;font-size:13px;font-weight:650;border:1px solid var(--border);background:#0c131d;color:#b8b4aa;border-radius:30px;cursor:pointer}
.gm-chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#0a0f17;border-color:transparent}

/* ============================================================
   ORVIA · Aktivität, Workout Card, Streckenkarte, Import (Phase 4)
   ============================================================ */
.actlist{display:flex;flex-direction:column}
.actrow{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;border-bottom:1px solid var(--hairline);padding:13px 0;cursor:pointer;text-align:left}
.actrow:last-child{border-bottom:none}
.actrow-ic{width:38px;height:38px;border-radius:12px;background:rgba(201,174,124,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.actrow-ic .ic{width:19px;height:19px;color:var(--accent)}
.actrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.actrow-t{font-size:14.5px;font-weight:750;color:var(--text)}
.actrow-route{font-size:10px;font-weight:700;color:var(--accent);background:rgba(201,174,124,.14);border-radius:20px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.actrow-sub{font-size:12px;color:var(--text-muted)}
.actrow-go{width:16px;height:16px;color:var(--text-faint);flex:0 0 auto}
.wcard-modal{max-width:420px;text-align:left}
.wcard{padding:2px}
.wc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wc-brand{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--text)}
.wc-brand .omark{width:20px;height:20px}
.wc-type{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-muted)}
.wc-type .ic{width:15px;height:15px;color:var(--accent)}
.wc-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.wc-day{font-size:12.5px;color:var(--text-muted);margin:2px 0 14px}
.wc-map{border-radius:16px;overflow:hidden;margin-bottom:16px;border:1px solid var(--border)}
.rmap{display:block;width:100%;height:auto}
.wc-nomap{font-size:12.5px;color:var(--text-faint);text-align:center;padding:18px;border:1px dashed var(--border);border-radius:14px;margin-bottom:16px}
.wc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.wc-stat{background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:13px;padding:11px 8px;text-align:center}
.wc-sv{display:block;font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.wc-sk{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);margin-top:2px}
.wc-rate{border-top:1px solid var(--hairline);padding-top:14px}
.wc-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:30px;padding:5px 12px;margin-bottom:9px}
.wc-g{color:var(--success);background:rgba(52,199,123,.12);border:1px solid rgba(52,199,123,.3)}
.wc-y{color:var(--warning);background:rgba(217,166,90,.12);border:1px solid rgba(217,166,90,.3)}
.wc-r{color:var(--danger);background:rgba(229,85,106,.12);border:1px solid rgba(229,85,106,.3)}
.wc-analysis{font-size:13.5px;color:var(--text);line-height:1.5;margin:0 0 8px}
.wc-next{font-size:13px;color:var(--text-muted);margin:0}
.import-bg{align-items:center}
.import-card{width:100%;max-width:360px;background:linear-gradient(160deg,#101a28,#0b1320);border:1px solid var(--border-strong);border-radius:24px;padding:30px 24px;text-align:center;box-shadow:var(--shadow-soft)}
.import-mark{width:54px;height:54px;animation:importPulse 1.4s ease-in-out infinite}
@keyframes importPulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
.import-title{font-size:16px;font-weight:800;color:var(--text);margin:14px 0 18px;letter-spacing:.01em}
.import-steps{text-align:left;display:flex;flex-direction:column;gap:11px}
.import-step{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--text-faint);transition:color .3s;opacity:.5}
.import-step .is-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--text-faint);flex:0 0 auto;transition:.3s}
.import-step.active{color:var(--text);opacity:1}
.import-step.active .is-dot{border-color:var(--accent);box-shadow:0 0 8px rgba(201,174,124,.6)}
.import-step.done{color:var(--text-muted);opacity:1}
.import-step.done .is-dot{background:var(--success);border-color:var(--success);box-shadow:none}

.wcard-modal{max-height:88vh;overflow-y:auto}

/* ============================================================
   ORVIA · Energie & Ernährung (Phase 5)
   ============================================================ */
.nut-day{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent);background:rgba(201,174,124,.14);border-radius:20px;padding:3px 10px}
.nut-kcal{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.nut-knum{font-size:38px;font-weight:800;letter-spacing:-.02em;color:var(--accent-soft);font-variant-numeric:tabular-nums}
.nut-klab{font-size:12.5px;color:var(--text-muted);font-weight:600}
.nut-macros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.nut-m{background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:14px;padding:12px 8px;text-align:center}
.nut-mg{display:block;font-size:18px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.nut-mg small{font-size:11px;font-weight:600;color:var(--text-muted)}
.nut-mk{display:block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);margin:3px 0 5px}
.nut-mc{display:block;font-size:10.5px;font-weight:700}
.nut-p{color:#7fb8ff}.nut-c{color:var(--accent)}.nut-f{color:var(--warning)}
.nut-warn{background:rgba(229,85,106,.1);border:1px solid rgba(229,85,106,.3);color:#ffb3bd;font-size:12.5px;line-height:1.5;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.nut-rec{font-size:13.5px;color:var(--text);line-height:1.5;background:rgba(255,255,255,.03);border-left:2px solid var(--accent);border-radius:8px;padding:11px 13px}
.nut-week{font-size:12.5px;color:var(--text-muted);margin-top:12px}
.nut-week b{color:var(--text)}
/* ---- Modul „Energie & Ernährung" (2026-08-05) — GM-Stil statt Legacy-Kacheln ---- */
.gm-hidden-host{display:none!important}
.nu-hero{margin:2px 0 12px}
.nu-hero b{display:block;font-size:27px;font-weight:820;line-height:1.05;color:var(--text);font-variant-numeric:tabular-nums}
.nu-hero span{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.nu-stack{display:flex;height:9px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.06)}
.nu-stack i{display:block;height:100%}
.nu-stack .nu-p,.nu-legend .nu-p{background:#7fb8ff}
.nu-stack .nu-c,.nu-legend .nu-c{background:var(--accent)}
.nu-stack .nu-f,.nu-legend .nu-f{background:var(--warning)}
.nu-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.nu-legend span{display:flex;align-items:center;gap:6px}
.nu-legend i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.nu-legend b{color:var(--text);font-weight:750}
.nu-legend-lg{font-size:13px;gap:8px 18px}
.nu-foot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--hairline);font-size:12px;color:var(--muted)}
.nu-foot b{color:var(--text);font-size:13.5px;font-weight:750}
.nu-bars{display:flex;align-items:flex-end;gap:4px;height:96px}
.nb-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.nb-track{flex:1;width:100%;display:flex;align-items:flex-end;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden}
.nb-track i{display:block;width:100%;background:rgba(255,255,255,.22);border-radius:4px 4px 0 0}
.nb-track i.hit{background:var(--ready)}
.nb-col small{font-size:9px;color:var(--faint);font-weight:600}
/* Bugfix (2026-08-05, Nutzer-Feedback): Protein-Adhaerenz und Gewichtstrend als zwei
   getrennte Haelften statt einer durchlaufenden Zeile. */
.nut-week-split{display:grid;grid-template-columns:1fr 1fr;margin-top:12px}
.nut-week-split .nut-week-half{padding:0 12px}
.nut-week-split .nut-week-half:first-child{padding-left:0;border-right:1px solid var(--hairline)}
.nut-week-split .nut-week-half:last-child{padding-right:0}
.nut-week-half span{display:block;font-size:11px;color:var(--text-muted)}
.nut-week-half b{display:block;margin-top:3px;font-size:13.5px;color:var(--text);font-weight:700}

/* ============================================================
   ORVIA · Insights "Diese Woche erkannt" (Phase 6)
   ============================================================ */
.insights-card .ins{padding:15px 0;border-bottom:1px solid var(--hairline)}
.insights-card .ins:first-of-type{padding-top:4px}
.insights-card .ins:last-child{border-bottom:none;padding-bottom:0}
.ins-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.ins-area{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ins-stmt{font-size:15.5px;font-weight:800;color:var(--text);line-height:1.25;letter-spacing:-.01em;margin-bottom:6px}
.ins-reason{font-size:13px;color:var(--text-muted);line-height:1.45;margin-bottom:4px}
.ins-impact{font-size:13px;color:var(--text-muted);line-height:1.45;margin-bottom:8px}
.ins-rec{font-size:13.5px;color:var(--text);line-height:1.45;background:rgba(255,255,255,.03);border-left:2px solid var(--accent);border-radius:8px;padding:9px 12px;font-weight:600}

/* ============================================================
   ORVIA · Race Mode (Phase 7)
   ============================================================ */
.racemode{border:1px solid rgba(201,174,124,.3)}
.racemode.raceday{background:linear-gradient(160deg,#1a1408,#0e1320);border-color:rgba(201,174,124,.5)}
.rm-head{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
.rm-list{margin:0;padding-left:0;list-style:none}
.rm-list li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--text-muted);margin-bottom:7px}
.rm-list li:last-child{margin-bottom:0}
.rm-list li::before{content:"";position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rm-today{border-left:3px solid var(--accent)}
.rm-t-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rm-t-win{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.rm-t-d{font-size:13px;font-weight:800;color:var(--accent-soft);font-variant-numeric:tabular-nums}
.rm-t-tip{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:8px}

/* ============================================================
   ORVIA · Anklickbare Wochenplan-Einheiten (Gruppe B)
   ============================================================ */
.pchev{margin-left:auto;color:var(--text-faint);font-size:16px;font-weight:600;flex:0 0 auto}
.unit-goal{font-size:13.5px;color:var(--text-muted);line-height:1.5;margin-bottom:14px}
.unit-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.unit-stat{background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:12px;padding:10px 6px;text-align:center}
.us-k{display:block;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);margin-bottom:3px}
.us-v{display:block;font-size:12.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.unit-steps{display:flex;flex-direction:column;margin-bottom:14px}
.ustep{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);font-size:13.5px;color:var(--text);line-height:1.45}
.ustep:last-child{border-bottom:none}
.ust-l{flex:0 0 78px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);padding-top:2px}
.unit-rec{font-size:13.5px;color:var(--text);line-height:1.5;background:rgba(201,174,124,.08);border:1px solid rgba(201,174,124,.25);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.unit-rec b{color:var(--accent)}
.unit-alt{font-size:13px;color:var(--text-muted);line-height:1.45}
.unit-alt b{color:var(--text)}

/* ============================================================
   ORVIA · Supplement-Stack-Heading (Gruppe F)
   ============================================================ */
.supphd{font-size:12.5px;font-weight:700;color:var(--text);margin:6px 0 10px}
.supphd span{font-weight:500;color:var(--text-faint);font-size:11px}

/* ============================================================
   ORVIA · Quickfixes (Avatar antippbar, Datum-Input)
   ============================================================ */
.gm-field input[type=date],.gm-field input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;box-sizing:border-box;text-align:left}
.avatar{cursor:pointer;position:relative}
.avatar::after{content:"\270E";position:absolute;right:-1px;bottom:-1px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#0a0f17;font-size:11px;line-height:22px;text-align:center;border:2px solid var(--card,#0d131d)}

/* ============================================================
   ORVIA · Bestzeiten + Equipment-Verschleiß
   ============================================================ */
.bt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bt{background:var(--card-2,#0f1620);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center}
.bt-d{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bt-t{display:block;font-size:20px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.eq{padding:11px 0;border-bottom:1px solid var(--border)}
.eq:last-of-type{border-bottom:0}
.eq-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.eq-n{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;flex:1;min-width:0}
.eq-n .ic{width:16px;height:16px;opacity:.85;flex:none}
.eq-km{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.eq-x{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 6px;line-height:1}
.eqbar{display:block;height:100%;border-radius:inherit}
.eqbar-g{background:#34d399}
.eqbar-y{background:#fbbf24}
.eqbar-r{background:#f87171}

/* ============================================================
   ORVIA · Story-Recap (Vollbild) + Splits + Bestzeiten-Quelle
   ============================================================ */
.bt-src{display:block;font-size:9px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.bt-real{color:#34d399}
.bt-est{color:var(--muted)}
/* 2026-08-05: dritte Herkunftsstufe — Abschnitt aus laengerer Einheit mit abgeleiteter
   Zeitachse. Bewusst weder gruen (volle Messung) noch grau (Schaetzung). */
.bt-derived{color:var(--gold-soft,#dcc79a)}
/* Splits in der Workout-Card */
.wc-splits{margin-top:14px}
.wc-splits-h{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.wcsp{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.wcsp-k{width:16px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.wcsp-bar-wrap{flex:1;background:rgba(255,255,255,.06);border-radius:5px;height:9px;overflow:hidden}
.wcsp-bar{height:100%;border-radius:5px;background:rgba(201,174,124,.55)}
.wcsp-bar.best{background:var(--accent,#c9ae7c)}
.wcsp-p{width:42px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
/* Story-Overlay */
body.story-open{overflow:hidden}
.story-bg{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 80% at 50% 0,#10161f 0,#070b11 60%);display:flex;justify-content:center;animation:stfade .25s ease}
@keyframes stfade{from{opacity:0}to{opacity:1}}
.story-shell{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:calc(var(--sat) + 14px) 20px calc(env(safe-area-inset-bottom) + 22px)}
.st-prog{display:flex;gap:5px;margin-bottom:14px;z-index:4}
.st-pseg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.st-pseg i{display:block;height:100%;width:0;background:var(--accent,#c9ae7c);border-radius:2px}
.st-pseg.done i{width:100%}
.st-pseg.active i{width:100%;transition:width .35s ease}
.st-close{position:absolute;top:calc(var(--sat) + 26px);right:20px;z-index:6;background:rgba(255,255,255,.1);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer}
.st-body{flex:1;display:flex;flex-direction:column;justify-content:center;z-index:3;overflow-y:auto;-webkit-overflow-scrolling:touch}
.st-tap{position:absolute;top:64px;bottom:0;background:transparent;border:0;cursor:pointer;z-index:2}
.st-tap-l{left:0;width:35%}
.st-tap-r{right:0;width:65%}
.st-card{text-align:center;animation:stslide .4s ease}
@keyframes stslide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.st-kicker{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent,#c9ae7c);font-weight:700;margin-bottom:14px}
.st-kicker .omark{width:16px;height:16px}
.st-h1{font-size:30px;font-weight:800;line-height:1.1;color:#fff;margin-bottom:6px}
.st-sub{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:16px}
.st-map{width:100%;max-width:340px;height:auto;margin:0 auto;display:block}
.st-route{stroke-dasharray:1000;stroke-dashoffset:1000;animation:stdraw 2.4s ease-out forwards;filter:drop-shadow(0 0 6px rgba(201,174,124,.5))}
@keyframes stdraw{to{stroke-dashoffset:0}}
.st-stats3{display:flex;justify-content:center;gap:26px;margin-top:18px}
.st-stats3 b{display:block;font-size:24px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.st-stats3 span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.st-ctitle{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent,#c9ae7c);font-weight:700;margin-bottom:20px}
.st-splits{display:flex;flex-direction:column;gap:10px;text-align:left}
.st-split{display:flex;align-items:center;gap:12px}
.st-km{width:18px;font-size:14px;font-weight:700;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.st-bar-wrap{flex:1;height:26px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden}
.st-bar{height:100%;border-radius:8px;background:rgba(201,174,124,.4);transform-origin:left;animation:stbar .7s ease forwards}
.st-bar.best{background:linear-gradient(90deg,var(--accent,#c9ae7c),#e6cfa0)}
@keyframes stbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.st-pace{width:48px;font-size:15px;font-weight:800;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.st-chart{width:100%;height:auto;display:block}
.st-line{stroke-dasharray:1400;stroke-dashoffset:1400;animation:stdraw 1.8s ease-out forwards}
.st-axis{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:rgba(255,255,255,.45)}
.st-axis span:nth-child(2){color:var(--accent,#c9ae7c);font-weight:700}
.st-cap{margin-top:18px;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.7);text-align:left}
.st-hrnote{margin-top:24px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;text-align:left}
.st-hrnote-h{font-weight:700;color:#fff;margin-bottom:6px}
.st-hrnote p{margin:0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.65)}
.st-best{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.st-bchip{background:rgba(201,174,124,.12);border:1px solid rgba(201,174,124,.3);border-radius:14px;padding:12px 16px}
.st-bchip b{display:block;font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.st-bchip span{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.st-verdict{font-size:26px;font-weight:800;color:#fff;margin-bottom:12px}
.st-vp{font-size:14px;line-height:1.55;color:rgba(255,255,255,.7);max-width:340px;margin:0 auto}
.st-note{color:rgba(255,255,255,.5);font-size:13px}

/* ============================================================
   ORVIA · Wochenplan-Navigation + Gym-Übungsauswahl
   ============================================================ */
.pweek-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pwk-arw{width:40px;height:40px;border-radius:12px;background:var(--card-2,#0f1620);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;flex:none}
.pwk-arw:disabled{opacity:.3;cursor:default}
.pwk-mid{flex:1;text-align:center}
.pwk-w{display:block;font-weight:800;font-size:15px}
.pwk-r{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pwk-today{width:100%;margin-bottom:14px;background:none;border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--accent,#c9ae7c);font-weight:700;cursor:pointer}
.gym-ex-btn{width:100%}
.gx-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gx-chip,.wc-exc{display:inline-block;background:rgba(201,174,124,.12);border:1px solid rgba(201,174,124,.3);color:var(--text);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.gym-pick{max-height:84vh;display:flex;flex-direction:column}
.gx-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:6px 0 14px;flex:1}
.gxg{margin-bottom:14px}
.gxg-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#c9ae7c);font-weight:700;margin-bottom:8px}
.gx{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card-2,#0f1620);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer;color:var(--text);gap:10px}
.gx.on{border-color:var(--accent,#c9ae7c);background:rgba(201,174,124,.12)}
.gx-n{font-weight:700;font-size:14px}
.gx-m{font-size:11px;color:var(--muted);text-align:right}
.gx.on .gx-n::after{content:" ✓";color:var(--accent,#c9ae7c)}
.wc-ex{margin-top:14px}
.wc-ex-h{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.wc-ex-chips{display:flex;flex-wrap:wrap;gap:6px}
.st-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);text-align:center;font-size:11px;color:rgba(255,255,255,.35);z-index:4;pointer-events:none}

/* ============================================================
   ORVIA · Gym-Ausbau: Übungs-Zeilen (Sätze/Wdh/kg) + Custom
   ============================================================ */
.gym-ex-rows{margin-top:10px}
.gymrow{background:var(--card-2,#0f1620);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.gymrow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gymrow-n{font-weight:700;font-size:14px}
.gymrow-x{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 6px;line-height:1}
.gymrow-in{display:flex;gap:8px}
.gymrow-in label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.gymrow-in input{width:100%;box-sizing:border-box;background:var(--bg,#0b121d);border:1px solid var(--border);border-radius:10px;padding:9px;color:var(--text);font-size:15px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.gymrow-prog{margin-top:8px;font-size:11.5px;color:var(--accent,#c9ae7c)}
.gymrow-new{color:var(--muted)}
.gx-add{display:flex;gap:8px;margin-bottom:12px}
.gx-add input{flex:1;box-sizing:border-box;background:var(--card-2,#0f1620);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-size:14px}
.gx-add .btn{width:48px;flex:none;padding:10px}
.wc-exrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.wc-exrow:last-child{border-bottom:0}
.wc-exrow-n{font-weight:600;font-size:14px}
.wc-exrow-d{font-size:13px;color:var(--accent,#c9ae7c);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ============================================================
   ORVIA · Bestzeit-Feier (PB-Celebration)
   ============================================================ */
.pb-bg{position:fixed;inset:0;z-index:300;background:rgba(7,11,17,.88);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:stfade .2s ease}
.pb-card{position:relative;z-index:2;text-align:center;max-width:380px;width:86%;animation:pbpop .55s cubic-bezier(.2,1.35,.4,1)}
@keyframes pbpop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.pb-burst{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle,rgba(201,174,124,.4),transparent 70%);display:flex;align-items:center;justify-content:center;animation:pbglow 1.6s ease-in-out infinite}
.pb-burst .ic{width:54px;height:54px;color:var(--accent,#c9ae7c);filter:drop-shadow(0 0 14px rgba(201,174,124,.8))}
@keyframes pbglow{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.pb-boom{font-size:13px;letter-spacing:.42em;font-weight:800;color:var(--accent,#c9ae7c);margin-bottom:4px}
.pb-h{font-size:30px;font-weight:800;color:#fff;margin-bottom:18px;line-height:1.1}
.pb-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.pb-row{background:rgba(201,174,124,.12);border:1px solid rgba(201,174,124,.32);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.pb-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.pb-v{font-size:24px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.pb-prev{font-size:11px;color:rgba(255,255,255,.45)}
.pb-btn{width:100%}
.pb-conf-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.pb-conf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:.92;animation:pbfall 2.6s linear forwards}
@keyframes pbfall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(106vh) rotate(560deg);opacity:.5}}
@media (prefers-reduced-motion:reduce){.pb-conf{display:none}.pb-burst{animation:none}}

/* ============================================================
   ORVIA · Equipment-Upgrades (Zähler, Inspektions-Warnung)
   ============================================================ */
.eq-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.eq-pct{font-size:12px;color:var(--muted)}
.eq-counter{font-size:18px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.eq-warn{margin-top:9px;font-size:12px;font-weight:600;border-radius:9px;padding:8px 11px}
.eq-warn-y{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.32)}
.eq-warn-r{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.32)}

/* ============================================================
   ORVIA · Plan-Editor + Pause-Modus + Sprunggelenk-Toggle
   ============================================================ */
.plan-tools{display:flex;gap:8px;margin-bottom:12px}
.plan-tools .btn{flex:1;margin:0}
.pause-banner{display:flex;gap:10px;align-items:flex-start;background:rgba(124,160,201,.12);border:1px solid rgba(124,160,201,.3);border-radius:14px;padding:13px 15px;margin-bottom:14px}
.pause-banner b{display:block;font-size:14px;color:var(--text)}
.pause-banner span{font-size:12.5px;color:var(--muted);line-height:1.45}
.pause-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pause-item{display:flex;justify-content:space-between;align-items:center;background:var(--card-2,#0f1620);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px}
.pause-item button{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 6px}
.pday.paused{opacity:.55}
.pd-pause{display:inline-block;background:rgba(124,160,201,.18);color:#9bbbe0;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:.03em;margin-left:4px;text-transform:uppercase}
.plan-edit{max-height:84vh;display:flex;flex-direction:column}
.pe-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:6px 0 14px;flex:1}
.pe-day{border-bottom:1px solid var(--border);padding:11px 0}
.pe-day:last-child{border-bottom:0}
.pe-dh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#c9ae7c);font-weight:700;margin-bottom:7px}
.pe-items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:4px}
.pe-empty{font-size:12px;color:var(--muted)}
.pe-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(201,174,124,.12);border:1px solid rgba(201,174,124,.3);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:600}
.pe-chip button{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;line-height:1;padding:0 2px}
.pe-add{display:flex;gap:8px}
.pe-sel{flex:1;background:var(--card-2,#0f1620);border:1px solid var(--border);border-radius:10px;padding:9px;color:var(--text);font-size:13px}
.pe-add .btn{width:48px;flex:none;padding:9px;margin:0}

/* ============================================================
   ORVIA · Kraftplanung im Wochenplan (v8-323, K2)
   Zwei Orte: die Uebungsliste AUF der Wochenplan-Karte (.sc-plex) und der
   Uebungs-Editor im Wochenplan-Editor (.pe-expanel).
   Grundsatz: eine nicht aufloesbare Uebungskennung wird sichtbar markiert,
   nicht schoengefaerbt — deshalb eine eigene, ruhige Warnfarbe statt Rot.
   ============================================================ */
.sc-plex{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.sc-plex li{font-size:12px;line-height:1.45;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-plex li::before{content:'·';margin-right:6px;opacity:.55}
.sc-plex li.sc-plex-unknown{color:var(--warn,#d8a657)}
.sc-plex li.sc-plex-unknown::before{content:''}

/* v8-332b · Die Ausdauer-Vorgabe auf der Karte (.sc-rx).
   Sie darf mehrzeilig umbrechen — "5 × (Belastung 4 min @ 4:36–4:54 min/km ·
   Pause 3 min)" abzuschneiden waere schlimmer als eine zweite Zeile: dann
   fehlte genau die Zahl, wegen der die Zeile ueberhaupt dasteht.
   Aufwaermen und Auslaufen treten zurueck, verschwinden aber nicht — sonst
   fehlte dem Nutzer die halbe Einheit. */
.sc-plex.sc-rx li{white-space:normal;overflow:visible;text-overflow:clip}
.sc-plex.sc-rx li.sc-rx-soft{opacity:.62}

/* v8-349 · Was die Quelle sagt, aber nicht als Zahl (.sc-rx-hint).
   BEWUSST OPTISCH GETRENNT von der Verordnung darueber: das eine ist eine
   Vorgabe („4 × 1 km @ 4:36"), das andere eine Einordnung („aus isolierten
   Krafttests laesst sich die Laufleistung nicht vorhersagen"). Saehen beide
   gleich aus, laese der Nutzer den Hinweis als Anweisung — und genau das
   darf er nicht, denn ein Hinweis aendert keine Zahl.
   Die Herkunft steht IMMER daneben, nie ausgeblendet: eine Aussage ohne
   Quelle ist in ORVIA keine Aussage. */
.sc-plex.sc-rx-hint{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.sc-plex.sc-rx-hint li{white-space:normal;overflow:visible;text-overflow:clip;
  display:block;opacity:.86;margin-top:5px}
.sc-plex.sc-rx-hint li::before{content:'ℹ';opacity:.55;margin-right:6px}
.sc-rx-hint .sc-hint-text{display:inline}
.sc-rx-hint .sc-hint-src{display:block;font-size:10px;opacity:.6;margin-left:18px;letter-spacing:.02em}
.sc-rx-hint .sc-hint-note{display:block;font-size:10px;opacity:.72;margin-left:18px}
/* v8-353 · „10 weitere belegte Hinweise" — die Zeile, die das Kuerzen sichtbar
   macht. Bewusst gedaempft, aber vorhanden: eine Karte, die schweigend kuerzt,
   behauptet Vollstaendigkeit, die sie nicht hat. */
.sc-plex.sc-rx-hint li.sc-hint-more{font-size:10px;opacity:.55;font-style:italic}
.sc-plex.sc-rx-hint li.sc-hint-more::before{content:'…'}

/* v8-352 · Die Herkunft des Zielkorridors (.md-corr-src) und die Abgrenzung
   zur Quellenzahl (.md-corr-cmp).
   BEWUSST NICHT versteckt und nicht ausklappbar: dass dieser Bereich ein
   ORVIA-Richtwert ohne Quelle ist, gehoert zur Zahl selbst — nicht ins
   Kleingedruckte. Die Quellenzahl daneben traegt eine andere Bezugsgroesse
   (je Einheit statt je Woche) und wird deshalb abgesetzt dargestellt, damit
   niemand sie fuer denselben Wert haelt. */
.md-corr-src{display:block;font-size:10px;opacity:.62;margin-top:2px;letter-spacing:.02em}
.md-corr-cmp{margin-top:8px;padding-top:7px;border-top:1px dashed var(--border);
  font-size:11px;line-height:1.45}
.md-corr-cmp .muted{opacity:.72}

.wo-sg-v{font-weight:700;flex:1}
.wo-sg-a{font-size:11.5px;color:#94a3b8}
.wo-plate-big{font-size:20px;font-weight:800;margin-bottom:2px}

.rh-feas{font-size:12.5px;color:#94a3b8;margin-top:6px;line-height:1.4}

/* S1/E2: Wettkampfergebnis im Plan-Kopf */
.rh-race{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:13px;line-height:1.4}

.rh-race-acts .btn{padding:8px 12px;font-size:13px;margin:0}
.rh-race-achieved{border-color:rgba(67,214,147,.45);background:rgba(67,214,147,.10)}
.rh-race-missed{border-color:rgba(237,180,78,.45);background:rgba(237,180,78,.10)}
.rh-race-match{border-color:rgba(90,160,240,.45);background:rgba(90,160,240,.10)}
.pl-adapt.pl-race{background:rgba(52,211,153,.18);color:#34d399}
.pc-strength{margin:10px 0 4px;padding:12px 14px;border-radius:14px;background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.14)}

.pc-strength-score{font-size:26px;font-weight:800;line-height:1}
.pc-strength-lab{font-size:13px;color:#94a3b8;font-weight:700}
.pc-strength-stark .pc-strength-score{color:#34d399}.pc-strength-solide .pc-strength-score{color:#60a5fa}.pc-strength-lueckenhaft .pc-strength-score{color:#fbbf24}.pc-strength-schwach .pc-strength-score{color:#fb7185}

.pc-gap-t{font-size:13.5px;font-weight:700}.pc-gap-h{font-size:12px;color:#94a3b8}
.pc-strength-ok{font-size:12.5px;color:#94a3b8;margin-top:6px}
.ob3-pb{margin:6px 0 4px;padding:12px;border-radius:14px;border:1px dashed rgba(148,163,184,.25)}
.ob3-pb .ob2-chips{margin:6px 0 10px}
.rh-name-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.01em}
/* B-02 Ziel-Detailseite */
.gd{display:flex;flex-direction:column;gap:14px}
.gd-title{font-size:20px;font-weight:800}.gd-cat{font-size:13px;color:#94a3b8;margin-top:2px}
.gd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.gd-cell{background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.14);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.gd-k{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;font-weight:700}.gd-v{font-size:16px;font-weight:800}
.gd-sec{display:flex;flex-direction:column;gap:6px}.gd-h{font-size:12px;font-weight:800;color:#cbd5e1;text-transform:uppercase;letter-spacing:.04em}
.gd-bar{height:8px;border-radius:6px;background:rgba(148,163,184,.14);overflow:hidden}.gd-bar-fill{height:100%;background:#60a5fa;border-radius:6px}
.gd-bar-fill.gd-ontrack{background:#34d399}.gd-bar-fill.gd-border{background:#fbbf24}.gd-bar-fill.gd-risk{background:#fb7185}
.gd-bar-lab{font-size:12.5px;font-weight:700;color:#cbd5e1}.gd-note{font-size:13px;color:#94a3b8;line-height:1.45;margin:0}.gd-note.gd-warn{color:#fbbf24}
.gd-ms{font-size:13.5px;padding:6px 0;border-bottom:1px solid rgba(148,163,184,.12)}
.wo-input{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.wo-inrow{display:flex;gap:8px}
.wo-inrow label{flex:1;display:flex;flex-direction:column;font-size:11px;color:#94a3b8;gap:3px}
.wo-inrow input,.wo-inrow select{background:#0f172a;border:1px solid rgba(148,163,184,.25);border-radius:9px;padding:11px;color:#e2e8f0;font-size:16px}
.wo-savebtn{margin-top:2px}
.wo-timer{display:flex;align-items:center;gap:10px;font-size:14px}
.wo-empty{text-align:center;padding:30px 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.wo-foot{position:fixed;left:0;right:0;bottom:0;z-index:9001;display:flex;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:rgba(11,18,32,.96);backdrop-filter:blur(6px);border-top:1px solid rgba(148,163,184,.16);max-width:680px;margin:0 auto}
.wo-fbtn{flex:1;background:#1e293b;color:#e2e8f0;border:0;border-radius:11px;padding:13px 6px;font-weight:700;font-size:14px}
.wo-fbtn.primary{background:#16a34a}
.wo-pick{max-width:680px;margin:0 auto;display:flex;flex-direction:column;height:100%;overflow:hidden}
/* Sticky-Header mit Safe-Area: Zurück-Button immer unter Statusleiste/Dynamic Island, ≥44px */
.wo-pick-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat) + 12px) 14px 10px;background:var(--bg,#0b1220)}
.wo-pick-back{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:#1e293b;color:#e2e8f0;cursor:pointer}
.wo-pick-back svg{width:22px;height:22px}
.wo-pick-title{font-size:18px;font-weight:800}
.wo-pick-search{padding:2px 14px 8px;background:var(--bg,#0b1220);position:sticky;top:calc(var(--sat) + 56px);z-index:2}
.wo-pick-search input{width:100%;background:#0f172a;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:13px;color:#e2e8f0;font-size:16px}

.wo-fchip.on{background:rgba(201,174,124,.16);border-color:rgba(201,174,124,.4);color:var(--accent-soft,#dcc79a)}
