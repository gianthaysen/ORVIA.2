/* GM7.5i: mtile-Innenaufbau der Kennzahlenbibliothek — GM-verbatim (Prototyp Z.1091-1097) */
.mt-h{display:flex;align-items:center;gap:8px}
.mt-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mt-l{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-v{font-size:21px;font-weight:800;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}.mt-v small{font-size:11px;color:var(--muted);font-weight:700;margin-left:3px}
.mt-tv{font-size:15px;font-weight:800;margin-top:11px}
.mt-d{font-size:10.5px;font-weight:750;margin-top:3px}
.mt-spark{margin-top:7px;height:26px}.mt-spark .spark{height:26px}
/* Kollisionsschutz: die Muskelliste (GM4 Koerper) definiert .mtile spaeter als Flex-Zeile —
   innerhalb der Bibliotheks-.ana-grid gilt weiterhin das GM-Kachel-Layout. */
.ana-grid .mtile{display:block;align-items:initial;gap:0;border-radius:16px;width:auto}

/* ---- Tagebuch ---- */
.tb-head{display:flex;align-items:flex-start;justify-content:space-between;padding:4px 18px 4px}
.tb-head h1{font-size:30px;font-weight:840;letter-spacing:-.02em;line-height:1.05}
.tb-strip{display:flex;gap:7px;padding:6px 18px 4px;overflow-x:auto;scrollbar-width:none}
.tb-strip::-webkit-scrollbar{display:none}
.tb-day{flex:0 0 auto;width:46px;height:66px;border-radius:16px;background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid rgba(255,255,255,.06);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;font-family:var(--font);transition:transform .18s,border-color .2s,background .2s}
.tb-day .wd{font-size:10px;font-weight:750;letter-spacing:.04em;opacity:.8}
.tb-day .dn{font-size:17px;font-weight:820;color:var(--text)}
.tb-day .mk{position:absolute;top:5px;right:5px;color:var(--ready);display:flex}
.tb-day .mk .ic{width:12px;height:12px;stroke-width:3}
.tb-day.done{border-color:rgba(67,214,147,.25)}
.tb-day.on{background:var(--gold-grad);border-color:transparent;transform:translateY(-2px);box-shadow:0 10px 24px rgba(201,174,124,.28)}
.tb-day.on .wd,.tb-day.on .dn{color:#12161F}
.tb-day.on .mk{color:#1c6b45}
.tb-ins{display:flex;gap:12px;align-items:flex-start;margin:12px 18px 2px;padding:15px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(201,174,124,.16),rgba(149,133,237,.10) 60%,rgba(90,160,240,.10));border:1px solid rgba(255,255,255,.10)}
.tb-ins-ic{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(201,174,124,.2);color:var(--gold-soft)}
.tb-ins-ic .ic{width:20px;height:20px}
.tb-ins-t{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:3px}
.tb-ins-b{font-size:13px;line-height:1.5;color:var(--text)}
.tb-ins-b b{color:var(--gold-soft);font-weight:800}
.tb-note{padding:14px 15px}
.tb-note textarea{width:100%;min-height:88px;resize:vertical;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-family:var(--font);font-size:13.5px;line-height:1.55;padding:12px 13px;outline:none;transition:border-color .2s}
.tb-note textarea::placeholder{color:var(--faint)}
.tb-note textarea:focus{border-color:var(--gold-dark)}
.tb-note-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.tb-copy{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--gold-soft);font-family:var(--font);font-size:12px;font-weight:750;padding:8px 12px;border-radius:var(--r-pill);cursor:pointer}
.tb-copy .ic{width:13px;height:13px}
.tb-count{font-size:11px;color:var(--faint);font-weight:700}
.tb-tags{display:flex;flex-direction:column;gap:9px;padding:2px 18px}
.tb-tag{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px;border-radius:16px;background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid rgba(255,255,255,.06);cursor:pointer;font-family:var(--font);transition:border-color .2s,transform .12s,background .2s}
.tb-tag:active{transform:scale(.99)}
.tb-tag.on{border-color:color-mix(in srgb,var(--acc) 42%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 12%,var(--card-1)),var(--card-2))}
.tb-tag-ic{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tb-tag-ic .ic{width:19px;height:19px}
.tb-tag-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tb-tag-l{font-size:14px;font-weight:780;color:var(--text)}
.tb-tag-v{font-size:11.5px;color:var(--muted);font-weight:600}
.tb-tag-meta{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tb-auto{font-size:9px;font-weight:820;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--surface-2);border:1px solid var(--border);padding:3px 6px;border-radius:6px}
.tb-check{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);color:var(--faint)}
.tb-check .ic{width:14px;height:14px;stroke-width:2.6}
.tb-tag.on .tb-check{background:var(--acc);border-color:transparent;color:#0c1017}
.tb-hint{display:flex;gap:8px;align-items:flex-start;margin:12px 18px 0;font-size:11.5px;line-height:1.5;color:var(--muted)}
.tb-hint .ic{flex:0 0 auto;width:14px;height:14px;margin-top:1px;color:var(--faint)}
.tb-hint b{color:var(--text);font-weight:750}

/* ===== ORVIA COMPLETE PROTOTYPE · v5 ===== */
[data-theme="light"]{
  --bg:#eef4fb;--bg-rgb:238,244,251;--card-1:#ffffff;--card-2:#f5f8fc;--surface:rgba(13,31,53,.055);--surface-2:rgba(13,31,53,.09);
  --border:rgba(13,31,53,.10);--border-strong:rgba(13,31,53,.17);--hair:rgba(13,31,53,.08);
  --text:#102033;--muted:#526276;--faint:#78879a;--shadow:0 14px 34px rgba(34,63,91,.12)
}
[data-theme="light"] body{background:radial-gradient(900px 500px at 50% -5%,#d9e9fa,#edf3f9 60%,#e8eff7)}
[data-theme="light"] .screen{background:radial-gradient(760px 620px at 50% -12%,#dbeeff 0%,#eaf3fb 46%,#eef4fb 76%)}
[data-theme="light"] .tabwrap{background:rgba(248,252,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 36px rgba(35,62,90,.2)}
[data-theme="light"] .route-map{filter:saturate(.8) brightness(1.25)}
.hero:after{content:"";position:absolute;inset:auto -15% -60% 35%;height:75%;background:radial-gradient(ellipse,rgba(75,157,243,.18),transparent 70%);pointer-events:none}

/* ===== Hero: nahtlose Farbverläufe, theme-fest ===== */
.hero{color:#EAF1F8}
.hero .lead,.hero .ring-c .big{color:#F5F9FC}
.hero .why,.hero .ring-c .u{color:rgba(226,236,245,.74)}
.hero .batt{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10)}
.hero .batt-head .t{color:#EAF1F8}
.hero .batt-head .v{color:#F5F9FC}
.hero .batt-head .v small,.hero .batt-sub{color:rgba(226,236,245,.64)}
/* Status-Chip: grün, der in Blau übergeht */
.statuspill.sp-ready{background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),linear-gradient(115deg,rgba(67,214,147,.42),rgba(65,151,245,.24))!important;color:#93f0c0!important;border:none}
.statuspill.sp-attention{background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),linear-gradient(115deg,rgba(237,180,78,.42),rgba(65,151,245,.22))!important;color:#f4cf86!important;border:none}
.statuspill.sp-crit{background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),linear-gradient(115deg,rgba(240,99,122,.42),rgba(120,120,240,.22))!important;color:#f79bad!important;border:none}
/* Empfehlung: fließt als Band in den Hero statt eigener Kasten */
.reco.flow.ready{--rcA:rgba(67,214,147,.24);--rcB:rgba(67,214,147,.06);--rcT:#82edb6;--rcIcA:rgba(67,214,147,.46);--rcIcB:rgba(67,214,147,.12)}
.reco.flow.attention{--rcA:rgba(237,180,78,.24);--rcB:rgba(237,180,78,.06);--rcT:#f3cd7d;--rcIcA:rgba(237,180,78,.46);--rcIcB:rgba(237,180,78,.12)}
.reco.flow.crit{--rcA:rgba(240,99,122,.24);--rcB:rgba(240,99,122,.06);--rcT:#f693a8;--rcIcA:rgba(240,99,122,.46);--rcIcB:rgba(240,99,122,.12)}
.reco.flow{margin-top:16px!important;border:none!important;box-shadow:none!important;border-radius:14px;padding:15px 14px 14px 13px;position:relative;
  background:linear-gradient(100deg,var(--rcA),var(--rcB) 42%,rgba(65,151,245,.12) 72%,transparent 94%)!important}
.hero .batt-head .t span{color:rgba(226,236,245,.6)!important}
/* Aktivitäts-Glyphen (sportgerecht statt Fake-Route) */
.act-glyph{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
.activity-visual[data-sport="Kraft"]{background:linear-gradient(135deg,#2a2411,#1b1712 60%,#241d10)}
.activity-visual[data-sport="Schwimmen"]{background:linear-gradient(135deg,#0d2f3d,#122436 55%,#0e2333)}
.activity-visual[data-sport="Radfahren"]{background:linear-gradient(135deg,#122f3d,#152643 52%,#241e43)}
.activity-visual[data-sport="Kraft"]:before,.activity-visual[data-sport="Kraft"]:after,.activity-visual[data-sport="Schwimmen"]:before,.activity-visual[data-sport="Schwimmen"]:after{opacity:.4}
.reco.flow::before{content:"";position:absolute;left:13px;right:13px;top:0;height:1px;background:linear-gradient(90deg,var(--rcA),rgba(255,255,255,.05) 55%,transparent)}
.reco.flow .rc-ic{background:linear-gradient(140deg,var(--rcIcA),var(--rcIcB))!important;color:#fff!important;box-shadow:0 6px 16px rgba(0,0,0,.20)}
.reco.flow .rt{color:var(--rcT)!important}
.reco.flow .rd,.reco.flow .prescription{color:rgba(231,240,248,.82)!important}

.tabbar{pointer-events:none}.tabwrap{pointer-events:auto;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,rgba(32,43,59,.72),rgba(12,18,29,.58));backdrop-filter:blur(28px) saturate(165%);-webkit-backdrop-filter:blur(28px) saturate(165%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.04),0 16px 36px rgba(0,0,0,.38)}
.tabwrap button{z-index:2;touch-action:none}.tabwrap button.on:before{display:none!important}
.glass-indicator{position:absolute;top:7px;bottom:7px;border-radius:21px;background:linear-gradient(145deg,rgba(255,255,255,.23),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 8px 18px rgba(0,0,0,.22);transition:left .32s cubic-bezier(.2,.9,.25,1),width .32s cubic-bezier(.2,.9,.25,1);z-index:1;pointer-events:none}

.page-head{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 10px) 18px 14px;background:linear-gradient(180deg,rgba(7,12,20,.96),rgba(7,12,20,.78),transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
[data-theme="light"] .page-head{background:linear-gradient(180deg,rgba(238,244,251,.97),rgba(238,244,251,.80),transparent)}
.page-head-row{display:flex;align-items:center;gap:12px}.backbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}.backbtn .ic{transform:rotate(180deg)}
.page-head h2{font-size:22px;letter-spacing:-.025em}.page-head p{font-size:11.5px;color:var(--muted);margin-top:2px}
.page-action{margin-left:auto;color:var(--gold-soft);font-size:12px;font-weight:800;cursor:pointer}
.page-intro{margin:2px 18px 16px;color:var(--muted);font-size:12.5px;line-height:1.48}

.setting-group{margin:0 18px 16px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(180deg,var(--card-1),var(--card-2));overflow:hidden;box-shadow:var(--shadow)}
.setting-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:850;margin:20px 20px 9px}
.setting-item{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--hair);cursor:pointer}.setting-item:last-child{border-bottom:0}.setting-item:active{background:var(--surface)}
.setting-icon{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--activity);flex:none}.setting-copy{flex:1;min-width:0}.setting-copy b{display:block;font-size:13.5px}.setting-copy span{display:block;color:var(--muted);font-size:11px;line-height:1.35;margin-top:2px}.setting-value{font-size:11.5px;color:var(--muted);font-weight:750;text-align:right;max-width:105px}.setting-value.good{color:var(--ready)}
.toggle{width:46px;height:27px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid var(--border);padding:2px;cursor:pointer;transition:.2s;flex:none}.toggle:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.3);transition:.2s}.toggle.on{background:var(--ready);border-color:var(--ready)}.toggle.on:after{transform:translateX(19px)}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 14px}.choice{padding:13px 7px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:700 12px var(--font);cursor:pointer}.choice.on{background:linear-gradient(135deg,rgba(90,160,240,.2),rgba(67,214,147,.12));border-color:rgba(90,160,240,.55);color:var(--text)}

/* Profil-Cover (2026-08-05, Nutzerwunsch „so wie im Beispiel"): Athleten-Artwork
   als vollflaechiges Hero-Bild. Bild lokal (assets/brand, 1280x640 JPEG, precached)
   — kein externer Request.
   Asset: aus dem 2.5:1-Original auf exakt 2:1 beschnitten (leere linke Bildhaelfte
   entfernt). Zusammen mit aspect-ratio:2/1 heisst das NULL Beschnitt durch cover —
   die Athletengruppe inkl. der erhobenen Hand bleibt auf JEDER Geraetebreite
   vollstaendig im Bild. Eine feste Hoehe wuerde den Ausschnitt breitenabhaengig
   verschieben und die Hand auf schmalen Geraeten abschneiden.
   1280px Breite deckt 390 CSS-px bei 3x DPR (1170 Geraete-px) voll ab.
   Kein margin-top mehr: der fruehere -55px-Zug hat 55px Bild ausserhalb des
   Viewports versteckt (gemessen: nur 93px von 148px sichtbar).
   Scrims: oben schwach (Status-Bar im Standalone-PWA), unten Ausblendung bis auf
   die Seitenfarbe — dadurch kein harter Schnittrand und Avatar/Buttons, die auf der
   Bildunterkante liegen, bleiben lesbar. rgba(var(--bg-rgb)) statt hartem #08090b,
   damit der Verlauf auch im Light-Theme zur Seitenfarbe passt.
   Die alten Verlaeufe bleiben als Fallback, falls das Bild nicht laedt. */
.profile-cover{aspect-ratio:2/1;min-height:150px;max-height:230px;background:linear-gradient(180deg,rgba(var(--bg-rgb),.38) 0%,rgba(var(--bg-rgb),0) 20%,rgba(var(--bg-rgb),0) 52%,rgba(var(--bg-rgb),.35) 78%,rgba(var(--bg-rgb),.88) 94%,rgba(var(--bg-rgb),1) 100%),url('assets/brand/profile-cover.jpg') center center/cover no-repeat,radial-gradient(circle at 15% 50%,rgba(67,214,147,.35),transparent 28%),radial-gradient(circle at 85% 30%,rgba(149,133,237,.38),transparent 33%),linear-gradient(135deg,#0c5a75,#13335c 55%,#231b48)}
/* -88px = exakt die Avatarhoehe ⇒ Avatar-Unterkante schliesst mit der Bildunterkante
   ab (Referenz), Aktions-Buttons liegen auf der abgedunkelten Bildunterkante. */
.ig-profile{padding:0 18px;margin-top:-88px}.ig-top{display:flex;align-items:flex-end;justify-content:space-between}.ig-avatar{width:88px;height:88px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--ready),var(--activity),var(--sleep));box-shadow:0 0 0 4px var(--bg)}.ig-avatar span{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#20324a,#101925);font-size:26px;font-weight:850;color:#fff}
/* Bugfix (2026-08-05, Nutzer-Screenshot): .ig-avatar hatte als EINZIGE Avatar-Stelle keine
   img-Regel (.avatar/.ob-avatar/.tb-avatar/.pc-ava haben sie alle) — ein echtes Profilfoto
   rendert dann in Naturgröße über den Profilkopf statt im 88px-Kreis. */
.ig-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.ig-actions{display:flex;gap:8px}.mini-btn{height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font:750 12px var(--font);cursor:pointer}.mini-btn.primary{background:var(--text);color:var(--bg)}
.ig-name{font-size:21px;font-weight:850;margin-top:13px}.ig-handle{font-size:12px;color:var(--activity);font-weight:750;margin-top:1px}.ig-bio{font-size:12.5px;color:var(--muted);line-height:1.48;margin-top:8px}.ig-stats{display:grid;grid-template-columns:repeat(4,1fr);padding:15px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-top:15px}.ig-stat{text-align:center}.ig-stat b{display:block;font-size:17px}.ig-stat span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.sport-chips{display:flex;gap:7px;overflow-x:auto;padding:1px 18px 12px;scrollbar-width:none}.sport-chip{white-space:nowrap;padding:8px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:11px;font-weight:750;color:var(--muted)}.sport-chip.on{color:var(--text);border-color:rgba(90,160,240,.45);background:var(--activity-t)}
.goal-stack{display:grid;gap:9px;margin:0 18px 16px}.goal-card{padding:15px;border-radius:18px;background:linear-gradient(140deg,rgba(201,174,124,.15),rgba(90,160,240,.08),var(--card-2));border:1px solid rgba(201,174,124,.21)}.goal-card .goal-top{display:flex;justify-content:space-between;gap:10px}.goal-card h4{font-size:14px}.goal-card p{font-size:11px;color:var(--muted);margin-top:4px}.goal-badge{font-size:9px;font-weight:850;color:var(--gold-soft);padding:4px 7px;border-radius:7px;background:rgba(201,174,124,.13);height:max-content}.goal-line{height:6px;background:var(--surface-2);border-radius:5px;margin-top:12px;overflow:hidden}.goal-line i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--activity));border-radius:5px}

.plan-hero{margin:6px 18px 15px;padding:18px;border-radius:24px;background:radial-gradient(circle at 90% 0,rgba(90,160,240,.28),transparent 40%),linear-gradient(145deg,#142536,#0c151f);border:1px solid rgba(90,160,240,.18)}.plan-kicker{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--activity);font-weight:850}.plan-hero h2{font-size:21px;margin-top:5px}.plan-hero p{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.42}.week-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.wp{padding:9px 5px;border-radius:11px;background:rgba(255,255,255,.055);text-align:center}.wp b{display:block;font-size:14px}.wp span{font-size:8.5px;color:var(--muted)}
.week-days{display:flex;gap:7px;overflow-x:auto;padding:0 18px 13px;scrollbar-width:none}.week-day{min-width:47px;padding:9px 4px;border-radius:14px;border:1px solid var(--border);background:var(--surface);text-align:center;color:var(--muted)}.week-day b{display:block;font-size:12px}.week-day span{font-size:9px}.week-day.on{background:var(--activity-t);border-color:rgba(90,160,240,.45);color:var(--text)}.week-day.rest{border-color:rgba(149,133,237,.38)}
.plan-list{display:grid;gap:9px;margin:0 18px 16px}.session-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid var(--border);cursor:pointer}.session-card.done{border-color:rgba(67,214,147,.25)}.session-card.rest{background:linear-gradient(135deg,rgba(149,133,237,.13),var(--card-2))}.session-ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--activity-t);color:var(--activity);flex:none}.session-card.done .session-ico{color:var(--ready);background:var(--ready-t)}.session-main{flex:1;min-width:0}.session-main b{font-size:13px}.session-main p{font-size:10.5px;color:var(--muted);margin-top:3px}.session-state{font-size:9px;font-weight:850;padding:4px 7px;border-radius:7px;background:var(--surface-2);color:var(--muted)}.session-state.done{background:var(--ready-t);color:var(--ready)}
.daily-goals{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 18px 16px}.daily-goal{padding:13px;border:1px solid var(--border);border-radius:16px;background:var(--card-1)}.daily-goal .dg-top{display:flex;align-items:center;justify-content:space-between}.daily-goal .dg-top span{font-size:10px;color:var(--muted)}.daily-goal b{font-size:17px;display:block;margin-top:7px}.daily-goal .mini-track{height:5px;background:var(--surface-2);border-radius:4px;margin-top:8px;overflow:hidden}.daily-goal .mini-track i{height:100%;display:block;background:linear-gradient(90deg,var(--activity),var(--ready));border-radius:4px}
.stepper-row{display:flex;align-items:center;gap:13px;padding:14px 15px;border-bottom:1px solid var(--hair)}.stepper-row:last-child{border:0}.stepper-info{flex:1}.stepper-info b{font-size:13px}.stepper-info span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:18px;cursor:pointer}.stepper strong{min-width:64px;text-align:center;font-size:12px}

.activity-summary{margin:4px 18px 14px;padding:18px;border-radius:23px;background:radial-gradient(circle at 95% 0,rgba(67,214,147,.22),transparent 42%),linear-gradient(145deg,#10253a,#0b151f);border:1px solid rgba(67,214,147,.16)}.activity-summary h2{font-size:22px}.activity-summary>p{font-size:11px;color:var(--muted);margin-top:4px}.as-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.as-grid div{padding:10px 6px;background:rgba(255,255,255,.05);border-radius:11px;text-align:center}.as-grid b{display:block;font-size:15px}.as-grid span{font-size:8.5px;color:var(--muted)}
.filter-row{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none}.filter-pill{white-space:nowrap;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:750 11px var(--font);cursor:pointer}.filter-pill.on{color:#0b1823;background:linear-gradient(135deg,var(--gold-soft),var(--gold));border-color:transparent}
.activity-list{display:grid;gap:10px;margin:0 18px 16px}.activity-card{border:1px solid var(--border);border-radius:20px;background:linear-gradient(180deg,var(--card-1),var(--card-2));overflow:hidden;cursor:pointer}.activity-visual{height:82px;position:relative;background:linear-gradient(135deg,#122f3d,#152643 52%,#241e43);overflow:hidden}.activity-visual:before,.activity-visual:after{content:"";position:absolute;height:2px;background:rgba(255,255,255,.13);transform:rotate(-14deg);width:120%;left:-10%;top:36%}.activity-visual:after{transform:rotate(23deg);top:70%}.route-mini{position:absolute;inset:14px 28px;border:3px solid var(--ready);border-radius:48% 30% 55% 35%;transform:rotate(-8deg);box-shadow:0 0 15px rgba(67,214,147,.28)}.activity-body{padding:14px}.activity-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.activity-body h3{font-size:14px}.activity-body p{font-size:10.5px;color:var(--muted);margin-top:3px}.activity-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.activity-metrics div{padding:8px 3px;border-radius:10px;background:var(--surface);text-align:center}.activity-metrics b{display:block;font-size:11.5px}.activity-metrics span{font-size:7.5px;color:var(--muted)}
.route-map{height:255px;position:relative;overflow:hidden;background-color:#15202b;background-image:linear-gradient(31deg,transparent 44%,rgba(180,196,210,.11) 45%,rgba(180,196,210,.11) 48%,transparent 49%),linear-gradient(-26deg,transparent 34%,rgba(180,196,210,.09) 35%,rgba(180,196,210,.09) 39%,transparent 40%),repeating-linear-gradient(90deg,transparent 0 42px,rgba(255,255,255,.035) 43px 45px),repeating-linear-gradient(0deg,transparent 0 48px,rgba(255,255,255,.03) 49px 51px)}
.route-seg{position:absolute;height:5px;border-radius:7px;background:#f6fbff;box-shadow:0 0 0 1px rgba(9,18,28,.35),0 0 11px rgba(255,255,255,.28);transform-origin:left center}
.detail-title{padding:18px}.detail-title h1{font-size:23px}.detail-title p{font-size:11px;color:var(--muted);margin-top:4px}.detail-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 15px}.detail-kpis div{padding:12px 6px;background:var(--surface);border:1px solid var(--border);border-radius:13px;text-align:center}.detail-kpis b{font-size:15px;display:block}.detail-kpis span{font-size:8px;color:var(--muted)}
.coach-card{margin:0 18px 15px;padding:16px;border-radius:19px;background:linear-gradient(140deg,rgba(149,133,237,.17),rgba(90,160,240,.10),var(--card-2));border:1px solid rgba(149,133,237,.25)}.coach-card h3{font-size:13.5px}.coach-card p{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:7px}.coach-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.coach-tags span{font-size:9px;padding:5px 7px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.split-list{margin-top:8px}.split-row{display:grid;grid-template-columns:28px 1fr 55px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:10.5px}
/* GM7.7: optionale Ø-HF je Runde als eigene, umbruchfreie Spalte */
.split-row.has-hr{grid-template-columns:28px 1fr 52px 52px}
.split-row .sp-hr{text-align:right;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.splitbar{height:22px;background:linear-gradient(90deg,var(--cyan),var(--activity));border-radius:6px;opacity:.85}.split-row strong{text-align:right}

.decision-hero{margin:5px 18px 14px;padding:19px;border-radius:24px;background:radial-gradient(circle at 90% 0,rgba(149,133,237,.30),transparent 42%),radial-gradient(circle at 8% 100%,rgba(67,214,147,.20),transparent 38%),linear-gradient(145deg,#12273a,#111826);border:1px solid rgba(149,133,237,.22)}.decision-hero .eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sleep);font-weight:850}.decision-hero h2{font-size:21px;line-height:1.15;margin-top:6px}.decision-hero p{font-size:12px;color:var(--muted);line-height:1.47;margin-top:8px}.decision-actions{display:flex;gap:7px;margin-top:12px}.decision-actions button{flex:1;padding:10px 8px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:750 10.5px var(--font);cursor:pointer}
.insight-card{margin:0 18px 10px;padding:15px;border:1px solid var(--border);border-radius:18px;background:var(--card-1)}.insight-head{display:flex;gap:10px;align-items:center}.insight-head span:first-child{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--activity)}.insight-head b{font-size:13px}.insight-card p{font-size:11px;color:var(--muted);line-height:1.48;margin-top:8px}.impact{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font-size:10px;color:var(--muted)}.impact>span{flex:0 0 auto;white-space:nowrap}.impact strong{color:var(--ready);flex:1 1 auto;min-width:0;text-align:right;line-height:1.35}
/* ^ Phase 4 (2026-08-05, Gap-Analyse P2-2c): .impact war Flex ohne gap/min-width/text-align —
   der lange Empfehlungstext wuchs über seine Basis hinaus und verschmolz mit dem Label. */
.danger-link{margin:18px;color:var(--crit);font-size:12px;text-align:center;font-weight:800;cursor:pointer}

/* ============ ORVIA v5 – Ausbau ============ */
/* Liquid Bar Upgrade */
.tabwrap{background:linear-gradient(150deg,rgba(40,54,73,.60),rgba(14,20,31,.50) 55%,rgba(9,14,22,.62))!important;
  backdrop-filter:blur(36px) saturate(190%) brightness(1.08)!important;-webkit-backdrop-filter:blur(36px) saturate(190%) brightness(1.08)!important;
  border:1px solid rgba(255,255,255,.14)!important;
  box-shadow:inset 0 1.4px .5px rgba(255,255,255,.5),inset 0 -14px 22px rgba(6,10,18,.5),0 22px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35)!important;position:relative}
.tabwrap::after{content:"";position:absolute;left:12%;right:12%;bottom:2px;height:12px;border-radius:50%;pointer-events:none;background:radial-gradient(60% 100% at 50% 100%,rgba(150,190,255,.22),transparent 70%);filter:blur(3px)}
.glass-indicator{background:linear-gradient(150deg,rgba(201,174,124,.34),rgba(255,255,255,.10) 55%,rgba(201,174,124,.14))!important;border:1px solid rgba(255,255,255,.22)!important;box-shadow:inset 0 1px .5px rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.3)!important}
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){.tabwrap{background:rgba(13,19,29,.97)!important}}
[data-theme="light"] .tabwrap{background:linear-gradient(150deg,rgba(255,255,255,.66),rgba(228,238,250,.5) 55%,rgba(214,228,244,.6))!important;border-color:rgba(90,110,140,.22)!important;box-shadow:inset 0 1.4px .5px rgba(255,255,255,.9),0 20px 44px rgba(30,50,90,.22)!important}
[data-theme="light"] .tabwrap button{color:#5b6675}[data-theme="light"] .tabwrap button.on{color:#2a3242}
.tabspacer{height:44px}

/* generische Bausteine */
.seg-nav{display:flex;gap:5px;margin:2px 18px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:5px}
.seg-btn{flex:1;font-family:var(--font);font-size:12.5px;font-weight:750;color:var(--muted);background:none;border:none;padding:9px 4px;border-radius:10px;cursor:pointer;transition:.16s}
.seg-btn.on{background:linear-gradient(160deg,rgba(201,174,124,.9),#b6975f);color:#20180a;box-shadow:0 4px 12px rgba(201,174,124,.3)}
[data-theme="light"] .seg-btn{color:#5b6675}
.ana-kick{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft)}
.ana-sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.body-head,.hub-head{padding:2px 18px 4px}
.mini-note{display:flex;gap:8px;align-items:flex-start;margin:10px 18px 2px;font-size:11.5px;line-height:1.5;color:var(--muted)}.mini-note .ic{flex:0 0 auto;width:14px;height:14px;margin-top:1px;color:var(--faint)}.mini-note b{color:var(--text)}

/* KPI-Grid */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin:0 18px 12px}
.kpi{background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;min-width:0}
.kpi b{display:block;font-size:17px;font-weight:820;letter-spacing:-.02em}
/* Phase 4 (2026-08-05, Gap-Analyse P2-2a): lange Einzelwörter („PLANERFÜLLUNG") liefen
   bei 4 Kacheln über die Kachelbreite hinaus — Umbruch/Trennung statt Überlauf. */
.kpi span{display:block;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-top:3px;overflow-wrap:anywhere;hyphens:auto;line-height:1.2}
.kpi small{display:block;font-size:10px;color:var(--muted);margin-top:2px}

/* Aktivitäten-Hub */
.hub-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 18px 14px}
.hub-act{display:flex;align-items:center;gap:10px;padding:13px 13px;border-radius:15px;background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid var(--border);cursor:pointer;font-family:var(--font);text-align:left;color:var(--text);transition:transform .12s,border-color .2s}
.hub-act:active{transform:scale(.98)}
.hub-act .ha-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--surface-2);color:var(--gold-soft)}.hub-act .ha-ic .ic{width:18px;height:18px}
.hub-act b{font-size:13px;font-weight:780;display:block}.hub-act span{font-size:10.5px;color:var(--muted)}
.hub-act.primary{grid-column:1/-1;background:var(--gold-grad);border:none;color:#20180a;box-shadow:0 10px 26px rgba(201,174,124,.3)}
.hub-act.primary .ha-ic{background:rgba(0,0,0,.14);color:#20180a}.hub-act.primary span{color:rgba(32,24,10,.7)}
.subtabs{display:flex;gap:6px;margin:0 18px 12px}.subtabs button{flex:1;font-family:var(--font);font-size:12px;font-weight:720;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:11px;padding:8px;cursor:pointer}.subtabs button.on{color:var(--text);background:rgba(255,255,255,.12);border-color:var(--border-strong)}
.dist-bar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin:4px 0 8px;border:1px solid var(--border)}
.dist-bar i{height:100%}
.dist-leg{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--muted)}.dist-leg span{display:flex;align-items:center;gap:5px}.dist-leg i{width:9px;height:9px;border-radius:3px}

/* Start-Sheet */
.sport-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:4px}
.sport-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;border-radius:15px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-family:var(--font);color:var(--text);transition:transform .12s,border-color .2s}
.sport-tile:active{transform:scale(.97)}.sport-tile .st-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}.sport-tile .st-ic .ic{width:20px;height:20px}
.sport-tile b{font-size:12px;font-weight:740}
.prestart .ps-row{display:flex;justify-content:space-between;font-size:12.5px;padding:10px 2px;border-bottom:1px solid var(--hair)}.prestart .ps-row:last-child{border-bottom:none}.prestart .ps-row span{color:var(--muted)}.prestart .ps-row b{font-weight:750}
.mode-hint{display:flex;gap:8px;align-items:flex-start;background:var(--ready-t);border:1px solid rgba(67,214,147,.28);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--text);margin-top:10px}.mode-hint .ic{color:var(--ready);flex:0 0 auto;width:16px;height:16px;margin-top:1px}

/* Planvarianten */
.pvar-row{display:flex;gap:8px;margin:2px 18px 12px}
.pvar{flex:1;padding:11px 8px;border-radius:14px;background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid var(--border);cursor:pointer;text-align:center;font-family:var(--font);color:var(--text);position:relative;transition:.16s}
.pvar b{display:block;font-size:13px;font-weight:820}.pvar span{display:block;font-size:9.5px;color:var(--muted);margin-top:3px;letter-spacing:.03em}
.pvar.on{border-color:transparent;background:linear-gradient(160deg,rgba(90,160,240,.30),rgba(90,160,240,.08));box-shadow:0 8px 20px rgba(90,160,240,.18)}
.pvar.on:after{content:"";position:absolute;top:0;left:14px;right:14px;height:2px;border-radius:2px;background:var(--activity)}
.pill-badge{display:inline-block;font-size:9px;font-weight:820;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--activity-t);color:var(--activity)}
.pq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pq{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 11px}
.pq .pqt{font-size:10.5px;color:var(--muted);font-weight:650}.pq .pqv{font-size:14px;font-weight:800;margin-top:3px}
.pq-track{height:6px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}.pq-track i{display:block;height:100%;border-radius:4px}
/* v8-316: Grund fuer eine nicht bewertbare Kachel. Bewusst klein und gedaempft —
   es ist eine Erklaerung, keine Warnung: „nur eine Sportart aktiv" ist kein
   Mangel des Plans. */
.pq .pq-na{font-size:9.5px;color:var(--faint);margin-top:6px;line-height:1.25}
.fc-corridor{position:relative;height:70px;margin:12px 2px 6px;border-radius:12px;background:linear-gradient(180deg,rgba(90,160,240,.10),transparent);border:1px solid var(--border);overflow:hidden}
.fc-band{position:absolute;top:20px;bottom:20px;background:linear-gradient(90deg,rgba(67,214,147,.15),rgba(67,214,147,.35));border-radius:8px}
.fc-mid{position:absolute;top:10px;bottom:10px;width:2px;background:var(--ready)}
.fc-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin:0 2px}
.phase-track{display:flex;gap:4px;margin:10px 2px}
.phase{flex:1;border-radius:8px;padding:9px 6px;text-align:center;font-family:var(--font);background:var(--surface);border:1px solid var(--border);position:relative}
.phase.done{opacity:.6}.phase.now{border-color:var(--gold);background:linear-gradient(160deg,rgba(201,174,124,.22),transparent)}
.phase b{display:block;font-size:10.5px;font-weight:780}.phase span{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}
.vol-row{display:flex;align-items:flex-end;gap:7px;height:110px;padding:6px 4px 0;margin-top:6px}
.vol-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.vol-bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.vol-bars i{width:9px;border-radius:3px 3px 0 0}.vol-plan{background:rgba(255,255,255,.18)}.vol-act{background:var(--ready)}
.vol-col small{font-size:9px;color:var(--faint)}.vol-col b{font-size:10px;font-weight:750}

/* Muskelkarte */
.range-row,.body-toggle{display:flex;gap:6px;margin:8px 18px}
.range-chip{flex:1;font-family:var(--font);font-size:12px;font-weight:720;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:8px 3px;cursor:pointer}.range-chip.on{color:var(--text);background:rgba(255,255,255,.12);border-color:var(--border-strong)}
.body-toggle button{flex:1;font-family:var(--font);font-size:12.5px;font-weight:740;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:11px;padding:9px;cursor:pointer}.body-toggle button.on{color:#20180a;background:var(--gold-grad);border-color:transparent}
.body-wrap{display:flex;justify-content:center;padding:8px 0 2px}
.bodysvg{width:210px;height:auto;max-height:340px;touch-action:manipulation}
.bodysvg .sil{fill:rgba(255,255,255,.045);stroke:var(--hair);stroke-width:1}
[data-theme="light"] .bodysvg .sil{fill:rgba(20,40,70,.05);stroke:rgba(20,40,70,.12)}
.mgrp{cursor:pointer;outline:none}.mgrp:focus-visible rect{stroke:#fff;stroke-width:2}
.mgrp:hover rect,.mgrp:active rect{fill-opacity:1}
.mglyph{fill:#0b1119;font-size:11px;font-weight:900;text-anchor:middle;font-family:var(--font);pointer-events:none}
[data-theme="light"] .mglyph{fill:#0b1119}
.mlegend{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;margin:10px 18px 2px}
.mleg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-weight:600}.mleg i{width:11px;height:11px;border-radius:3px}
.mtiles{display:flex;flex-direction:column;gap:9px;padding:2px 18px}
.mtile{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:15px;background:linear-gradient(180deg,var(--card-1),var(--card-2));border:1px solid var(--border);cursor:pointer;font-family:var(--font);text-align:left;color:var(--text);width:100%;transition:transform .12s,border-color .2s}
.mtile:active{transform:scale(.99)}
.mtile-b{flex:1;min-width:0}.mtile-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:770}
.mstat{font-size:9.5px;font-weight:820;padding:3px 7px;border-radius:6px;letter-spacing:.03em}
.mtile-sub{font-size:11px;color:var(--muted);margin-top:3px}

.bt-dist{width:52px;text-align:center;flex:0 0 auto}.bt-dist b{font-size:15px;font-weight:840}.bt-dist span{font-size:9px;color:var(--faint);display:block}

#gmProfPage .page-head h2{white-space:normal;overflow:visible;text-overflow:clip;letter-spacing:-.025em}

/* GM5.2 — Referenzgeometrie der sechs Bestzeiten-/Meilenstein-Slots.
   Der Golden Master rendert diese Zeilen als <button>. Verbindlich ist der TATSÄCHLICHE
   Computed Style der unveränderten Referenz: font-family:Arial, font-size:13.3333px,
   text-align:center (UA-Defaults des Formularelements), padding 13px 14px, gap 12px,
   border 1px solid, border-radius 15px, margin-bottom 9px (.bt-row) bzw. 10px (.mile),
   Containerpadding 0 18px, X-Position 18px, Höhe 62px (.bt-row) bzw. 91px (.mile).
   Die Breite ist im GM eine Funktion des Demo-Inhalts. Da ORVIA ausschließlich echte Daten
   bzw. ehrliche Missingness anzeigt, wird die Geometrie vom Inhalt ENTKOPPELT: die sechs
   Slotbreiten sind feste Tokens, gemessen am unveränderten Golden Master und identisch bei
   430x900 und 390x844 (nachgemessen, nicht angenommen — die Referenzbreiten liegen unter der
   verfügbaren Inhaltsbreite von 394 bzw. 354 px). Keine Demo-Werte, keine Füllzeichen,
   keine Referenzmanipulation. */
/* GM5.3/GM5.4 (Historie): Der Golden Master enthaelt fuer .bt-row/.mile KEINE
   Autorenregel mit color — die UA-Buttonfarbe (buttontext -> schwarz) wurde hier
   zunaechst pixelgetreu uebernommen, bis zu einer expliziten Freigabe. GM7.9c:
   Freigabe erteilt (Auftraggeber, 2026-08-02) — .bt-row rendert jetzt lesbar auf
   dunklem Grund und wurde als eigenstaendige, moderne Listenzeile ueberarbeitet
   (weisse/goldene Werte statt schwarzem UA-Default, echte Icon-Chips statt der
   demo-breiten Golden-Master-Slots). GM7.9d: dieselbe Freigabe auf .mile
   (Meilensteine) ausgeweitet — identischer Lesbarkeitsfehler (buttontext auf
   dunklem Grund = unlesbar), jetzt auf dieselbe moderne Listenzeilen-Optik
   angeglichen (volle Breite statt Demo-Slotbreiten, Textfarbe aus dem
   UI-Farbsystem statt UA-Default). */
#gmProfPage .mile{
  box-sizing:border-box;overflow:hidden;width:100%;height:auto;min-height:91px;
  display:flex;align-items:flex-start;gap:12px;text-align:left;font-family:var(--font);
  padding:13px 14px;border-radius:16px;background:linear-gradient(180deg,var(--card-1),var(--card-2));
  border:1px solid var(--border);margin-bottom:10px;cursor:pointer}
#gmProfPage .mile:active{transform:scale(.985)}
#gmProfPage .mile .mi-ic{background:rgba(220,199,154,.10)}
#gmProfPage .mile-t{color:var(--text);font-size:14px;font-weight:800}
#gmProfPage .mile-d{color:var(--muted);font-size:11.5px;margin-top:2px;font-weight:600}
#gmProfPage .mile-meta span{color:var(--faint)}
/* GM7.9c: .bt-row — volle Breite, klare Typo-Hierarchie, Icon-Chip statt Demo-Slotbreite. */
#gmProfPage .bt-row{
  box-sizing:border-box;overflow:hidden;width:100%;height:auto;min-height:66px;
  display:flex;align-items:center;gap:13px;text-align:left;font-family:var(--font);
  padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,var(--card-1),var(--card-2));
  border:1px solid var(--border);margin-bottom:9px;cursor:pointer}
#gmProfPage .bt-row:active{transform:scale(.985)}
#gmProfPage .bt-dist{width:auto;min-width:50px;flex:0 0 auto;text-align:center;padding:8px 6px;
  border-radius:12px;background:rgba(220,199,154,.10)}
#gmProfPage .bt-dist b{font-size:16px;font-weight:850;color:var(--text)}
#gmProfPage .bt-dist span{font-size:9px;color:var(--muted);display:block;margin-top:1px;font-weight:700;letter-spacing:.02em}
#gmProfPage .bt-b{flex:1;min-width:0}
#gmProfPage .bt-time{font-size:19px;font-weight:850;color:var(--text);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#gmProfPage .bt-sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:650}
#gmProfPage .bt-imp{flex:0 0 auto;color:var(--faint);display:flex;align-items:center}
#gmProfPage .bt-row.bt-empty .bt-time{color:var(--faint)}
#gmProfPage .bt-row.bt-empty .bt-dist{background:rgba(255,255,255,.04)}
/* GM7.9d: feste Demo-Slotbreiten (Golden-Master-Pixelvertrag) entfallen — .mile ist jetzt
   wie .bt-row eine volle-Breite-Zeile (siehe #gmProfPage .mile oben), keine Slotgeometrie mehr. */
/* Kontrollierter Überlauf: der echte Wert bleibt vollständig im DOM erhalten und wird bei
   Bedarf ausschließlich visuell gekürzt (CSS-Ellipsis, keine Textmutation). Slot- und
   Kartenhöhe bleiben fix, kein Umbruch, kein horizontaler Überlauf. */
#gmProfPage .bt-row .bt-b,#gmProfPage .mile .mile-b{min-width:0}
#gmProfPage .bt-row .bt-time,#gmProfPage .bt-row .bt-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gmProfPage .mile .mile-t,#gmProfPage .mile .mile-d{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gmProfPage .mile .mile-meta{overflow:hidden}
#gmProfPage .mile .mile-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.page-head h2{margin:0;font-size:22px;line-height:normal}
.page-head p{margin:2px 0 0}
.page-head p{margin:2px 0 0;line-height:1.2}

/* Phasen-Redesign (2026-08-05, Nutzerentscheidung): ersetzt die frueheren engen Text-Chips
   (.phase-track/.phase — dort passte kein Phasenname in ~60 px, weder mit Ellipsis noch mit

   neutralisieren. Korrektur: Im GM sind Tabbar/FAB auf Vollseiten (.phone.subpage) komplett
   ausgeblendet (display:none!important) statt "darunter" zu liegen — z-index muss daher ÜBER
   .tabbar (35) und .fab (51) liegen, sonst überdecken Tabbar/FAB die Vollseite sichtbar. */
.gm-page{z-index:140}
/* GM7.9e: Das GM blendet Tabbar/FAB auf jeder Vollseite komplett aus (.phone.subpage
   → display:none!important). Der z-index allein genuegt nicht: #gmProfPage liegt in
   #tab-mehr, das bei geoeffnetem Profil selbst einen Stapelkontext (z-index:30) bildet
   und die Seite dadurch unter der Tabbar einsperrt — sichtbar als Tabbar/FAB ueber der
   Einstellungsseite. Diese Regel bildet das GM-Verhalten direkt ab, unabhaengig von
   Stapelkontexten. */
body:has(.gm-page.on) .tabbar,
body:has(.gm-page.on) .fab,
body:has(.gm-story.on) .tabbar,
body:has(.gm-story.on) .fab{display:none!important}
